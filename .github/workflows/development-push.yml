name: Development Push Validation

# Post-merge smoke validation of `development`. PR Validation certifies each PR against its
# merge ref, but nothing re-validated the branch head after merges landed in sequence.
# Scope is deliberately minimal (normative + static guards + secret scan, .NET build and the
# unit/architecture/non-PostgreSQL contract tests). Foundation CI on the promotion PR to `main`
# remains the authoritative 13-job gate; this workflow produces no REL-000 evidence.

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normative:
    name: Validate normative baseline and CI tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate canonical contracts
        run: python ./docs/normative/v0.6/tools/validate_contracts.py

      - name: Test CI tooling
        run: python -m unittest discover -s ./tools/ci -p "test_*.py" -v

      - name: Test AZR-001 static guard tooling
        run: python -m unittest discover -s ./tools/azr-001 -p "test_*.py" -v

      - name: Secret scan of pushed history (Gitleaks 8.30.1 pinned by digest)
        shell: bash
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE_SHA}..${TESTED_SHA}"
          else
            range="${TESTED_SHA}^..${TESTED_SHA}"
          fi
          echo "scope=introduced history (${range})"
          docker run --rm -v "${GITHUB_WORKSPACE}:/scan:ro" -w /scan \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "${GITLEAKS_IMAGE}" git /scan --config /scan/.gitleaks.toml --no-banner --redact --log-opts="${range}"

  dotnet:
    name: Build and test .NET (unit, architecture, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Same category filter as the Foundation/PR Validation `dotnet` job: everything that does not
      # need PostgreSQL, MinIO or a browser (those run in the dedicated Foundation jobs).
      - name: Test
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --filter "Category!=PostgreSqlContract&Category!=OutboxSignalRDelivery&Category!=SecureProofUpload&Category!=DriverStopsPwa&Category!=DriverOfflineOperationsPwa&Category!=PublicTrackingPostgreSql&Category!=PublicTrackingPwa&Category!=OperationsDashboardPostgreSql&Category!=OperationsDashboardPwa&Category!=OpsDeliverySimulation"
          --logger "trx;LogFilePrefix=dotnet"
          --results-directory ./TestResults/dotnet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-push-dotnet-results
          path: ./TestResults/dotnet
          if-no-files-found: ignore
          retention-days: 7
