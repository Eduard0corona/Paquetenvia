name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  normative:
    name: Validate normative baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate canonical contracts
        run: python ./docs/normative/v0.6/tools/validate_contracts.py

      - name: Verify AI-06 checksum
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-06_SCHEMA.sql | cut -d ' ' -f 1)"
          test "$actual" = "7411de7838d7ccc53e22e53980d5de88cebc1c6140e208fa4df33d09795f5163"

      - name: Verify AI-18 remains unchanged
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-18_DATABASE_ROLE_MODEL.sql | cut -d ' ' -f 1)"
          test "$actual" = "38f0bf14fdb3ad723232d83121cda705f91363b14ed722c0c2f2f3d7189046dd"

  dotnet:
    name: Build and test .NET
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --filter "Category!=PostgreSqlContract&Category!=OutboxSignalRDelivery&Category!=SecureProofUpload&Category!=DriverStopsPwa&Category!=DriverOfflineOperationsPwa&Category!=PublicTrackingPostgreSql&Category!=PublicTrackingPwa&Category!=OperationsDashboardPostgreSql&Category!=OperationsDashboardPwa&Category!=OpsDeliverySimulation"

  runtime-contracts:
    name: Validate runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked contract dependencies
        run: dotnet restore ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --locked-mode

      - name: Restore locked secure proof dependencies
        run: dotnet restore ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --locked-mode

      - name: Build contract tests
        run: dotnet build ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --configuration Release --no-restore

      - name: Build secure proof tests
        run: dotnet build ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --configuration Release --no-restore

      - name: Execute PostgreSQL runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSqlContract"
          --logger "trx;LogFileName=runtime-contracts.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Execute secure proof runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=SecureProofUpload"
          --logger "trx;LogFileName=secure-proof-runtime.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Capture Testcontainers diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed runtime test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-test-results
          path: ./TestResults/runtime-contracts
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Testcontainers resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  web:
    name: Validate web workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Test
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web build

  realtime-e2e:
    name: Validate real SignalR reconnect
    runs-on: ubuntu-latest
    env:
      PAQUETERIA_TEST_HOST_DLL: ${{ github.workspace }}/tests/Paqueteria.RealtimeTestHost/bin/Release/net10.0/Paqueteria.RealtimeTestHost.dll
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore controlled host
        run: dotnet restore ./tests/Paqueteria.RealtimeTestHost/Paqueteria.RealtimeTestHost.csproj --locked-mode

      - name: Build controlled host
        run: dotnet build ./tests/Paqueteria.RealtimeTestHost/Paqueteria.RealtimeTestHost.csproj --configuration Release --no-restore

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Execute real reconnect lifecycle
        run: pnpm --dir apps/web test:realtime-e2e

  outbox-signalr-delivery:
    name: Validate outbox SignalR delivery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked integration dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build real delivery tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen SignalR browser client
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute PostgreSQL outbox delivery in a real browser
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OutboxSignalRDelivery"
          --logger "trx;LogFileName=outbox-signalr-delivery.trx"
          --results-directory ./TestResults/outbox-signalr-delivery

      - name: Capture delivery diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed delivery results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-signalr-delivery-results
          path: ./TestResults/outbox-signalr-delivery
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean delivery resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  driver-stops-pwa:
    name: Validate driver PWA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked integration dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build driver PWA tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute stops, offline operations and real DriverHub flows
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=DriverStopsPwa|Category=DriverOfflineOperationsPwa"
          --logger "trx;LogFileName=driver-stops-pwa.trx"
          --results-directory ./TestResults/driver-stops-pwa

      - name: Capture driver stops diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed driver stops results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driver-stops-pwa-results
          path: ./TestResults/driver-stops-pwa
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean driver stops resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  public-tracking:
    name: Validate public tracking
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked integration dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build public tracking tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute PostgreSQL lifecycle and HTTP contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=PublicTrackingPostgreSql"
          --logger "trx;LogFileName=public-tracking-postgresql.trx"
          --results-directory ./TestResults/public-tracking

      - name: Execute bounded TrackingHub lifetime
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~Tracking_maximum_lifetime_bounds"
          --logger "trx;LogFileName=public-tracking-lifetime.trx"
          --results-directory ./TestResults/public-tracking

      - name: Execute real outbox publication and reconnect
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OutboxSignalRDelivery"
          --logger "trx;LogFileName=public-tracking-outbox.trx"
          --results-directory ./TestResults/public-tracking

      - name: Execute public tracking in a real browser
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=PublicTrackingPwa"
          --logger "trx;LogFileName=public-tracking-pwa.trx"
          --results-directory ./TestResults/public-tracking

      - name: Capture public tracking diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed public tracking results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-tracking-test-results
          path: ./TestResults/public-tracking
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean public tracking resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  operations-dashboard:
    name: Validate operations dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked operations dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build operations dashboard tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute PostgreSQL and HTTP dashboard contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OperationsDashboardPostgreSql"
          --logger "trx;LogFileName=operations-dashboard-postgresql.trx"
          --results-directory ./TestResults/operations-dashboard

      - name: Execute operations dashboard in a real browser
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OperationsDashboardPwa"
          --logger "trx;LogFileName=operations-dashboard-pwa.trx"
          --results-directory ./TestResults/operations-dashboard

      - name: Capture redacted operations diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --format '{{.ID}} {{.Image}} {{.Status}}'

      - name: Publish failed operations dashboard results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operations-dashboard-test-results
          path: ./TestResults/operations-dashboard
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean operations dashboard resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  delivery-simulation:
    name: Validate 20-delivery simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked simulation dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build delivery simulation
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Execute two real 20-delivery runs
        env:
          MSBUILDDISABLENODEREUSE: "1"
          OPS001_REPORT_PATH: ${{ github.workspace }}/TestResults/delivery-simulation/ops001-delivery-simulation.json
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OpsDeliverySimulation"
          --logger "trx;LogFileName=delivery-simulation.trx"
          --results-directory ./TestResults/delivery-simulation

      - name: Capture redacted simulation diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --format '{{.ID}} {{.Image}} {{.Status}}'

      - name: Publish simulation results and redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-simulation-results
          path: ./TestResults/delivery-simulation
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean delivery simulation resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  infrastructure:
    name: Validate local infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate synthetic CI environment
        shell: pwsh
        run: |
          $projectName = "paquetenvia-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          Get-Content ./deploy/.env.example |
            ForEach-Object {
              if ($_ -match '^COMPOSE_PROJECT_NAME=') {
                "COMPOSE_PROJECT_NAME=$projectName"
              }
              else {
                $_
              }
            } |
            Set-Content ./deploy/.env.ci -Encoding utf8

      - name: Validate Compose configuration
        shell: pwsh
        run: >-
          docker compose
          --env-file ./deploy/.env.ci
          --file ./deploy/docker-compose.yml
          config --quiet

      - name: Run infrastructure smoke and persistence tests
        shell: pwsh
        run: >-
          ./tools/test-local-environment.ps1
          -EnvironmentFile ./deploy/.env.ci
          -CI
          -TimeoutSeconds 300

      - name: Capture infrastructure diagnostics
        if: failure()
        shell: pwsh
        run: |
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml ps --all
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml logs --tail 200

      - name: Clean infrastructure resources
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./deploy/.env.ci) {
            docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml down --volumes --remove-orphans
            Remove-Item ./deploy/.env.ci -Force
          }

  backup-restore:
    name: Validate backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      OPS002_SOURCE_ENV_FILE: ${{ runner.temp }}/ops002-source.env
      OPS002_TARGET_ENV_FILE: ${{ runner.temp }}/ops002-target.env
      OPS002_IDENTITY_FILE: ${{ runner.temp }}/ops002-age-identity.txt
      OPS002_RESULTS_DIRECTORY: ${{ runner.temp }}/ops002-results
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) {
            throw "OPS-002 requires PowerShell 7."
          }

      - name: Install checksum-pinned age 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/age-v1.3.1"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" \
            | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" --strip-components=1
          test -x "$install_dir/age"
          test -x "$install_dir/age-keygen"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore locked dependencies
        run: dotnet restore Paqueteria.sln --locked-mode

      - name: Generate isolated synthetic environments and identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
          $databaseUser = "ops002_$($suffix.Replace('-', '_'))"
          $sourceAccessKey = "ops002$([Guid]::NewGuid().ToString('N'))"
          $targetAccessKey = "ops002$([Guid]::NewGuid().ToString('N'))"
          $sourcePassword = "synthetic-source-$([Guid]::NewGuid().ToString('N'))"
          $targetPassword = "synthetic-target-$([Guid]::NewGuid().ToString('N'))"
          @"
          COMPOSE_PROJECT_NAME=ops002-source-$suffix
          POSTGRES_HOST_PORT=15432
          POSTGRES_DB=ops002_source
          POSTGRES_USER=$databaseUser
          POSTGRES_PASSWORD=$sourcePassword
          REDIS_HOST_PORT=16379
          REDIS_PASSWORD=$sourcePassword
          MINIO_API_HOST_PORT=19000
          MINIO_CONSOLE_HOST_PORT=19001
          MINIO_ROOT_USER=$sourceAccessKey
          MINIO_ROOT_PASSWORD=$sourcePassword
          MINIO_BUCKET=ops002-source-$suffix
          AWS_ACCESS_KEY_ID=$sourceAccessKey
          AWS_SECRET_ACCESS_KEY=$sourcePassword
          ProofStorage__Provider=S3Compatible
          ProofStorage__ThreatScanner=Synthetic
          ProofStorage__ServiceUrl=http://127.0.0.1:19000
          ProofStorage__PublicPresignUrl=http://127.0.0.1:19000
          ProofStorage__Region=us-east-1
          ProofStorage__Bucket=ops002-source-$suffix
          ProofStorage__ProcessingIntervalSeconds=5
          ProofStorage__StaleValidationSeconds=300
          ProofStorage__MaximumConcurrency=4
          MAIL_SMTP_HOST_PORT=11025
          MAIL_UI_HOST_PORT=18025
          "@ | Set-Content -LiteralPath $env:OPS002_SOURCE_ENV_FILE -Encoding utf8NoBOM
          @"
          COMPOSE_PROJECT_NAME=ops002-target-$suffix
          POSTGRES_HOST_PORT=25432
          POSTGRES_DB=ops002_bootstrap
          POSTGRES_USER=$databaseUser
          POSTGRES_PASSWORD=$targetPassword
          REDIS_HOST_PORT=26379
          REDIS_PASSWORD=$targetPassword
          MINIO_API_HOST_PORT=29000
          MINIO_CONSOLE_HOST_PORT=29001
          MINIO_ROOT_USER=$targetAccessKey
          MINIO_ROOT_PASSWORD=$targetPassword
          MINIO_BUCKET=ops002-target-$suffix
          AWS_ACCESS_KEY_ID=$targetAccessKey
          AWS_SECRET_ACCESS_KEY=$targetPassword
          ProofStorage__Provider=S3Compatible
          ProofStorage__ThreatScanner=Synthetic
          ProofStorage__ServiceUrl=http://127.0.0.1:29000
          ProofStorage__PublicPresignUrl=http://127.0.0.1:29000
          ProofStorage__Region=us-east-1
          ProofStorage__Bucket=ops002-target-$suffix
          ProofStorage__ProcessingIntervalSeconds=5
          ProofStorage__StaleValidationSeconds=300
          ProofStorage__MaximumConcurrency=4
          MAIL_SMTP_HOST_PORT=21025
          MAIL_UI_HOST_PORT=28025
          "@ | Set-Content -LiteralPath $env:OPS002_TARGET_ENV_FILE -Encoding utf8NoBOM
          & age-keygen --output $env:OPS002_IDENTITY_FILE 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to generate the ephemeral age identity."
          }
          & chmod 600 -- `
            $env:OPS002_SOURCE_ENV_FILE `
            $env:OPS002_TARGET_ENV_FILE `
            $env:OPS002_IDENTITY_FILE
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to restrict ephemeral credential file permissions."
          }

      - name: Execute encrypted backup and clean restore drill
        shell: pwsh
        run: ./tools/test-backup-restore.ps1 -CI -TimeoutSeconds 1500

      - name: Capture redacted backup diagnostics
        if: failure()
        shell: bash
        run: |
          docker ps --all --format '{{.ID}} {{.Image}} {{.Status}}'

      - name: Publish only encrypted artifact and redacted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops002-backup-restore-results
          path: |
            ${{ runner.temp }}/ops002-results/**/*.json
            ${{ runner.temp }}/ops002-results/encrypted-backup/*.tar.gz.age
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean backup and restore resources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./tools/local-environment.common.ps1
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          foreach ($environmentFile in @(
            $env:OPS002_SOURCE_ENV_FILE,
            $env:OPS002_TARGET_ENV_FILE
          )) {
            if (-not (Test-Path -LiteralPath $environmentFile)) {
              continue
            }
            try {
              $context = Get-LocalEnvironmentContext `
                -ComposeFile ./deploy/docker-compose.yml `
                -EnvironmentFile $environmentFile
              Invoke-DockerCompose -Context $context -Arguments @(
                "down", "--volumes", "--remove-orphans"
              ) -AllowFailure | Out-Null
              Assert-ProjectResourcesAbsent -ProjectName $context.ProjectName
            }
            catch {
              $cleanupFailures.Add("A project-scoped Compose cleanup failed.")
            }
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP `
            -Directory -Filter "paquetenvia-ops002-*" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }
          Remove-Item -LiteralPath $env:OPS002_IDENTITY_FILE -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:OPS002_SOURCE_ENV_FILE -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:OPS002_TARGET_ENV_FILE -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $env:OPS002_IDENTITY_FILE) {
            throw "Ephemeral identity cleanup failed."
          }
          if ($cleanupFailures.Count -ne 0) {
            throw ($cleanupFailures -join " ")
          }
