name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  normative:
    name: Validate normative baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate canonical contracts
        run: python ./docs/normative/v0.6/tools/validate_contracts.py

      - name: Verify AI-06 checksum
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-06_SCHEMA.sql | cut -d ' ' -f 1)"
          test "$actual" = "7411de7838d7ccc53e22e53980d5de88cebc1c6140e208fa4df33d09795f5163"

      - name: Verify AI-18 remains unchanged
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-18_DATABASE_ROLE_MODEL.sql | cut -d ' ' -f 1)"
          test "$actual" = "38f0bf14fdb3ad723232d83121cda705f91363b14ed722c0c2f2f3d7189046dd"

  dotnet:
    name: Build and test .NET
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --filter "Category!=PostgreSqlContract&Category!=OutboxSignalRDelivery&Category!=SecureProofUpload&Category!=DriverStopsPwa&Category!=DriverOfflineOperationsPwa"

  runtime-contracts:
    name: Validate runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked contract dependencies
        run: dotnet restore ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --locked-mode

      - name: Restore locked secure proof dependencies
        run: dotnet restore ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --locked-mode

      - name: Build contract tests
        run: dotnet build ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --configuration Release --no-restore

      - name: Build secure proof tests
        run: dotnet build ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --configuration Release --no-restore

      - name: Execute PostgreSQL runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSqlContract"
          --logger "trx;LogFileName=runtime-contracts.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Execute secure proof runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=SecureProofUpload"
          --logger "trx;LogFileName=secure-proof-runtime.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Capture Testcontainers diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed runtime test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-test-results
          path: ./TestResults/runtime-contracts
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Testcontainers resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  web:
    name: Validate web workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Test
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web build

  realtime-e2e:
    name: Validate real SignalR reconnect
    runs-on: ubuntu-latest
    env:
      PAQUETERIA_TEST_HOST_DLL: ${{ github.workspace }}/tests/Paqueteria.RealtimeTestHost/bin/Release/net10.0/Paqueteria.RealtimeTestHost.dll
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore controlled host
        run: dotnet restore ./tests/Paqueteria.RealtimeTestHost/Paqueteria.RealtimeTestHost.csproj --locked-mode

      - name: Build controlled host
        run: dotnet build ./tests/Paqueteria.RealtimeTestHost/Paqueteria.RealtimeTestHost.csproj --configuration Release --no-restore

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Execute real reconnect lifecycle
        run: pnpm --dir apps/web test:realtime-e2e

  outbox-signalr-delivery:
    name: Validate outbox SignalR delivery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked integration dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build real delivery tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen SignalR browser client
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute PostgreSQL outbox delivery in a real browser
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OutboxSignalRDelivery"
          --logger "trx;LogFileName=outbox-signalr-delivery.trx"
          --results-directory ./TestResults/outbox-signalr-delivery

      - name: Capture delivery diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed delivery results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-signalr-delivery-results
          path: ./TestResults/outbox-signalr-delivery
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean delivery resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  driver-stops-pwa:
    name: Validate driver PWA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore locked integration dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build driver PWA tests
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Install frozen web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: pwsh
        run: >-
          ./tests/Paqueteria.IntegrationTests/bin/Release/net10.0/playwright.ps1
          install
          --with-deps
          chromium

      - name: Execute stops, offline operations and real DriverHub flows
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=DriverStopsPwa|Category=DriverOfflineOperationsPwa"
          --logger "trx;LogFileName=driver-stops-pwa.trx"
          --results-directory ./TestResults/driver-stops-pwa

      - name: Capture driver stops diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed driver stops results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driver-stops-pwa-results
          path: ./TestResults/driver-stops-pwa
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean driver stops resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  infrastructure:
    name: Validate local infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate synthetic CI environment
        shell: pwsh
        run: |
          $projectName = "paquetenvia-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          Get-Content ./deploy/.env.example |
            ForEach-Object {
              if ($_ -match '^COMPOSE_PROJECT_NAME=') {
                "COMPOSE_PROJECT_NAME=$projectName"
              }
              else {
                $_
              }
            } |
            Set-Content ./deploy/.env.ci -Encoding utf8

      - name: Validate Compose configuration
        shell: pwsh
        run: >-
          docker compose
          --env-file ./deploy/.env.ci
          --file ./deploy/docker-compose.yml
          config --quiet

      - name: Run infrastructure smoke and persistence tests
        shell: pwsh
        run: >-
          ./tools/test-local-environment.ps1
          -EnvironmentFile ./deploy/.env.ci
          -CI
          -TimeoutSeconds 300

      - name: Capture infrastructure diagnostics
        if: failure()
        shell: pwsh
        run: |
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml ps --all
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml logs --tail 200

      - name: Clean infrastructure resources
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./deploy/.env.ci) {
            docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml down --volumes --remove-orphans
            Remove-Item ./deploy/.env.ci -Force
          }
