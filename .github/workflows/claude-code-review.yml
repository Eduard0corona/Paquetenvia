name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Secrets are not exposed to pull requests from forks; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to publish the summary comment and inline review comments.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in CLAUDE.md at the repository root
            and the normative contracts under docs/normative/v0.6 (AI-01 first).

            1. Read the PR with `gh pr view <PR NUMBER>` and the diff with `gh pr diff <PR NUMBER>`.
               Use Read/Grep/Glob on the checkout for surrounding context.
            2. Report only concrete, verifiable problems: correctness bugs, violations of the
               v0.6 invariants listed in CLAUDE.md, security/tenant-isolation issues, and
               contract drift. Skip style nits.
            3. For each finding tied to a changed line, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
            4. Publish exactly one top-level summary with
               `gh pr comment <PR NUMBER> --edit-last --create-if-none --body "<summary>"`
               (severity counts BLOCKER/MAJOR/MINOR per AI-01 section 7, then one line per finding).
               If there are no findings, say so in one line.
            Do not modify files, push commits, approve or merge.
          # Minimum tool surface: read the PR/diff, read the checkout, publish comments.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
