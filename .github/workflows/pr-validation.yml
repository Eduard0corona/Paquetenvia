name: PR Validation

# CI-OPT slice 2: change-aware, non-authoritative validation for pull requests into
# `development`. Foundation CI (ci.yml, exactly 13 jobs) stays the only authoritative
# validation: it runs for pull_request → main and certifies push → main.
#
# Trust model:
#   * a fork pull request is rejected before any checkout or execution of PR code;
#   * the classifier, the certification gate and the PR Gate execute from the tested
#     first parent (github.sha^1, the tested base), never from the PR-provided tree,
#     so a PR cannot rewrite the authority that decides which validations it may skip;
#   * the tested merge ref (github.sha) is the subject of classification; the event
#     payload base SHA is never authoritative.
#
# Job selection is owned by the classifier plan (pv-plan-v1). Every validation job
# runs only when its id is in plan.required_jobs and is otherwise skipped whole;
# no job body is weakened. The PR Gate is the single terminal check.

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job runs on GitHub-hosted Linux (ubuntu-latest); dependency caches are gated on runner.environment.
jobs:
  classify:
    name: Classify PR impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
      trusted-base-sha: ${{ steps.trusted.outputs.trusted-base-sha }}
      certified-main-sha: ${{ steps.certify.outputs.certified-main-sha }}
    steps:
      # Fork precheck: no checkout and no repository code runs before this passes.
      - name: Reject pull requests from forks before any checkout
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" != "${REPOSITORY}" ]; then
            echo "::error::PR_VALIDATION_FORK_REJECTED: head repository '${HEAD_REPO}' is not '${REPOSITORY}'"
            exit 1
          fi
          echo "same-repository pull request from ${HEAD_REPO}"

      - name: Check out tested merge ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install existing normative parser dependency
        run: python -m pip install PyYAML==6.0.3

      # The tooling that decides what may be skipped comes from the tested first parent
      # (the tested base), not from the PR tree under test.
      - name: Extract trusted CI tooling from the tested first parent
        id: trusted
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          trusted_base="$(git rev-parse --verify "${TESTED_SHA}^1")"
          trusted="${RUNNER_TEMP}/pr-validation-trusted"
          rm -rf "${trusted}"
          mkdir -p "${trusted}/tools/ci" "${trusted}/tools/azr-001"
          for path in \
            tools/ci/classify_changes.py \
            tools/ci/change-domains.json \
            tools/azr-001/azr001_static_guards.py; do
            git show "${trusted_base}:${path}" > "${trusted}/${path}"
          done
          echo "PV_TRUSTED_DIR=${trusted}" >> "$GITHUB_ENV"
          echo "trusted-base-sha=${trusted_base}" >> "$GITHUB_OUTPUT"
          echo "trusted CI tooling extracted from tested base ${trusted_base}"

      # MAIN_BACKSYNC (head main) needs proof that the exact source SHA is already
      # Foundation-certified: name Foundation CI, event push, head_branch main,
      # head_sha == source, completed/success, exactly 13 successful jobs. The proof is
      # evaluated by the trusted AZR-001 deploy-gate contract; nothing weaker. No proof
      # → certified-main-sha stays empty and the classifier falls back to FULL.
      - name: Resolve exact Foundation certification of the main head
        id: certify
        if: github.head_ref == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/pr-validation-certification"
          rm -rf "${evidence}" && mkdir -p "${evidence}"
          certified=""
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${SOURCE_HEAD_SHA}&status=completed&per_page=50" \
            > "${evidence}/runs.json"
          run_ids="$(python -c 'import json, sys
          runs = json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])
          for run in runs:
              if (run.get("head_sha") == sys.argv[2] and run.get("event") == "push"
                      and run.get("head_branch") == "main" and run.get("name") == "Foundation CI"
                      and run.get("status") == "completed" and run.get("conclusion") == "success"):
                  print(run["id"])' "${evidence}/runs.json" "${SOURCE_HEAD_SHA}")"
          for run_id in ${run_ids}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${evidence}/run-${run_id}.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "${evidence}/jobs-${run_id}.json"
            if python "${PV_TRUSTED_DIR}/tools/azr-001/azr001_static_guards.py" deploy-gate \
                 --repo-root . \
                 --tested-git-sha "${SOURCE_HEAD_SHA}" \
                 --dispatch-ref refs/heads/main \
                 --dispatch-sha "${SOURCE_HEAD_SHA}" \
                 --foundation-run-id "${run_id}" \
                 --foundation-run-json "${evidence}/run-${run_id}.json" \
                 --foundation-jobs-json "${evidence}/jobs-${run_id}.json"; then
              certified="${SOURCE_HEAD_SHA}"
              echo "MAIN_BACKSYNC certification: Foundation CI push/main run ${run_id} proves ${SOURCE_HEAD_SHA} (13/13)"
              break
            fi
            echo "run ${run_id} does not certify ${SOURCE_HEAD_SHA}"
          done
          if [ -z "${certified}" ]; then
            echo "::warning::no exact Foundation CI push/main 13/13 run proves ${SOURCE_HEAD_SHA}; the classifier will fall back to FULL:MAIN_BACKSYNC_UNCERTIFIED"
          fi
          echo "certified-main-sha=${certified}" >> "$GITHUB_OUTPUT"

      - name: Classify tested changes with trusted tooling
        id: classify
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CERTIFIED_MAIN_SHA: ${{ steps.certify.outputs.certified-main-sha }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            [ -n "${label}" ] && label_args+=(--label "${label}")
          done < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["LABELS_JSON"])))')
          python "${PV_TRUSTED_DIR}/tools/ci/classify_changes.py" \
            --repo-root . \
            --config "${PV_TRUSTED_DIR}/tools/ci/change-domains.json" \
            --tested-git-sha "${TESTED_SHA}" \
            --source-head-sha "${SOURCE_HEAD_SHA}" \
            --head-ref "${HEAD_REF}" \
            --head-repo "${HEAD_REPO}" \
            --repository "${GITHUB_REPOSITORY}" \
            --certified-main-sha "${CERTIFIED_MAIN_SHA}" \
            ${label_args[@]+"${label_args[@]}"} \
            --output "${RUNNER_TEMP}/pr-validation-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "## PR Validation plan"
            echo '```json'
            cat "${RUNNER_TEMP}/pr-validation-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'secret-scan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (AZR-001 §29, Gitleaks 8.30.1 pinned by digest)
        shell: bash
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # exit 0 -> PASS, exit 1 -> SECRET_DETECTED / FAIL, other nonzero -> SCANNER_FAILURE / BLOCKED.
          scan() {
            set +e
            docker run --rm "$@"
            local code=$?
            set -e
            case "${code}" in
              0) echo "gitleaks: PASS" ;;
              1) echo "gitleaks: SECRET_DETECTED / FAIL"; return 1 ;;
              *) echo "gitleaks: SCANNER_FAILURE / BLOCKED (exit ${code})"; return "${code}" ;;
            esac
          }
          tree="${RUNNER_TEMP}/azr001-secret-scan-tree"
          rm -rf "${tree}" && mkdir -p "${tree}"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "${tree}"
          echo "::group::scope=target tree (tracked files at ${TESTED_SHA})"
          scan -v "${tree}:/scan:ro" "${GITLEAKS_IMAGE}" dir /scan --config /scan/.gitleaks.toml --no-banner --redact
          echo "::endgroup::"
          # Introduced history is derived from the tested merge ref (its first parent is the tested base),
          # never from the pull_request event payload.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${TESTED_SHA}^1..${TESTED_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE_SHA}..${TESTED_SHA}"
          else
            range="${TESTED_SHA}^..${TESTED_SHA}"
          fi
          echo "::group::scope=introduced history (${range})"
          scan -v "${GITHUB_WORKSPACE}:/scan:ro" -w /scan \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "${GITLEAKS_IMAGE}" git /scan --config /scan/.gitleaks.toml --no-banner --redact --log-opts="${range}"
          echo "::endgroup::"

  normative-contracts:
    name: Validate normative contracts
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'normative-contracts')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate canonical contracts
        run: python ./docs/normative/v0.6/tools/validate_contracts.py

      - name: Verify AI-06 checksum
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-06_SCHEMA.sql | cut -d ' ' -f 1)"
          test "$actual" = "a363ac38cf5954ce1eee3130178e16e923e8172d27d7cecca67cdf4143f4bbcf"

      - name: Verify AI-18 remains unchanged
        shell: bash
        run: |
          actual="$(sha256sum ./docs/normative/v0.6/database/AI-18_DATABASE_ROLE_MODEL.sql | cut -d ' ' -f 1)"
          test "$actual" = "d733b351630153708d7f2255585d9f5cf0830cf9786758083574f436a6e698ba"

      - name: Test CI tooling
        run: python -m unittest discover -s ./tools/ci -p "test_*.py" -v

  azr-static:
    name: Validate AZR-001 static guards
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'azr-static')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Install pinned Bicep CLI
        shell: bash
        env:
          BICEP_VERSION: v0.47.16
          BICEP_SHA256: 64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  ${RUNNER_TEMP}/bicep" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/bicep"

      - name: Build and lint Bicep templates (AZR-001 §28.1, offline)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/azr001-arm"
          mkdir -p "${RUNNER_TEMP}/azr001-arm"
          for template in deploy/azure/*.bicep; do
            "${RUNNER_TEMP}/bicep" build "${template}" --outdir "${RUNNER_TEMP}/azr001-arm"
            "${RUNNER_TEMP}/bicep" lint "${template}"
          done

      - name: Test AZR-001 static guard tooling
        run: python -m unittest discover -s ./tools/azr-001 -p "test_*.py" -v

      - name: Run AZR-001 §28 static guards
        run: python ./tools/azr-001/azr001_static_guards.py check --arm-dir "${RUNNER_TEMP}/azr001-arm"

  dotnet:
    name: Build and test .NET
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'dotnet')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      execution-artifact-id: ${{ steps.upload-dotnet-execution.outputs.artifact-id }}
      execution-artifact-digest: ${{ steps.upload-dotnet-execution.outputs.artifact-digest }}
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --filter "Category!=PostgreSqlContract&Category!=OutboxSignalRDelivery&Category!=SecureProofUpload&Category!=DriverStopsPwa&Category!=DriverOfflineOperationsPwa&Category!=PublicTrackingPostgreSql&Category!=PublicTrackingPwa&Category!=OperationsDashboardPostgreSql&Category!=OperationsDashboardPwa&Category!=OpsDeliverySimulation"
          --logger "trx;LogFilePrefix=dotnet"
          --results-directory ./TestResults/dotnet

      - name: Correlate executed .NET tests
        run: >-
          python ./tools/rel-000/rel000.py collect-results
          --job dotnet
          --artifact-name rel000-execution-dotnet
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --trx "auto=./TestResults/dotnet/dotnet*.trx"
          --output ./TestResults/dotnet/rel000-execution-results.json

      - name: Publish structured .NET execution evidence
        id: upload-dotnet-execution
        uses: actions/upload-artifact@v4
        with:
          name: rel000-execution-dotnet
          path: ./TestResults/dotnet
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  runtime-contracts:
    name: Validate runtime contracts
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'runtime-contracts')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      execution-artifact-id: ${{ steps.upload-runtime-execution.outputs.artifact-id }}
      execution-artifact-digest: ${{ steps.upload-runtime-execution.outputs.artifact-digest }}
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked contract dependencies
        run: dotnet restore ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --locked-mode

      - name: Restore locked secure proof dependencies
        run: dotnet restore ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --locked-mode

      - name: Build contract tests
        run: dotnet build ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --configuration Release --no-restore

      - name: Build secure proof tests
        run: dotnet build ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --configuration Release --no-restore

      - name: Execute PostgreSQL runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSqlContract"
          --logger "trx;LogFileName=runtime-contracts.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Execute secure proof runtime contracts
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: >-
          dotnet test ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=SecureProofUpload"
          --logger "trx;LogFileName=secure-proof-runtime.trx"
          --results-directory ./TestResults/runtime-contracts

      - name: Correlate executed runtime contract tests
        run: >-
          python ./tools/rel-000/rel000.py collect-results
          --job runtime-contracts
          --artifact-name rel000-execution-runtime-contracts
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --trx "tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj|PostgreSqlContract=./TestResults/runtime-contracts/runtime-contracts.trx"
          --trx "tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj|SecureProofUpload=./TestResults/runtime-contracts/secure-proof-runtime.trx"
          --output ./TestResults/runtime-contracts/rel000-execution-results.json

      - name: Publish structured runtime execution evidence
        id: upload-runtime-execution
        uses: actions/upload-artifact@v4
        with:
          name: rel000-execution-runtime-contracts
          path: ./TestResults/runtime-contracts
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Capture Testcontainers diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --no-trunc
          for container_id in $(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet"); do
            docker logs --tail 200 "$container_id" || true
          done

      - name: Publish failed runtime test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-test-results
          path: ./TestResults/runtime-contracts
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Testcontainers resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  web:
    name: Validate web workspace
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Verify Sharp native runtime through Next.js
        run: node ./tools/security/sharp-runtime-smoke.mjs

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Test
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web build

  realtime-e2e:
    name: Validate real SignalR reconnect
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'realtime-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      execution-artifact-id: ${{ steps.upload-realtime-execution.outputs.artifact-id }}
      execution-artifact-digest: ${{ steps.upload-realtime-execution.outputs.artifact-digest }}
    env:
      PAQUETERIA_TEST_HOST_DLL: ${{ github.workspace }}/tests/Paqueteria.RealtimeTestHost/bin/Release/net10.0/Paqueteria.RealtimeTestHost.dll
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore controlled host
        run: dotnet restore ./tests/Paqueteria.RealtimeTestHost/Paqueteria.RealtimeTestHost.csproj --locked-mode

      - name: Build controlled host
