      artifact-digest: ${{ steps.upload-delivery-simulation.outputs.artifact-digest }}
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked simulation dependencies
        run: >-
          dotnet restore
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --locked-mode

      - name: Build delivery simulation
        run: >-
          dotnet build
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Execute two real 20-delivery runs
        env:
          MSBUILDDISABLENODEREUSE: "1"
          OPS001_REPORT_PATH: ${{ github.workspace }}/TestResults/delivery-simulation/ops001-delivery-simulation.json
        run: >-
          dotnet test
          ./tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=OpsDeliverySimulation"
          --logger "trx;LogFileName=delivery-simulation.trx"
          --results-directory ./TestResults/delivery-simulation

      - name: Correlate executed delivery simulation tests
        run: >-
          python ./tools/rel-000/rel000.py collect-results
          --job delivery-simulation
          --artifact-name delivery-simulation-results
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --trx "tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj|OpsDeliverySimulation=./TestResults/delivery-simulation/delivery-simulation.trx"
          --output ./TestResults/delivery-simulation/rel000-execution-results.json

      - name: Capture redacted simulation diagnostics
        if: failure()
        shell: bash
        run: |
          docker version
          docker ps --all --format '{{.ID}} {{.Image}} {{.Status}}'

      - name: Write same-run simulation provenance
        if: always()
        run: >-
          python ./tools/rel-000/rel000.py provenance
          --artifact-directory ./TestResults/delivery-simulation
          --artifact-name delivery-simulation-results
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --git-relationship "$REL000_GIT_RELATIONSHIP"

      - name: Publish simulation results and redacted report
        id: upload-delivery-simulation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-simulation-results
          path: ./TestResults/delivery-simulation
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Clean delivery simulation resources
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps --all --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$container_ids" ]; then
            docker rm --force $container_ids
          fi
          network_ids=$(docker network ls --quiet --filter "label=org.testcontainers.lang=dotnet")
          if [ -n "$network_ids" ]; then
            docker network rm $network_ids
          fi

  infrastructure:
    name: Validate local infrastructure
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'infrastructure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    outputs:
      execution-artifact-id: ${{ steps.upload-infrastructure-execution.outputs.artifact-id }}
      execution-artifact-digest: ${{ steps.upload-infrastructure-execution.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Restore integrated development hosts
        shell: pwsh
        run: |
          dotnet restore Paqueteria.sln --locked-mode
          dotnet restore ./tools/Paqueteria.DevSeed/Paqueteria.DevSeed.csproj --locked-mode
          pnpm --dir apps/web install --frozen-lockfile

      - name: Generate synthetic CI environment
        shell: pwsh
        run: |
          $projectName = "paquetenvia-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          Get-Content ./deploy/.env.example |
            ForEach-Object {
              if ($_ -match '^COMPOSE_PROJECT_NAME=') {
                "COMPOSE_PROJECT_NAME=$projectName"
              }
              else {
                $_
              }
            } |
            Set-Content ./deploy/.env.ci -Encoding utf8

      - name: Validate Compose configuration
        shell: pwsh
        run: >-
          docker compose
          --env-file ./deploy/.env.ci
          --file ./deploy/docker-compose.yml
          config --quiet

      - name: Run infrastructure smoke and persistence tests
        shell: pwsh
        env:
          REL000_EXECUTION_RESULT_PATH: ${{ github.workspace }}/TestResults/infrastructure/infrastructure-smoke.json
        run: >-
          ./tools/test-local-environment.ps1
          -EnvironmentFile ./deploy/.env.ci
          -CI
          -TimeoutSeconds 300

      - name: Run integrated manual environment acceptance
        shell: pwsh
        run: >-
          ./tools/test-dev-platform.ps1
          -CI
          -EnvironmentFile ./deploy/.env.ci
          -TimeoutSeconds 300

      - name: Correlate executed infrastructure smoke
        run: >-
          python ./tools/rel-000/rel000.py collect-results
          --job infrastructure
          --artifact-name rel000-execution-infrastructure
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --structured "tools/test-local-environment.ps1=./TestResults/infrastructure/infrastructure-smoke.json"
          --output ./TestResults/infrastructure/rel000-execution-results.json

      - name: Publish structured infrastructure execution evidence
        id: upload-infrastructure-execution
        uses: actions/upload-artifact@v4
        with:
          name: rel000-execution-infrastructure
          path: ./TestResults/infrastructure
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Capture infrastructure diagnostics
        if: failure()
        shell: pwsh
        run: |
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml ps --all
          docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml logs --tail 200

      - name: Clean infrastructure resources
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./deploy/.env.ci) {
            docker compose --env-file ./deploy/.env.ci --file ./deploy/docker-compose.yml down --volumes --remove-orphans
            Remove-Item ./deploy/.env.ci -Force
          }

  backup-restore:
    name: Validate backup and restore
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'backup-restore')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload-backup-restore.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-backup-restore.outputs.artifact-digest }}
    env:
      CI: "true"
      OPS002_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPS002_TESTED_GIT_SHA: ${{ github.sha }}
      OPS002_PULL_REQUEST_EVENT: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) {
            throw "OPS-002 requires PowerShell 7."
          }

      - name: Install checksum-pinned age 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/age-v1.3.1"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" \
            | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" --strip-components=1
          test -x "$install_dir/age"
          test -x "$install_dir/age-keygen"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore locked dependencies
        run: dotnet restore Paqueteria.sln --locked-mode

      - name: Generate isolated synthetic environments and identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:OPS002_SOURCE_ENV_FILE = Join-Path $env:RUNNER_TEMP "ops002-source.env"
          $env:OPS002_TARGET_ENV_FILE = Join-Path $env:RUNNER_TEMP "ops002-target.env"
          $env:OPS002_IDENTITY_FILE = Join-Path $env:RUNNER_TEMP "ops002-age-identity.txt"
          $env:OPS002_RESULTS_DIRECTORY = Join-Path $env:RUNNER_TEMP "ops002-results"
          foreach ($name in @(
            "OPS002_SOURCE_ENV_FILE",
            "OPS002_TARGET_ENV_FILE",
            "OPS002_IDENTITY_FILE",
            "OPS002_RESULTS_DIRECTORY"
          )) {
            Add-Content -LiteralPath $env:GITHUB_ENV `
              -Value "$name=$([Environment]::GetEnvironmentVariable($name))" `
              -Encoding utf8
          }
          $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
          $databaseUser = "ops002_$($suffix.Replace('-', '_'))"
          $sourceAccessKey = "ops002$([Guid]::NewGuid().ToString('N'))"
          $targetAccessKey = "ops002$([Guid]::NewGuid().ToString('N'))"
          $sourcePassword = "synthetic-source-$([Guid]::NewGuid().ToString('N'))"
          $targetPassword = "synthetic-target-$([Guid]::NewGuid().ToString('N'))"
          @"
          COMPOSE_PROJECT_NAME=ops002-source-$suffix
          POSTGRES_HOST_PORT=15432
          POSTGRES_DB=ops002_source
          POSTGRES_USER=$databaseUser
          POSTGRES_PASSWORD=$sourcePassword
          REDIS_HOST_PORT=16379
          REDIS_PASSWORD=$sourcePassword
          MINIO_API_HOST_PORT=19000
          MINIO_CONSOLE_HOST_PORT=19001
          MINIO_ROOT_USER=$sourceAccessKey
          MINIO_ROOT_PASSWORD=$sourcePassword
          MINIO_BUCKET=ops002-source-$suffix
          AWS_ACCESS_KEY_ID=$sourceAccessKey
          AWS_SECRET_ACCESS_KEY=$sourcePassword
          ProofStorage__Provider=S3Compatible
          ProofStorage__ThreatScanner=Synthetic
          ProofStorage__ServiceUrl=http://127.0.0.1:19000
          ProofStorage__PublicPresignUrl=http://127.0.0.1:19000
          ProofStorage__Region=us-east-1
          ProofStorage__Bucket=ops002-source-$suffix
          ProofStorage__ProcessingIntervalSeconds=5
          ProofStorage__StaleValidationSeconds=300
          ProofStorage__MaximumConcurrency=4
          MAIL_SMTP_HOST_PORT=11025
          MAIL_UI_HOST_PORT=18025
          "@ | Set-Content -LiteralPath $env:OPS002_SOURCE_ENV_FILE -Encoding utf8NoBOM
          @"
          COMPOSE_PROJECT_NAME=ops002-target-$suffix
          POSTGRES_HOST_PORT=25432
          POSTGRES_DB=ops002_bootstrap
          POSTGRES_USER=$databaseUser
          POSTGRES_PASSWORD=$targetPassword
          REDIS_HOST_PORT=26379
          REDIS_PASSWORD=$targetPassword
          MINIO_API_HOST_PORT=29000
          MINIO_CONSOLE_HOST_PORT=29001
          MINIO_ROOT_USER=$targetAccessKey
          MINIO_ROOT_PASSWORD=$targetPassword
          MINIO_BUCKET=ops002-target-$suffix
          AWS_ACCESS_KEY_ID=$targetAccessKey
          AWS_SECRET_ACCESS_KEY=$targetPassword
          ProofStorage__Provider=S3Compatible
          ProofStorage__ThreatScanner=Synthetic
          ProofStorage__ServiceUrl=http://127.0.0.1:29000
          ProofStorage__PublicPresignUrl=http://127.0.0.1:29000
          ProofStorage__Region=us-east-1
          ProofStorage__Bucket=ops002-target-$suffix
          ProofStorage__ProcessingIntervalSeconds=5
          ProofStorage__StaleValidationSeconds=300
          ProofStorage__MaximumConcurrency=4
          MAIL_SMTP_HOST_PORT=21025
          MAIL_UI_HOST_PORT=28025
          "@ | Set-Content -LiteralPath $env:OPS002_TARGET_ENV_FILE -Encoding utf8NoBOM
          & age-keygen --output $env:OPS002_IDENTITY_FILE 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to generate the ephemeral age identity."
          }
          & chmod 600 -- `
            $env:OPS002_SOURCE_ENV_FILE `
            $env:OPS002_TARGET_ENV_FILE `
            $env:OPS002_IDENTITY_FILE
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to restrict ephemeral credential file permissions."
          }

      - name: Execute encrypted backup and clean restore drill
        shell: pwsh
        run: ./tools/test-backup-restore.ps1 -CI -TimeoutSeconds 1500

      - name: Correlate executed backup and restore checks
        run: >-
          python ./tools/rel-000/rel000.py collect-results
          --job backup-restore
          --artifact-name ops002-backup-restore-results
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --structured "tools/test-backup-restore.ps1=$OPS002_RESULTS_DIRECTORY/rel000-execution-input.json"
          --output "$OPS002_RESULTS_DIRECTORY/rel000-execution-results.json"

      - name: Capture redacted backup diagnostics
        if: failure()
        shell: bash
        run: |
          docker ps --all --format '{{.ID}} {{.Image}} {{.Status}}'

      - name: Write same-run backup provenance
        if: always()
        run: >-
          python ./tools/rel-000/rel000.py provenance
          --artifact-directory "$OPS002_RESULTS_DIRECTORY"
          --artifact-name ops002-backup-restore-results
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --source-head-sha "$REL000_SOURCE_HEAD_SHA"
          --tested-git-sha "$REL000_TESTED_GIT_SHA"
          --base-main-sha "$REL000_BASE_MAIN_SHA"
          --git-relationship "$REL000_GIT_RELATIONSHIP"

      - name: Publish only encrypted artifact and redacted results
        id: upload-backup-restore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops002-backup-restore-results
          path: |
            ${{ runner.temp }}/ops002-results/**/*.json
            ${{ runner.temp }}/ops002-results/encrypted-backup/*.tar.gz.age
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Clean backup and restore resources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./tools/local-environment.common.ps1
          . ./tools/backup-restore.common.ps1
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          foreach ($environmentFile in @(
            $env:OPS002_SOURCE_ENV_FILE,
            $env:OPS002_TARGET_ENV_FILE
          )) {
            if (-not (Test-Path -LiteralPath $environmentFile)) {
              continue
            }
            try {
              $context = Get-LocalEnvironmentContext `
                -ComposeFile ./deploy/docker-compose.yml `
                -EnvironmentFile $environmentFile
              Invoke-DockerCompose -Context $context -Arguments @(
                "down", "--volumes", "--remove-orphans"
              ) -AllowFailure | Out-Null
              Assert-ProjectResourcesAbsent -ProjectName $context.ProjectName
            }
            catch {
              $cleanupFailures.Add("A project-scoped Compose cleanup failed.")
            }
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP `
            -Directory -Filter "paquetenvia-ops002-*" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              $pathInfo = New-Ops002ValidatedExternalDirectory `
                -Path $_.FullName `
                -Purpose "Plaintext staging"
              Remove-Ops002StagingDirectory -PathInfo $pathInfo
            }
          if (Test-Path -LiteralPath $env:OPS002_IDENTITY_FILE) {
            $validatedIdentity = Assert-Ops002IdentityFile `
              -IdentityFile $env:OPS002_IDENTITY_FILE
            [System.IO.File]::Delete($validatedIdentity)
          }
          Remove-Item -LiteralPath $env:OPS002_SOURCE_ENV_FILE -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:OPS002_TARGET_ENV_FILE -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $env:OPS002_IDENTITY_FILE) {
            throw "Ephemeral identity cleanup failed."
          }
          if ($cleanupFailures.Count -ne 0) {
            throw ($cleanupFailures -join " ")
          }

  # Non-authoritative here (PR Validation). Runs only for FULL plans. The logical
  # `normative` upstream result is success only when all three decomposed normative
  # controls succeeded; otherwise the existing upstream check fails closed.
  rel000:
    name: Validate MVP-0 internal release evidence
    if: always() && needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).required_jobs, 'rel000')
    needs:
      - classify
      - secret-scan
      - normative-contracts
      - azr-static
      - dotnet
      - runtime-contracts
      - web
      - realtime-e2e
      - outbox-signalr-delivery
      - driver-stops-pwa
      - public-tracking
      - operations-dashboard
      - delivery-simulation
      - infrastructure
      - backup-restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
    env:
      CI: "true"
      REL000_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      REL000_REMEDIATION_ID: ${{ github.head_ref == 'fix/security-2026-09-next-critical' && 'SEC-2026-09-NEXT-CRITICAL' || github.head_ref == 'fix/security-2026-08-web-transitives' && 'SEC-2026-08-SECURITY-BASELINE' || '' }}
      REL000_REMEDIATION_POLICY_PATH: tools/rel-000/security-remediation-policy.json
      REL000_WORKFLOW_RUN_ID: ${{ github.run_id }}
      REL000_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      REL000_JOB_RESULTS_JSON: >-
        {"normative":"${{ needs.secret-scan.result == 'success' && needs.normative-contracts.result == 'success' && needs.azr-static.result == 'success' && 'success' || format('decomposed[secret-scan={0},normative-contracts={1},azr-static={2}]', needs.secret-scan.result, needs.normative-contracts.result, needs.azr-static.result) }}","dotnet":"${{ needs.dotnet.result }}","runtime-contracts":"${{ needs.runtime-contracts.result }}","web":"${{ needs.web.result }}","realtime-e2e":"${{ needs.realtime-e2e.result }}","outbox-signalr-delivery":"${{ needs.outbox-signalr-delivery.result }}","driver-stops-pwa":"${{ needs.driver-stops-pwa.result }}","public-tracking":"${{ needs.public-tracking.result }}","operations-dashboard":"${{ needs.operations-dashboard.result }}","delivery-simulation":"${{ needs.delivery-simulation.result }}","infrastructure":"${{ needs.infrastructure.result }}","backup-restore":"${{ needs.backup-restore.result }}"}
      REL000_EXECUTION_ARTIFACT_OUTPUTS_JSON: >-
        [{"artifact_name":"rel000-execution-dotnet","artifact_id":"${{ needs.dotnet.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.dotnet.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-runtime-contracts","artifact_id":"${{ needs.runtime-contracts.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.runtime-contracts.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-realtime-e2e","artifact_id":"${{ needs.realtime-e2e.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.realtime-e2e.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-outbox-signalr-delivery","artifact_id":"${{ needs.outbox-signalr-delivery.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.outbox-signalr-delivery.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-driver-stops-pwa","artifact_id":"${{ needs.driver-stops-pwa.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.driver-stops-pwa.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-public-tracking","artifact_id":"${{ needs.public-tracking.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.public-tracking.outputs.execution-artifact-digest }}"},{"artifact_name":"rel000-execution-operations-dashboard","artifact_id":"${{ needs.operations-dashboard.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.operations-dashboard.outputs.execution-artifact-digest }}"},{"artifact_name":"delivery-simulation-results","artifact_id":"${{ needs.delivery-simulation.outputs.artifact-id }}","artifact_digest":"${{ needs.delivery-simulation.outputs.artifact-digest }}"},{"artifact_name":"rel000-execution-infrastructure","artifact_id":"${{ needs.infrastructure.outputs.execution-artifact-id }}","artifact_digest":"${{ needs.infrastructure.outputs.execution-artifact-digest }}"},{"artifact_name":"ops002-backup-restore-results","artifact_id":"${{ needs.backup-restore.outputs.artifact-id }}","artifact_digest":"${{ needs.backup-restore.outputs.artifact-digest }}"}]
      REL000_OPS001_ARTIFACT_NAME: delivery-simulation-results
      REL000_OPS001_ARTIFACT_ID: ${{ needs.delivery-simulation.outputs.artifact-id }}
      REL000_OPS001_ARTIFACT_DIGEST: ${{ needs.delivery-simulation.outputs.artifact-digest }}
      REL000_OPS002_ARTIFACT_NAME: ops002-backup-restore-results
      REL000_OPS002_ARTIFACT_ID: ${{ needs.backup-restore.outputs.artifact-id }}
      REL000_OPS002_ARTIFACT_DIGEST: ${{ needs.backup-restore.outputs.artifact-digest }}
    steps:
      - name: Check out tested merge ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tested provenance
        run: >-
          python ./tools/rel-000/rel000.py resolve-tested-provenance
          --event-name "${{ github.event_name }}"
          --tested-git-sha "${{ github.sha }}"
          --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --event-pull-request-base-sha "${{ github.event.pull_request.base.sha }}"
          --github-env "$GITHUB_ENV"

      - name: Verify every authoritative upstream job succeeded
        shell: pwsh
        run: |
          $results = $env:REL000_JOB_RESULTS_JSON | ConvertFrom-Json
          $failed = @(
            $results.psobject.Properties |
              Where-Object { $_.Value -cne "success" } |
              ForEach-Object { "$($_.Name)=$($_.Value)" }
          )
          if ($failed.Count -ne 0) {
            throw "REL000_AUTHORITATIVE_UPSTREAM_FAILED: $($failed -join ', ')"
          }
          if ([string]::IsNullOrWhiteSpace($env:REL000_OPS001_ARTIFACT_ID) -or
              [string]::IsNullOrWhiteSpace($env:REL000_OPS001_ARTIFACT_DIGEST) -or
              [string]::IsNullOrWhiteSpace($env:REL000_OPS002_ARTIFACT_ID) -or
              [string]::IsNullOrWhiteSpace($env:REL000_OPS002_ARTIFACT_DIGEST)) {
            throw "REL000_ARTIFACT_METADATA_MISSING"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install existing normative parser dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Set up repository .NET SDK for consolidated audit
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Capture and sanitize workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          raw_directory="$RUNNER_TEMP/rel000-workflow-provenance-raw"
          mkdir "$raw_directory"
          for attempt in $(seq 1 "$GITHUB_RUN_ATTEMPT"); do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}" \
              > "$raw_directory/attempt-${attempt}-run.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}/jobs?per_page=100" \
              > "$raw_directory/attempt-${attempt}-jobs.json"
          done
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "$raw_directory/artifacts.json"
          python ./tools/rel-000/rel000.py sanitize-workflow-provenance \
            --attempts-directory "$raw_directory" \
            --artifacts "$raw_directory/artifacts.json" \
            --artifact-outputs-json "$REL000_EXECUTION_ARTIFACT_OUTPUTS_JSON" \
            --output "$RUNNER_TEMP/rel000-workflow-provenance.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$REL000_SOURCE_HEAD_SHA" \
            --workflow-profile pr-validation

      - name: Download current OPS-001 artifact
        uses: actions/download-artifact@v5
        with:
          name: delivery-simulation-results
          path: ${{ runner.temp }}/rel000-ops001

      - name: Download current OPS-002 artifact
        uses: actions/download-artifact@v5
        with:
          name: ops002-backup-restore-results
          path: ${{ runner.temp }}/rel000-ops002

      - name: Download current structured execution artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: rel000-execution-*
          path: ${{ runner.temp }}/rel000-executions

      - name: Consult and sanitize open Issue 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/5" \
            > "$RUNNER_TEMP/rel000-issue5-raw.json"
          python ./tools/rel-000/rel000.py sanitize-issue \
            --input "$RUNNER_TEMP/rel000-issue5-raw.json" \
            --output "$RUNNER_TEMP/rel000-issue5.json"

      - name: Consult and sanitize additional security tracking
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(
            python -c 'import json, os; data=json.load(open("tests/fixtures/rel-000/security-tracking.json", encoding="utf-8")); print(data.get("remediation_issues", {}).get(os.environ.get("REL000_REMEDIATION_ID"), data["issue_number"]))'
          )"
          related_issue_number="$(
            python -c 'import json; policy=json.load(open("tools/rel-000/security-remediation-policy.json", encoding="utf-8")); print(next(item for item in policy["active_remediations"] if item["id"] == "SEC-2026-08-SECURITY-BASELINE")["related_tracked_issue"])'
          )"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
            > "$RUNNER_TEMP/rel000-security-tracking-raw.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${related_issue_number}" \
            > "$RUNNER_TEMP/rel000-related-security-tracking-raw.json"
          python ./tools/rel-000/rel000.py sanitize-issue \
            --input "$RUNNER_TEMP/rel000-security-tracking-raw.json" \
            --related-input "$RUNNER_TEMP/rel000-related-security-tracking-raw.json" \
            --output "$RUNNER_TEMP/rel000-security-tracking.json"

      - name: Resolve explicit REL-000 mode and verify the branch lockfile
        shell: bash
        run: |
          set -euo pipefail
          mode="$(
            python ./tools/rel-000/rel000.py resolve-mode \
              --policy "$REL000_REMEDIATION_POLICY_PATH" \
              --source-branch "$REL000_SOURCE_BRANCH" \
              --remediation-id "$REL000_REMEDIATION_ID"
          )"
          echo "REL000_MODE=$mode" >> "$GITHUB_ENV"
          pnpm --dir apps/web install --frozen-lockfile

      - name: Execute Sharp runtime smoke for REL-000
        shell: bash
        run: node ./tools/security/sharp-runtime-smoke.mjs > "$RUNNER_TEMP/rel000-sharp-runtime-smoke.json"

      - name: Capture and sanitize real base and branch audits
        shell: bash
        run: |
          set -euo pipefail
          base_source="$RUNNER_TEMP/rel000-base-source"
          mkdir "$base_source"
          git archive "$REL000_BASE_MAIN_SHA" |
            tar -x -C "$base_source"

          pnpm --dir "$base_source/apps/web" install --frozen-lockfile --lockfile-only
          CI=false dotnet restore "$base_source/tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj" --locked-mode
          CI=false dotnet restore "$base_source/tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj" --locked-mode
          dotnet restore tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj --locked-mode
          dotnet restore tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj --locked-mode

          dotnet package list \
            --project "$base_source/tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj" \
            --vulnerable --include-transitive --format json --no-restore \
            > "$RUNNER_TEMP/rel000-base-contract-nuget-audit.json"
          dotnet package list \
            --project "$base_source/tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj" \
            --vulnerable --include-transitive --format json --no-restore \
            > "$RUNNER_TEMP/rel000-base-integration-nuget-audit.json"
          dotnet package list \
            --project tests/Paqueteria.ContractTests/Paqueteria.ContractTests.csproj \
            --vulnerable --include-transitive --format json --no-restore \
            > "$RUNNER_TEMP/rel000-branch-contract-nuget-audit.json"
          dotnet package list \
            --project tests/Paqueteria.IntegrationTests/Paqueteria.IntegrationTests.csproj \
            --vulnerable --include-transitive --format json --no-restore \
            > "$RUNNER_TEMP/rel000-branch-integration-nuget-audit.json"

          set +e
          pnpm --dir "$base_source/apps/web" audit --json \
            > "$RUNNER_TEMP/rel000-base-audit-raw.json"
          base_audit_exit=$?
          pnpm --dir apps/web audit --json \
            > "$RUNNER_TEMP/rel000-branch-audit-raw.json"
          branch_audit_exit=$?
          set -e
          for audit_exit in "$base_audit_exit" "$branch_audit_exit"; do
            if [ "$audit_exit" -ne 0 ] && [ "$audit_exit" -ne 1 ]; then
              exit "$audit_exit"
            fi
          done
          python ./tools/rel-000/rel000.py sanitize-audit \
            --input "$RUNNER_TEMP/rel000-base-audit-raw.json" \
            --nuget-input "$RUNNER_TEMP/rel000-base-contract-nuget-audit.json" \
            --nuget-input "$RUNNER_TEMP/rel000-base-integration-nuget-audit.json" \
            --output "$RUNNER_TEMP/rel000-base-audit.json" \
            --command-executed \
            --command-exit-code "$base_audit_exit"
          python ./tools/rel-000/rel000.py sanitize-audit \
            --input "$RUNNER_TEMP/rel000-branch-audit-raw.json" \
            --nuget-input "$RUNNER_TEMP/rel000-branch-contract-nuget-audit.json" \
            --nuget-input "$RUNNER_TEMP/rel000-branch-integration-nuget-audit.json" \
            --output "$RUNNER_TEMP/rel000-branch-audit.json" \
            --command-executed \
            --command-exit-code "$branch_audit_exit"

      - name: Validate and generate redacted REL-000 evidence
        shell: pwsh
        env:
          REL000_OPS001_ARTIFACT_DIRECTORY: ${{ runner.temp }}/rel000-ops001
          REL000_OPS002_ARTIFACT_DIRECTORY: ${{ runner.temp }}/rel000-ops002
          REL000_OUTPUT_DIRECTORY: ${{ runner.temp }}/rel000-output
          REL000_ISSUE5_PATH: ${{ runner.temp }}/rel000-issue5.json
          REL000_SECURITY_TRACKING_ISSUE_PATH: ${{ runner.temp }}/rel000-security-tracking.json
          REL000_BASE_AUDIT_PATH: ${{ runner.temp }}/rel000-base-audit.json
          REL000_BRANCH_AUDIT_PATH: ${{ runner.temp }}/rel000-branch-audit.json
          REL000_SHARP_RUNTIME_SMOKE_PATH: ${{ runner.temp }}/rel000-sharp-runtime-smoke.json
          REL000_EXECUTION_RESULTS_DIRECTORY: ${{ runner.temp }}
          REL000_WORKFLOW_PROVENANCE_PATH: ${{ runner.temp }}/rel000-workflow-provenance.json
          REL000_DECISION_RECORD_PATH: docs/releases/mvp-0-owner-decision.json
          REL000_APPROVED_EVIDENCE_MANIFEST_PATH: docs/releases/evidence/rel-000-owner-001/approved-evidence-manifest.json
          REL000_APPROVED_EVIDENCE_DIRECTORY: docs/releases/evidence/rel-000-owner-001
        run: ./tools/test-rel-000-internal-release.ps1 -CI

      - name: Publish only redacted REL-000 evidence
        id: upload-rel000
        uses: actions/upload-artifact@v4
        with:
          name: rel000-mvp0-internal-release-evidence
          path: ${{ runner.temp }}/rel000-output
          if-no-files-found: error
          retention-days: 14

      - name: Clean REL-000 inputs and generated evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./tools/backup-restore.common.ps1
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP "rel000-ops001"),
            (Join-Path $env:RUNNER_TEMP "rel000-ops002"),
            (Join-Path $env:RUNNER_TEMP "rel000-executions"),
            (Join-Path $env:RUNNER_TEMP "rel000-base-source"),
            (Join-Path $env:RUNNER_TEMP "rel000-workflow-provenance-raw"),
            (Join-Path $env:RUNNER_TEMP "rel000-output")
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              continue
            }
            $pathInfo = New-Ops002ValidatedExternalDirectory `
              -Path $path `
              -Purpose "REL-000 cleanup"
            Remove-Ops002ValidatedDirectory `
              -PathInfo $pathInfo `
              -Purpose "REL-000 cleanup"
          }
          foreach ($name in @(
            "rel000-issue5-raw.json",
            "rel000-issue5.json",
            "rel000-security-tracking-raw.json",
            "rel000-related-security-tracking-raw.json",
            "rel000-security-tracking.json",
            "rel000-security-tracking-related.json",
            "rel000-base-audit-raw.json",
            "rel000-base-audit.json",
            "rel000-base-contract-nuget-audit.json",
            "rel000-base-integration-nuget-audit.json",
            "rel000-branch-audit-raw.json",
            "rel000-branch-audit.json",
            "rel000-branch-contract-nuget-audit.json",
            "rel000-branch-integration-nuget-audit.json",
            "rel000-sharp-runtime-smoke.json",
            "rel000-workflow-provenance.json"
          )) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              [System.IO.File]::Delete($path)
            }
          }

  pr-gate:
    name: PR Gate
    if: always()
    needs:
      - classify
      - secret-scan
      - normative-contracts
      - azr-static
      - dotnet
      - runtime-contracts
      - web
      - realtime-e2e
      - outbox-signalr-delivery
      - driver-stops-pwa
      - public-tracking
      - operations-dashboard
      - delivery-simulation
      - infrastructure
      - backup-restore
      - rel000
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PV_CLASSIFY_RESULT: ${{ needs.classify.result }}
      PV_PLAN_JSON: ${{ needs.classify.outputs.plan }}
      PV_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      # Workflow-owned, runs before any checkout: an untrusted or failed classification
      # (fork rejected, provenance unproven, classifier error) never reaches PR code.
      - name: Fail closed when the classifier did not succeed (before any checkout)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PV_CLASSIFY_RESULT}" != "success" ]; then
            echo "::error::PR_GATE_CLASSIFICATION_UNTRUSTED: classify result is '${PV_CLASSIFY_RESULT}'"
            echo "PR Gate: FAIL (PR_GATE_CLASSIFICATION_UNTRUSTED classify=${PV_CLASSIFY_RESULT})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check out tested merge ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The gate that judges the PR comes from the tested first parent, not from the PR.
      - name: Extract trusted PR Gate from the tested first parent
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          trusted_base="$(git rev-parse --verify "${TESTED_SHA}^1")"
          trusted="${RUNNER_TEMP}/pr-validation-trusted-gate"
          rm -rf "${trusted}"
          mkdir -p "${trusted}/tools/ci"
          for path in \
            tools/ci/pr_gate.py \
            tools/ci/classify_changes.py \
            tools/ci/change-domains.json; do
            git show "${trusted_base}:${path}" > "${trusted}/${path}"
          done
          echo "PV_TRUSTED_GATE_DIR=${trusted}" >> "$GITHUB_ENV"
          echo "trusted PR Gate extracted from tested base ${trusted_base}"

      - name: Evaluate PR Gate with trusted tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "## PR Gate" >> "$GITHUB_STEP_SUMMARY"
          python "${PV_TRUSTED_GATE_DIR}/tools/ci/pr_gate.py" \
            --config "${PV_TRUSTED_GATE_DIR}/tools/ci/change-domains.json" \
            --plan-json "${PV_PLAN_JSON}" \
            --needs-json "${PV_NEEDS_JSON}" \
            --summary "$GITHUB_STEP_SUMMARY"
