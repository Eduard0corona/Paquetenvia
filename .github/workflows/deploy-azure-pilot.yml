name: Deploy Azure PILOT

# ENV-001 pilot environment (PILOT-REAL-PEOPLE), separate from AZR-001 DEV-SYNTHETIC.
# - Single trigger: workflow_dispatch, run by the owner from main (AZURE-DEPLOY-VIA-WORKFLOW).
# - GitHub Environment `azure-pilot` guards every Azure job; OIDC only (no stored credential).
# - Provenance (AZR-001 §27 reused): tested_git_sha must be the head of a 13/13 successful
#   Foundation CI push run on main and an ancestor of the dispatched main head; the deploy job
#   checks out and builds exactly tested_git_sha.
# - The database is private: every database action runs as a Container Apps Job inside the VNet.
# Runbook: docs/operations/env-001-pilot/README.md. One-time bootstrap: docs/operations/env-001-pilot/bootstrap.md.

on:
  workflow_dispatch:
    inputs:
      tested_git_sha:
        description: Foundation-certified commit SHA to deploy (head of foundation_run_id, ancestor of or equal to the dispatched main head).
        required: true
        type: string
      foundation_run_id:
        description: Foundation CI run id (push on main) whose head is tested_git_sha and whose 13 jobs all succeeded.
        required: true
        type: string
      custom_domain_phase:
        description: "none = route on the environment FQDN only; bind = also bind paquetenvia.com with a managed certificate (DNS records must exist)."
        required: true
        type: choice
        default: none
        options:
          - none
          - bind
      rotate_runtime_logins:
        description: Generate new runtime LOGIN passwords for the API, the Worker and the API realtime dispatchers (new secret versions, re-keyed logins, restarted revisions).
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: azure-pilot
  cancel-in-progress: false

env:
  BICEP_VERSION: v0.47.16
  BICEP_SHA256: 64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a
  PILOT_REGION: mexicocentral
  PILOT_HOST: paquetenvia.com
  BLOB_TAG_READER_ROLE: Paquetenvia Pilot Blob Tag Reader

jobs:
  provenance:
    name: Verify provenance and pilot guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out control plane (github.sha)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install guard dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate dispatch inputs
        shell: bash
        env:
          TESTED_GIT_SHA: ${{ inputs.tested_git_sha }}
          FOUNDATION_RUN_ID: ${{ inputs.foundation_run_id }}
          CUSTOM_DOMAIN_PHASE: ${{ inputs.custom_domain_phase }}
        run: |
          set -euo pipefail
          if [[ ! "${TESTED_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tested_git_sha must match ^[0-9a-f]{40}$ (STOP_FOR_CONTRACT_REVIEW)"; exit 1
          fi
          if [[ ! "${FOUNDATION_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::foundation_run_id must match ^[0-9]+$ (STOP_FOR_CONTRACT_REVIEW)"; exit 1
          fi
          if [[ "${CUSTOM_DOMAIN_PHASE}" != "none" && "${CUSTOM_DOMAIN_PHASE}" != "bind" ]]; then
            echo "::error::custom_domain_phase must be none or bind"; exit 1
          fi

      - name: Fetch Foundation run and job records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_RUN_ID: ${{ inputs.foundation_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FOUNDATION_RUN_ID}" > "${RUNNER_TEMP}/foundation-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FOUNDATION_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/foundation-jobs.json"

      - name: Enforce the 13/13 provenance gate (STOP_FOR_CONTRACT_REVIEW on any failure)
        shell: bash
        env:
          TESTED_GIT_SHA: ${{ inputs.tested_git_sha }}
          FOUNDATION_RUN_ID: ${{ inputs.foundation_run_id }}
        run: >-
          python ./tools/azr-001/azr001_static_guards.py deploy-gate
          --tested-git-sha "${TESTED_GIT_SHA}"
          --dispatch-ref "${GITHUB_REF}"
          --dispatch-sha "${GITHUB_SHA}"
          --foundation-run-id "${FOUNDATION_RUN_ID}"
          --foundation-run-json "${RUNNER_TEMP}/foundation-run.json"
          --foundation-jobs-json "${RUNNER_TEMP}/foundation-jobs.json"

      - name: Check out tested_git_sha (deployment source)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_git_sha }}
          path: tested
          fetch-depth: 1

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  ${RUNNER_TEMP}/bicep" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/bicep"

      - name: Build and lint pilot templates of tested_git_sha (offline)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/env001-arm"
          for template in tested/deploy/azure/pilot/*.bicep; do
            "${RUNNER_TEMP}/bicep" build "${template}" --outdir "${RUNNER_TEMP}/env001-arm"
            "${RUNNER_TEMP}/bicep" lint "${template}"
          done

      - name: Run ENV-001 pilot guards against tested_git_sha
        shell: bash
        run: python ./tools/azr-001/env001_pilot_guards.py check --repo-root tested --arm-dir "${RUNNER_TEMP}/env001-arm"

      - name: Require every owner business setting (STOP_FOR_OWNER_DECISION)
        shell: bash
        run: python ./tools/azr-001/env001_pilot_guards.py settings-check --file tested/deploy/azure/pilot/apps.settings.json

      # OBS-002: the alert action group needs the owner's e-mail; stop before touching Azure while it is missing.
      - name: Require the OBS-002 alert e-mail (STOP_FOR_OWNER_DECISION)
        shell: bash
        run: python ./tools/azr-001/env001_pilot_guards.py observability-check --file tested/deploy/azure/pilot/observability.parameters.json

      # UI-001: the web needs the accepted terms and privacy notice versions to confirm orders; stop before
      # touching Azure while either is missing, malformed or still OWNER_DECISION_REQUIRED.
      - name: Require the accepted terms and privacy versions (STOP_FOR_OWNER_DECISION)
        shell: bash
        run: python ./tools/azr-001/env001_pilot_guards.py web-check --file tested/deploy/azure/pilot/web.parameters.json

  deploy:
    name: Deploy pilot (deployed_git_sha = tested_git_sha)
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: azure-pilot
    permissions:
      id-token: write
      contents: read
    env:
      TESTED_GIT_SHA: ${{ inputs.tested_git_sha }}
      CUSTOM_DOMAIN_PHASE: ${{ inputs.custom_domain_phase }}
      ROTATE_RUNTIME_LOGINS: ${{ inputs.rotate_runtime_logins }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PILOT_RESOURCE_GROUP: ${{ vars.PILOT_RESOURCE_GROUP }}
      PILOT_BUDGET_START_DATE: ${{ vars.PILOT_BUDGET_START_DATE }}
      PILOT_BUDGET_EMAILS: ${{ vars.PILOT_BUDGET_EMAILS }}
      PILOT_TRACKING_SUPPORT_URL: ${{ vars.PILOT_TRACKING_SUPPORT_URL }}
      PILOT_GATE_007_DECISION: ${{ vars.PILOT_GATE_007_DECISION }}
      PILOT_GATE_012_DECISION: ${{ vars.PILOT_GATE_012_DECISION }}
      # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: the PostgreSQL server the pilot uses. Empty = the first server (the
      # platform.bicep default); after a real restore the owner sets the restored server (README §6.4).
      PILOT_POSTGRES_SERVER_NAME: ${{ vars.PILOT_POSTGRES_SERVER_NAME }}
    steps:
      - name: Validate inputs and environment variables
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TESTED_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tested_git_sha must match ^[0-9a-f]{40}$"; exit 1; }
          [[ "${CUSTOM_DOMAIN_PHASE}" == "none" || "${CUSTOM_DOMAIN_PHASE}" == "bind" ]] || { echo "::error::invalid custom_domain_phase"; exit 1; }
          [[ "${AZURE_SUBSCRIPTION_ID}" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::AZURE_SUBSCRIPTION_ID variable is missing"; exit 1; }
          [[ "${PILOT_RESOURCE_GROUP}" =~ ^[A-Za-z0-9._-]{1,90}$ ]] || { echo "::error::PILOT_RESOURCE_GROUP variable is missing or invalid"; exit 1; }
          [[ "${PILOT_BUDGET_START_DATE}" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])-01$ ]] || { echo "::error::PILOT_BUDGET_START_DATE must be YYYY-MM-01"; exit 1; }
          [[ -z "${PILOT_BUDGET_EMAILS}" || "${PILOT_BUDGET_EMAILS}" =~ ^[A-Za-z0-9._%+@,-]+$ ]] || { echo "::error::PILOT_BUDGET_EMAILS must be a comma-separated list"; exit 1; }
          [[ -z "${PILOT_TRACKING_SUPPORT_URL}" || "${PILOT_TRACKING_SUPPORT_URL}" =~ ^https://[A-Za-z0-9./_-]+$ ]] || { echo "::error::PILOT_TRACKING_SUPPORT_URL must be an https URL"; exit 1; }

      - name: Check out tested_git_sha
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_git_sha }}
          fetch-depth: 1

      # tools/azr-001/env001_pilot_guards.py (gate-decision, scram-verifier, settings-check, web-check) imports PyYAML
      # at module scope: same interpreter and pin as the provenance job.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install guard dependencies
        run: python -m pip install PyYAML==6.0.3

      # ENV-001 acceptance: no pilot deployment without GATE-007 (privacy) and GATE-012 (cloud and data
      # residency) resolved or explicitly scoped by the owner. Each variable must equal the ID of exactly one
      # decision-log table row (at tested_git_sha) whose ID starts with GATE-007- / GATE-012- and whose Type
      # is `Gate resolution` or `Gate scoping`; anything else (a draft, an unrelated row) stops here.
      - name: Require owner decisions for GATE-007 and GATE-012 (STOP_FOR_OWNER_DECISION)
        shell: bash
        run: |
          set -euo pipefail
          python3 ./tools/azr-001/env001_pilot_guards.py gate-decision --gate 007 --decision-id "${PILOT_GATE_007_DECISION:-}"
          python3 ./tools/azr-001/env001_pilot_guards.py gate-decision --gate 012 --decision-id "${PILOT_GATE_012_DECISION:-}"

      # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: empty, or a pilot server name (the first server's name, optionally
      # followed by '-' parts, README §6.4); anything else stops here, before Azure.
      - name: Validate the PostgreSQL server setting (PILOT_POSTGRES_SERVER_NAME)
        shell: bash
        run: python3 ./tools/azr-001/env001_pilot_guards.py postgres-server-name --value "${PILOT_POSTGRES_SERVER_NAME:-}"

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  ${RUNNER_TEMP}/bicep" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/bicep"
          mkdir -p "${RUNNER_TEMP}/arm"
          for template in deploy/azure/pilot/*.bicep; do
            "${RUNNER_TEMP}/bicep" build "${template}" --outdir "${RUNNER_TEMP}/arm"
          done

      - name: Azure login (OIDC, no stored credential)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2 (v2.3.1)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify subscription, resource group and region
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          state="$(az account show --query state -o tsv)"
          [[ "${state}" == "Enabled" ]] || { echo "::error::subscription is not Enabled (STOP_FOR_OWNER_DECISION)"; exit 1; }
          location="$(az group show --name "${PILOT_RESOURCE_GROUP}" --query location -o tsv)"
          [[ "${location}" == "${PILOT_REGION}" ]] || { echo "::error::resource group must exist in ${PILOT_REGION} (bootstrap.md step 2)"; exit 1; }
          az extension add --name containerapp --upgrade --yes --only-show-errors

      # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: a named server must already exist (a point-in-time restore made it),
      # so a mistyped name can never create a second, empty server; and it must already have every value platform.bicep
      # sets that an existing server cannot change, so stage 2 updates it in place. Empty: the first server, unchanged.
      - name: Check the PostgreSQL server to adopt (PILOT_POSTGRES_SERVER_NAME)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PILOT_POSTGRES_SERVER_NAME:-}" ]]; then
            echo "PILOT_POSTGRES_SERVER_NAME is empty: the pilot keeps its first PostgreSQL server."
            exit 0
          fi
          if ! az resource show --resource-group "${PILOT_RESOURCE_GROUP}" --name "${PILOT_POSTGRES_SERVER_NAME}" \
              --resource-type Microsoft.DBforPostgreSQL/flexibleServers --api-version 2024-08-01 \
              --only-show-errors --output json > "${RUNNER_TEMP}/postgres-server.json"; then
            echo "::error::PostgreSQL server ${PILOT_POSTGRES_SERVER_NAME} cannot be read in ${PILOT_RESOURCE_GROUP}. Restore it first (README §6.4) or empty PILOT_POSTGRES_SERVER_NAME."
            exit 1
          fi
          python3 ./tools/azr-001/env001_pilot_guards.py postgres-adoption-check --name "${PILOT_POSTGRES_SERVER_NAME}" \
            --server-json "${RUNNER_TEMP}/postgres-server.json" --platform-arm "${RUNNER_TEMP}/arm/platform.json" \
            --subscription-id "${AZURE_SUBSCRIPTION_ID}" --resource-group "${PILOT_RESOURCE_GROUP}" --region "${PILOT_REGION}"

      - name: Stage 1 - identities, VNet, Key Vault (deny by default) and keys (security.bicep)
        id: security
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-security \
            --template-file "${RUNNER_TEMP}/arm/security.json" --only-show-errors --output none
          outputs="$(az deployment group show --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-security --query properties.outputs -o json)"
          for key in vaultName piiKeyUri dataProtectionKeyUri; do
            echo "${key}=$(jq -r ".${key}.value" <<<"${outputs}")" >> "${GITHUB_OUTPUT}"
          done

      # PILOT-KEYVAULT-PRIVATE-APP-READ: the vault denies public traffic; open a temporary /32 rule for this
      # runner only around its secret reads and writes (window 1), and always close it.
      - name: Open Key Vault firewall for this runner (window 1)
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: bash deploy/azure/pilot/kv-firewall.sh open "${VAULT}"

      - name: Ensure generated secrets (admin password, EmailLookup key); never printed
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rc=$?; shred -u "${RUNNER_TEMP}/s" 2>/dev/null || true; exit ${rc}' EXIT
          has_secret() { [[ "$(az keyvault secret list --vault-name "${VAULT}" --query "length([?name=='$1'])" -o tsv)" == "1" ]]; }
          put_secret() { az keyvault secret set --vault-name "${VAULT}" --name "$1" --file "$2" --encoding utf-8 --only-show-errors --output none; shred -u "$2"; }
          if ! has_secret pg-admin-password; then
            python3 -c "import secrets; print('Pv1-' + secrets.token_urlsafe(40), end='')" > "${RUNNER_TEMP}/s"
            put_secret pg-admin-password "${RUNNER_TEMP}/s"
            echo "Generated pg-admin-password."
          fi
          if ! has_secret paquetenvia-email-lookup-key-1; then
            openssl rand -base64 32 | tr -d '\n' > "${RUNNER_TEMP}/s"
            put_secret paquetenvia-email-lookup-key-1 "${RUNNER_TEMP}/s"
            echo "Generated paquetenvia-email-lookup-key-1."
          fi

      - name: Prepare platform parameters (reads the administrator password; never printed)
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: |
          set -euo pipefail
          umask 077
          # The parameters file holds the administrator password; Stage 2 consumes and shreds it.
          # If this step fails, shred it here so it never outlives a failed run.
          trap 'rc=$?; if [[ ${rc} -ne 0 ]]; then shred -u "${RUNNER_TEMP}/platform.parameters.json" 2>/dev/null || true; fi; exit ${rc}' EXIT
          scope="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${PILOT_RESOURCE_GROUP}"
          tag_reader="$(az role definition list --custom-role-only true --name "${BLOB_TAG_READER_ROLE}" --scope "${scope}" --query "[0].id" -o tsv)"
          [[ -n "${tag_reader}" ]] || { echo "::error::custom role '${BLOB_TAG_READER_ROLE}' is missing (bootstrap.md step 4)"; exit 1; }
          emails="$(python3 -c "import json,os; print(json.dumps([e for e in os.environ.get('PILOT_BUDGET_EMAILS','').split(',') if e]))")"
          admin="$(az keyvault secret show --vault-name "${VAULT}" --name pg-admin-password --query value -o tsv)"
          echo "::add-mask::${admin}"
          ADMIN="${admin}" TAG_READER="${tag_reader}" EMAILS="${emails}" python3 - > "${RUNNER_TEMP}/platform.parameters.json" <<'PY'
          import json, os
          parameters = {"postgresAdministratorPassword": {"value": os.environ["ADMIN"]},
                        "budgetStartDate": {"value": os.environ["PILOT_BUDGET_START_DATE"]},
                        "budgetContactEmails": {"value": json.loads(os.environ["EMAILS"])},
                        "blobTagReaderRoleDefinitionId": {"value": os.environ["TAG_READER"]},
                        "publicOrigin": {"value": "https://" + os.environ["PILOT_HOST"]}}
          # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: only a validated, adoptable name; empty keeps the template default.
          if os.environ.get("PILOT_POSTGRES_SERVER_NAME"):
              parameters["postgresServerName"] = {"value": os.environ["PILOT_POSTGRES_SERVER_NAME"]}
          print(json.dumps({"$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                            "contentVersion": "1.0.0.0", "parameters": parameters}))
          PY
          unset admin

      - name: Close Key Vault firewall for this runner (window 1)
        if: always()
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: bash deploy/azure/pilot/kv-firewall.sh close "${VAULT:-}"

      - name: Stage 2 - logs, registry, storage, PostgreSQL, environment, budget (platform.bicep)
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          trap 'shred -u "${RUNNER_TEMP}/platform.parameters.json" 2>/dev/null || true' EXIT
          az deployment group create --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-platform \
            --template-file "${RUNNER_TEMP}/arm/platform.json" --parameters "@${RUNNER_TEMP}/platform.parameters.json" \
            --only-show-errors --output none
          outputs="$(az deployment group show --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-platform --query properties.outputs -o json)"
          for key in registryName registryServer blobServiceUri postgresName postgresHost postgresAdministratorLogin containerEnvironmentName containerEnvironmentStaticIp customDomainVerificationId containerAppsSubnetPrefix; do
            echo "${key}=$(jq -r ".${key}.value" <<<"${outputs}")" >> "${GITHUB_OUTPUT}"
          done
          # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: every later consumer reads these two outputs.
          name="$(jq -r .postgresName.value <<<"${outputs}")"
          host="$(jq -r .postgresHost.value <<<"${outputs}")"
          if [[ -n "${PILOT_POSTGRES_SERVER_NAME:-}" && "${name}" != "${PILOT_POSTGRES_SERVER_NAME}" ]]; then
            echo "::error::platform.bicep deployed PostgreSQL server ${name}, not PILOT_POSTGRES_SERVER_NAME"; exit 1
          fi
          [[ "${host}" == "${name}.postgres.database.azure.com" ]] || { echo "::error::postgresHost does not belong to postgresName ${name}"; exit 1; }
          echo "PostgreSQL server in service: ${name}"

      # PILOT-KEYVAULT-PRIVATE-APP-READ: the vault denies public traffic; open a temporary /32 rule for this
      # runner only around its secret reads and writes (window 2), and always close it.
      - name: Open Key Vault firewall for this runner (window 2)
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: bash deploy/azure/pilot/kv-firewall.sh open "${VAULT}"

      - name: Ensure database connection secrets and runtime login verifiers; never printed
        id: connections
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
          PGHOST_FQDN: ${{ steps.platform.outputs.postgresHost }}
          PGADMIN_LOGIN: ${{ steps.platform.outputs.postgresAdministratorLogin }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rc=$?; shred -u "${RUNNER_TEMP}/s" 2>/dev/null || true; exit ${rc}' EXIT
          [[ "${PGHOST_FQDN}" =~ ^[a-z0-9-]+\.postgres\.database\.azure\.com$ ]] || { echo "::error::unexpected PostgreSQL host"; exit 1; }
          has_secret() { [[ "$(az keyvault secret list --vault-name "${VAULT}" --query "length([?name=='$1'])" -o tsv)" == "1" ]]; }
          put_secret() { az keyvault secret set --vault-name "${VAULT}" --name "$1" --file "$2" --encoding utf-8 --only-show-errors --output none; shred -u "$2"; }
          common="SSL Mode=VerifyFull;Timeout=15;Command Timeout=60"
          # The migration credential follows the administrator password (re-derived on every run).
          admin="$(az keyvault secret show --vault-name "${VAULT}" --name pg-admin-password --query value -o tsv)"
          echo "::add-mask::${admin}"
          printf 'Host=%s;Database=paqueteria;Username=%s;Password=%s;Maximum Pool Size=4;Minimum Pool Size=0;%s' \
            "${PGHOST_FQDN}" "${PGADMIN_LOGIN}" "${admin}" "${common}" > "${RUNNER_TEMP}/s"
          unset admin
          put_secret pg-migrate-connection "${RUNNER_TEMP}/s"
          # Runtime LOGIN passwords are generated once; the job receives only their SCRAM verifiers.
          # RTM-API-REALTIME-DISPATCHER-ROLE-2026-10-12: "realtime" is the API's in-process realtime dispatcher login
          # (pv_pilot_realtime, member of paqueteria_realtime only); the API never reads the Worker credential.
          # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: a kept credential stays only while it names the server in service.
          # After a restore its host is the old server's, so a new one is generated, as rotate_runtime_logins does, and
          # the logins job applies it on the new server. The kept value and its password are masked and never printed.
          changed=false
          for role in api worker realtime; do
            if [[ "${ROTATE_RUNTIME_LOGINS}" != "true" ]] && has_secret "pg-${role}-runtime-connection" && has_secret "pg-${role}-login-verifier"; then
              kept="$(az keyvault secret show --vault-name "${VAULT}" --name "pg-${role}-runtime-connection" --query value -o tsv)"
              echo "::add-mask::${kept}"
              kept_password="${kept#*Password=}"
              echo "::add-mask::${kept_password%%;*}"
              kept_host="$(printf '%s' "${kept}" | python3 ./tools/azr-001/env001_pilot_guards.py connection-host)"
              unset kept kept_password
              if [[ "${kept_host}" == "${PGHOST_FQDN}" ]]; then continue; fi
              echo "The runtime login credential for ${role} names another PostgreSQL server; generating one for ${PGHOST_FQDN}."
            fi
            changed=true
            password="$(openssl rand -hex 32)"
            echo "::add-mask::${password}"
            printf 'Host=%s;Database=paqueteria;Username=pv_pilot_%s;Password=%s;Maximum Pool Size=5;Minimum Pool Size=0;%s' \
              "${PGHOST_FQDN}" "${role}" "${password}" "${common}" > "${RUNNER_TEMP}/s"
            put_secret "pg-${role}-runtime-connection" "${RUNNER_TEMP}/s"
            printf '%s' "${password}" | python3 ./tools/azr-001/env001_pilot_guards.py scram-verifier | tr -d '\n' > "${RUNNER_TEMP}/s"
            put_secret "pg-${role}-login-verifier" "${RUNNER_TEMP}/s"
            unset password
            echo "Generated runtime login credential for ${role}."
          done
          echo "runtime_logins_changed=${changed}" >> "${GITHUB_OUTPUT}"
          if ! has_secret authcenter-paquetenvia-client-secret; then
            echo "::error::Key Vault ${VAULT} lacks authcenter-paquetenvia-client-secret. Store the AuthCenter client secret (README 'Secrets the owner writes') and re-run."
            exit 1
          fi
          if ! has_secret google-maps-api-key; then
            echo "::error::Key Vault ${VAULT} lacks google-maps-api-key. Store the restricted Google Maps Platform key (README 'Secrets the owner writes') and re-run."
            exit 1
          fi
          if ! has_secret public-tracking-link-key; then
            echo "::error::Key Vault ${VAULT} lacks public-tracking-link-key. Store the tracking link key (README 'Secrets the owner writes') and re-run."
            exit 1
          fi
          # OBS-003-TENANT-PSEUDONYM-2026-10-12: the API and the Worker refuse to start without the pseudonym key.
          if ! has_secret paquetenvia-telemetry-pseudonym-key-1; then
            echo "::error::Key Vault ${VAULT} lacks paquetenvia-telemetry-pseudonym-key-1. Store the organization pseudonym key (README 'Secrets the owner writes') and re-run."
            exit 1
          fi

      - name: Close Key Vault firewall for this runner (window 2)
        if: always()
        shell: bash
        env:
          VAULT: ${{ steps.security.outputs.vaultName }}
        run: bash deploy/azure/pilot/kv-firewall.sh close "${VAULT:-}"

      # ENV-001-ROLLBACK-REUSES-IMAGE-2026-10-21: an image is built once per commit. When paquetenvia-<name>:<tested_git_sha>
      # is already in the registry (an earlier run of this commit pushed it), the run reuses its digest and builds and
      # pushes nothing, so a rollback deploys the same bytes. Otherwise it builds on the floating bases (still unpinned,
      # so every new build gets their patches) and pushes. Then the tag is locked (write-enabled false): the registry
      # refuses any later push over it, and its deletion, until someone deliberately unlocks it. Every later step uses
      # the digest, never the tag. A registry read that fails stops the run; it never leads to a build.
      - name: Build or reuse the images by digest (deployed_git_sha = tested_git_sha)
        id: images
        shell: bash
        env:
          REGISTRY: ${{ steps.platform.outputs.registryName }}
          REGISTRY_SERVER: ${{ steps.platform.outputs.registryServer }}
        run: |
          set -euo pipefail
          # build() runs inside command substitutions: any failing command in it must still fail the step.
          shopt -s inherit_errexit
          [[ "$(git rev-parse HEAD)" == "${TESTED_GIT_SHA}" ]] || { echo "::error::checkout is not tested_git_sha"; exit 1; }
          az acr login --name "${REGISTRY}" --only-show-errors
          # GATE-001-TRACKING-SUPPORT-LINK-2026-10-11: no support link by default while GATE-001 is open (the host shows
          # the commercial name); an empty value makes public tracking point the recipient to the channel the link came by.
          # The link is compiled into the web image, so a reused web image keeps the link it was built with.
          support_url="${PILOT_TRACKING_SUPPORT_URL:-}"
          repositories="$(az acr repository list --name "${REGISTRY}" --only-show-errors --output json)"
          # tag_digest REPOSITORY: the digest of REPOSITORY:<tested_git_sha>, or nothing when that tag does not exist.
          tag_digest() {
            local repository="$1" found tags
            found="$(jq -r --arg repository "${repository}" 'any(.[]; . == $repository)' <<<"${repositories}")"
            [[ "${found}" == "true" ]] || return 0
            tags="$(az acr repository show-tags --name "${REGISTRY}" --repository "${repository}" --only-show-errors --output json)"
            found="$(jq -r --arg tag "${TESTED_GIT_SHA}" 'any(.[]; . == $tag)' <<<"${tags}")"
            [[ "${found}" == "true" ]] || return 0
            az acr repository show --name "${REGISTRY}" --image "${repository}:${TESTED_GIT_SHA}" --only-show-errors --output json \
              | jq -r '.digest'
          }
          # build NAME DOCKERFILE [BUILD ARGS...]: prints <registry>/paquetenvia-NAME@<digest> and sets the step output
          # <NAME without '-'>_source to reused or built.
          build() {
            local name="$1" dockerfile="$2"; shift 2
            local repository="paquetenvia-${name}" ref="${REGISTRY_SERVER}/paquetenvia-${name}:${TESTED_GIT_SHA}"
            local digest source tag
            digest="$(tag_digest "${repository}")"
            if [[ -n "${digest}" ]]; then
              source=reused
              echo "reusing ${REGISTRY_SERVER}/${repository}@${digest}" >&2
            else
              source=built
              echo "building ${ref}" >&2
              docker build --pull --file "${dockerfile}" --build-arg "SOURCE_SHA=${TESTED_GIT_SHA}" "$@" --tag "${ref}" . >&2
              docker push "${ref}" >&2
              digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${ref}")"
              digest="${digest##*@}"
            fi
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::image ${name} has no immutable digest" >&2; exit 1; }
            az acr repository update --name "${REGISTRY}" --image "${repository}:${TESTED_GIT_SHA}" --write-enabled false \
              --only-show-errors --output none
            tag="$(az acr repository show --name "${REGISTRY}" --image "${repository}:${TESTED_GIT_SHA}" --only-show-errors --output json)"
            if [[ "$(jq -r '.digest' <<<"${tag}")" != "${digest}" || "$(jq -r '.changeableAttributes.writeEnabled' <<<"${tag}")" != "false" ]]; then
              echo "::error::tag ${repository}:${TESTED_GIT_SHA} is not locked on ${digest} (README §6.7)" >&2
              exit 1
            fi
            echo "${name//-/}_source=${source}" >> "${GITHUB_OUTPUT}"
            echo "${REGISTRY_SERVER}/${repository}@${digest}"
          }
          image="$(build api deploy/azure/Dockerfile.api)"
          echo "api=${image}" >> "${GITHUB_OUTPUT}"
          image="$(build worker deploy/azure/Dockerfile.worker)"
          echo "worker=${image}" >> "${GITHUB_OUTPUT}"
          image="$(build db-ops deploy/azure/pilot/Dockerfile.db-ops)"
          echo "dbops=${image}" >> "${GITHUB_OUTPUT}"
          # AUTH-001 BFF web build: same origin, NEXT_PUBLIC_API_BASE_URL never defined (see the Dockerfile header).
          # GATE-001-NEUTRAL-PUBLIC-BRAND-2026-10-10: no NEXT_PUBLIC_TRACKING_BRAND_NAME while GATE-001 is open,
          # so public tracking shows the neutral heading "Seguimiento de envío" (next.config.ts refuses the brand).
          image="$(build web deploy/azure/pilot/Dockerfile.web \
            --build-arg "NEXT_PUBLIC_TRACKING_SUPPORT_URL=${support_url}")"
          echo "web=${image}" >> "${GITHUB_OUTPUT}"

      - name: Stage 3 - migration, runtime-login and verify jobs (jobs.bicep), then run them
        shell: bash
        env:
          DBOPS_IMAGE: ${{ steps.images.outputs.dbops }}
        run: |
          set -euo pipefail
          [[ "${DBOPS_IMAGE##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::db-ops image is not digest-pinned"; exit 1; }
          az deployment group create --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-jobs \
            --template-file "${RUNNER_TEMP}/arm/jobs.json" --parameters "dbOpsImage=${DBOPS_IMAGE}" \
            --only-show-errors --output none
          run_job() {
            local job="$1" execution status
            execution="$(az containerapp job start --name "${job}" --resource-group "${PILOT_RESOURCE_GROUP}" --query name -o tsv)"
            echo "Started ${job} execution ${execution}"
            for attempt in $(seq 1 120); do
              status="$(az containerapp job execution show --name "${job}" --resource-group "${PILOT_RESOURCE_GROUP}" \
                --job-execution-name "${execution}" --query properties.status -o tsv)"
              case "${status}" in
                Succeeded) echo "${job}: Succeeded"; return 0 ;;
                Failed|Stopped|Degraded) echo "::error::${job} execution ${execution} ${status}; read its console log in Log Analytics (README 'Troubleshooting')"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::${job} did not finish within 30 minutes"; return 1
          }
          run_job job-pv-pilot-migrate
          run_job job-pv-pilot-logins
          run_job job-pv-pilot-verify

      # The apps read their Key Vault secrets once at start. After stage 3 has applied the logins: restart a running
      # revision whose database credential changed (rotate_runtime_logins, or a new PostgreSQL server:
      # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20), and start a revision the real restore stopped (README §6.4 step 1),
      # which then reads the current credential. Before the first stage 4 the apps do not exist yet.
      - name: Start or restart the API and Worker on the current database credentials
        shell: bash
        env:
          RUNTIME_LOGINS_CHANGED: ${{ steps.connections.outputs.runtime_logins_changed }}
        run: |
          set -euo pipefail
          for app in ca-pv-pilot-api ca-pv-pilot-worker; do
            if [[ -z "$(az containerapp list --resource-group "${PILOT_RESOURCE_GROUP}" --query "[?name=='${app}'].name" -o tsv)" ]]; then
              echo "${app} is not deployed yet; stage 4 creates it with the current credentials."
              continue
            fi
            revision="$(az containerapp show --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" --query properties.latestRevisionName -o tsv)"
            active="$(az containerapp revision show --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" --revision "${revision}" --query properties.active -o tsv)"
            if [[ "${active}" != "true" ]]; then
              az containerapp revision activate --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" --revision "${revision}" --only-show-errors --output none
              echo "Started ${app} revision ${revision}."
            elif [[ "${RUNTIME_LOGINS_CHANGED}" == "true" ]]; then
              az containerapp revision restart --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" --revision "${revision}" --only-show-errors --output none
              echo "Restarted ${app} revision ${revision}."
            fi
          done

      - name: Stage 4 - Web, API, Worker and same-origin route (apps.bicep)
        id: apps
        shell: bash
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          PII_KEY_URI: ${{ steps.security.outputs.piiKeyUri }}
          DP_KEY_URI: ${{ steps.security.outputs.dataProtectionKeyUri }}
          BLOB_URI: ${{ steps.platform.outputs.blobServiceUri }}
          PROXY_NETWORK: ${{ steps.platform.outputs.containerAppsSubnetPrefix }}
        run: |
          set -euo pipefail
          for image in "${API_IMAGE}" "${WORKER_IMAGE}" "${WEB_IMAGE}"; do
            [[ "${image##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::image is not digest-pinned"; exit 1; }
          done
          python3 ./tools/azr-001/env001_pilot_guards.py settings-check --file deploy/azure/pilot/apps.settings.json
          python3 ./tools/azr-001/env001_pilot_guards.py web-check --file deploy/azure/pilot/web.parameters.json
          az deployment group create --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-apps \
            --template-file "${RUNNER_TEMP}/arm/apps.json" \
            --parameters "apiImage=${API_IMAGE}" "workerImage=${WORKER_IMAGE}" "webImage=${WEB_IMAGE}" \
              "publicHost=${PILOT_HOST}" "customDomainPhase=${CUSTOM_DOMAIN_PHASE}" \
              "piiKeyUri=${PII_KEY_URI}" "dataProtectionKeyUri=${DP_KEY_URI}" "blobServiceUri=${BLOB_URI}" \
              "trustedProxyNetwork=${PROXY_NETWORK}" "businessSettings=@deploy/azure/pilot/apps.settings.json" \
              "@deploy/azure/pilot/web.parameters.json" \
            --only-show-errors --output none
          fqdn="$(az deployment group show --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-apps --query properties.outputs.routeFqdn.value -o tsv)"
          echo "routeFqdn=${fqdn}" >> "${GITHUB_OUTPUT}"

      # OPS-002-RESTORE-FOLLOWS-SERVER-2026-10-20: the SCL-007 alerts watch the server stage 2 deployed.
      - name: Stage 5 - OBS-002 alerts, e-mail action group and workbook (observability.bicep)
        shell: bash
        env:
          POSTGRES_NAME: ${{ steps.platform.outputs.postgresName }}
        run: |
          set -euo pipefail
          python3 ./tools/azr-001/env001_pilot_guards.py observability-check --file deploy/azure/pilot/observability.parameters.json
          [[ -n "${POSTGRES_NAME}" ]] || { echo "::error::stage 2 gave no postgresName"; exit 1; }
          az deployment group create --resource-group "${PILOT_RESOURCE_GROUP}" --name env001-observability \
            --template-file "${RUNNER_TEMP}/arm/observability.json" \
            --parameters "@deploy/azure/pilot/observability.parameters.json" "postgresServerName=${POSTGRES_NAME}" \
            --only-show-errors --output none

      # ENV-001 F-06: a successful stage 4 does not mean the new code serves. In single revision mode Container Apps
      # keeps the previous revision serving until the new one is ready, and keeps it serving if the new one never
      # becomes ready, so the smoke test below would pass on old code. Each app must reach a latest revision that is
      # ready, runs this run's digest, is active and Healthy. Up to 40 polls 15 s apart (about 10 minutes) for the three
      # apps together; a ready revision on another image is polled again too, because right after stage 4 the control
      # plane can still report the previous revision as the latest one, and so is health, because a revision the start
      # step above re-activated (README §6.4 step 5) is ready again before its replicas pass their probes. Nothing
      # secret is read or printed.
      - name: Check that the new API, Worker and Web revisions serve this run's images
        id: revisions
        shell: bash
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          set -euo pipefail
          polls_left=40
          # fail APP MESSAGE: one annotation with the revision and where to read why it did not start.
          fail() {
            echo "::error::$1: $2 Read its system log: az containerapp logs show --name $1 --resource-group ${PILOT_RESOURCE_GROUP} --type system (README §6.7)."
          }
          # check_revision OUTPUT APP IMAGE
          check_revision() {
            local output="$1" app="$2" image="$3" state latest ready revision images active health status
            [[ "${image##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${app}: this run has no digest-pinned image for it"; return 1; }
            while true; do
              state="$(az containerapp show --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" \
                --query "{latest: properties.latestRevisionName, ready: properties.latestReadyRevisionName}" -o json)"
              latest="$(jq -r '.latest // ""' <<<"${state}")"
              ready="$(jq -r '.ready // ""' <<<"${state}")"
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                revision="$(az containerapp revision show --name "${app}" --resource-group "${PILOT_RESOURCE_GROUP}" --revision "${ready}" \
                  --query "{active: properties.active, health: properties.healthState, images: properties.template.containers[].image}" -o json)"
                images="$(jq -r '(.images // []) | join(" ")' <<<"${revision}")"
                active="$(jq -r '.active // false' <<<"${revision}")"
                health="$(jq -r '.health // ""' <<<"${revision}")"
                if [[ "${images}" != "${image}" ]]; then
                  # Not yet this run's revision: right after stage 4 the previous one can still be reported as latest.
                  status="revision ${ready} is ready but runs '${images}', not this run's image (${image})"
                elif [[ "${active}" == "true" && "${health}" == "Healthy" ]]; then
                  echo "${app}: revision ${ready} is ready, active and Healthy, and runs ${image}"
                  echo "${output}=${ready}" >> "${GITHUB_OUTPUT}"
                  return 0
                else
                  status="revision ${ready} is ready but active=${active}, healthState=${health:-none}"
                fi
              else
                status="latest revision ${latest:-none} is not ready (latest ready revision: ${ready:-none})"
              fi
              if (( polls_left == 0 )); then
                fail "${app}" "${status} after about 10 minutes; the previous revision, if any, is still serving."
                return 1
              fi
              polls_left=$((polls_left - 1))
              echo "${app}: ${status}; polling again in 15 s"
              sleep 15
            done
          }
          check_revision api_revision ca-pv-pilot-api "${API_IMAGE}"
          check_revision worker_revision ca-pv-pilot-worker "${WORKER_IMAGE}"
          check_revision web_revision ca-pv-pilot-web "${WEB_IMAGE}"

      - name: Smoke test same-origin routing
        shell: bash
        env:
          ROUTE_FQDN: ${{ steps.apps.outputs.routeFqdn }}
        run: |
          set -euo pipefail
          base="https://${ROUTE_FQDN}"
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${base}/")" || code=000
            [[ "${code}" == "200" ]] && break
            [[ "${attempt}" == 20 ]] && { echo "::error::Web did not answer 200 on /"; exit 1; }
            sleep 15
          done
          # /auth goes to the API: the anonymous session probe answers (problem+)JSON 401, never the Web HTML.
          session_type="$(curl -s -o /dev/null -w '%{content_type}' "${base}/auth/session")"
          [[ "${session_type}" == application/*json* ]] || { echo "::error::/auth/session is not served by the API (${session_type})"; exit 1; }
          # AuthCenter back-channel logout: server-to-server POST without Origin reaches the API and is rejected as invalid, not blocked.
          body="$(curl -s -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'logout_token=invalid' "${base}/auth/backchannel-logout")"
          [[ "${body}" == *invalid_request* ]] || { echo "::error::/auth/backchannel-logout did not reach the API"; exit 1; }
          echo "Same-origin routing smoke test passed on ${base}"

      - name: Summary and DNS records for the owner
        if: always()
        shell: bash
        env:
          STATIC_IP: ${{ steps.platform.outputs.containerEnvironmentStaticIp }}
          VERIFICATION_ID: ${{ steps.platform.outputs.customDomainVerificationId }}
          ROUTE_FQDN: ${{ steps.apps.outputs.routeFqdn }}
          POSTGRES_NAME: ${{ steps.platform.outputs.postgresName }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          DBOPS_IMAGE: ${{ steps.images.outputs.dbops }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_REVISION: ${{ steps.revisions.outputs.api_revision }}
          WORKER_REVISION: ${{ steps.revisions.outputs.worker_revision }}
          WEB_REVISION: ${{ steps.revisions.outputs.web_revision }}
          API_SOURCE: ${{ steps.images.outputs.api_source }}
          WORKER_SOURCE: ${{ steps.images.outputs.worker_source }}
          DBOPS_SOURCE: ${{ steps.images.outputs.dbops_source }}
          WEB_SOURCE: ${{ steps.images.outputs.web_source }}
        run: |
          {
            echo "## ENV-001 pilot deployment"
            echo "- deployed_git_sha: \`${TESTED_GIT_SHA}\`"
            echo "- PostgreSQL server: \`${POSTGRES_NAME:-not deployed}\`"
            echo "- route FQDN: \`${ROUTE_FQDN:-not deployed}\`"
            echo "- custom domain phase: \`${CUSTOM_DOMAIN_PHASE}\`"
            echo ""
            # ENV-001 F-05/F-06: the digests this run deploys, whether each was built now or reused from an earlier run
            # of this commit (ENV-001-ROLLBACK-REUSES-IMAGE-2026-10-21), and the revision of each app that is ready,
            # active, Healthy and runs its digest (empty when the check did not pass).
            echo "### Images deployed by this run"
            echo "| Image | Digest | Built or reused | Serving revision |"
            echo "|---|---|---|---|"
            echo "| API | \`${API_IMAGE:-none}\` | ${API_SOURCE:-no image} | \`${API_REVISION:-not verified}\` |"
            echo "| Worker | \`${WORKER_IMAGE:-none}\` | ${WORKER_SOURCE:-no image} | \`${WORKER_REVISION:-not verified}\` |"
            echo "| Web | \`${WEB_IMAGE:-none}\` | ${WEB_SOURCE:-no image} | \`${WEB_REVISION:-not verified}\` |"
            echo "| DB ops (migrate, logins and verify jobs) | \`${DBOPS_IMAGE:-none}\` | ${DBOPS_SOURCE:-no image} | job image, no revision |"
            echo ""
            echo "### DNS records for ${PILOT_HOST} (create at the DNS host, then re-run with custom_domain_phase=bind)"
            echo "| Type | Host | Value |"
            echo "|---|---|---|"
            echo "| A | @ | ${STATIC_IP:-unknown} |"
            echo "| TXT | asuid | ${VERIFICATION_ID:-unknown} |"
          } >> "${GITHUB_STEP_SUMMARY}"
