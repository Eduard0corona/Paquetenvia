      - DELIVERY_ATTEMPTED
      - RESCHEDULED
      - DELIVERED
      - RETURNING
      - RETURNED
      - CANCELLED
    OrderAcceptance:
      type: object
      required:
      - id
      - order_id
      - terms_version
      - privacy_version
      - accepted_at_client
      - recorded_at_server
      - acceptance_channel
      - evidence_schema_version
      - evidence_hash
      properties:
