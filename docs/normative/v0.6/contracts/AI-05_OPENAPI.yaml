        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /platform/ally-applications/{organizationId}/decision:
    post:
      tags:
      - Platform
      operationId: decideAllyOrganization
      description: >-
        REG-ALLY-APPROVAL-PATH. A PLATFORM_ADMIN with MFA, from an ACTIVE PLATFORM
        organization, approves or rejects a PENDING_APPROVAL ALLY. APPROVE makes it
        ACTIVE and only that (REG-ALLY-APPROVAL-ACTIVATE-ONLY - no ally relationship is
        created; relationships belong to ALY-00x). REJECT makes it CLOSED
        (REG-ALLY-REJECTION-CLOSED); its creator may apply again with a new organization.
        One audit row (ALLY_ORGANIZATION_APPROVED or ALLY_ORGANIZATION_REJECTED) is written
        in the platform organization and one in the ALLY organization, in the same
        transaction. Repeating the decision already taken returns it again without new
        audit rows; any other state is 409 ALLY_DECISION_CONFLICT.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllyDecisionRequest'
      responses:
