          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >-
            CONFLICT covers Idempotency-Key reuse with a different payload,
            inconsistent replay evidence and concurrency conflicts, including a
            source claimed by a concurrent settlement.
          enum:
          - INVALID_REQUEST
          - CONFLICT
          - SETTLEMENT_STATE_CONFLICT
          - CASH_PENDING
          - INCIDENT_PENDING
          - CLAIM_PENDING
