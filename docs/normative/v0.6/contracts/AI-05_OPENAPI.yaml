x-realtime-contract: ./AI-12_SIGNALR_CONTRACT.yaml
x-authorization-visibility:
  '401': invalid or missing authentication
  '403': authenticated but missing capability for visible tenant resource
  '404': missing, cross-tenant, expired or revoked; indistinguishable response
x-runtime-contracts:
  token_hash: SHA-256 over exact UTF-8 bytes of Base64URL-no-padding token; bytea length 32
  money: all cents fields are int64
  legal_acceptance: OrderAcceptanceCanonicalForm v1 fixed-order compact JSON + SHA-256
  tenant_org_setting: parameterized uuid[] converted to PostgreSQL array text; empty {} and never null
x-capability-matrix:
  status: DECIDED
  decision: D5-CAPABILITY-MATRIX (project owner, 2026-09-26)
  implementation: pending; each operation keeps its current enforced rules until the implementing task aligns them and its
    tests
  rules:
  - PLATFORM_ADMIN keeps the existing MFA requirement wherever an operation already demands it
  - unlisted roles receive the uniform 403 before any resource access
  - VIEWER reads never return exact coordinates (lat/lng); a coarse or summary location is the only permitted form
  operations:
    createQuote: [DISPATCHER, PLATFORM_ADMIN]
    getQuote: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    createOrder: [DISPATCHER, PLATFORM_ADMIN]
    listOrders: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    getOrder: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    previewOrderCsv: [DISPATCHER, PLATFORM_ADMIN]
    commitOrderCsv: [DISPATCHER, PLATFORM_ADMIN]
    listCities: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    listServiceAreas: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    listOperatingZones: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    listLocations: [DISPATCHER, PLATFORM_ADMIN, VIEWER]
    createLocation: [DISPATCHER, PLATFORM_ADMIN]
    listMyStops: [DRIVER]
    listMyEligibleExternalOffers: [DRIVER]
    createSettlement: [FINANCE, PLATFORM_ADMIN]
    getSettlement: [FINANCE, PLATFORM_ADMIN]
    addSettlementAdjustment: [FINANCE, PLATFORM_ADMIN]
    approveSettlement: [FINANCE, PLATFORM_ADMIN]
    markSettlementPaid: [FINANCE, PLATFORM_ADMIN]
    voidSettlement: [FINANCE, PLATFORM_ADMIN]
    exportSettlementCsv: [FINANCE, PLATFORM_ADMIN]
  driver_scope: DRIVER (OWN or EXTERNAL) sees only its own assignments, stops and offers; it has no access to orders,
    quotes, locations, CSV imports or settlements outside them
  finance_scope: FINANCE is limited to settlements and finance; getOrderFinancials and getRouteFinancials fall inside
    finance, while whether FINANCE may also reconcile COD is not stated by D5 and remains an open owner question
x-pilot-contract-deltas:
  purpose: Contract deltas recorded for the pilot. The HTTP surface above is unchanged until the implementing task publishes
    each delta together with code and tests. DECIDED entries are owner decisions; PROPOSED entries await an owner decision.
  entries:
  - id: D6-COD-EXPECTED
    status: DECIDED
    decision: D6-COD-PILOT
    delta: CreateOrderRequest and the CSV row accept an optional non-negative integer COD expectation in MXN cents (int64),
      declared by the dispatcher; it is copied to orders.cod_expected_cents and flows to FIN-001 and SET-001
    open_point: whether the quote also carries the COD expectation is not stated by D6 (PROPOSED - keep it on the order
      only, since the quote is priced before the COD decision)
  - id: D7-SETTLEMENT-CLOSED-PERIOD
    status: DECIDED
    decision: D7-SETTLEMENT-RULES
    delta: createSettlement rejects a period whose period_to is not strictly before the current operational date with 409
      code SETTLEMENT_PERIOD_NOT_CLOSED
  - id: D7-SETTLEMENT-NEGATIVE-TOTAL
    status: DECIDED
    decision: D7-SETTLEMENT-RULES
    delta: createSettlement and addSettlementAdjustment reject any result with total below zero with 409 code
      SETTLEMENT_TOTAL_NEGATIVE
  - id: D7-SETTLEMENT-MFA
    status: DECIDED
    decision: D7-SETTLEMENT-RULES
    delta: approveSettlement and markSettlementPaid require a satisfied MFA challenge for every permitted role, including
      FINANCE
  - id: D7-SETTLEMENT-EXPORT-AUDIT
    status: DECIDED
    decision: D7-SETTLEMENT-RULES
    delta: exportSettlementCsv writes one append-only audit entry per export and its 200 response declares the header
      Cache-Control no-store
  - id: SET-LIST
    status: PROPOSED
    delta: add listSettlements (GET /settlements) with cursor pagination, filters payee_id, status, period_from and period_to,
      same capabilities as getSettlement and the uniform error matrix 401/403/409/503
  - id: LOC-PII-KEY-VERSION
    status: PROPOSED
    delta: remove pii_key_version from CreateLocationRequest; the server PII protector selects and persists the key version
      (ADP-001)
  - id: ORD-ACCEPTANCE-LIMITS
    status: PROPOSED
    delta: publish explicit bounds that AI-05 lacks today - suggested values for the owner to confirm are terms_version and
      privacy_version minLength 1, maxLength 64, pattern ^[A-Za-z0-9._-]+$; accepted_at not later than server time plus 5
      minutes nor earlier than server time minus 72 hours; CreateQuoteRequest packages keep minItems 1 and gain maxItems 20
  - id: UNDECLARED-STATUS-CODES
    status: PROPOSED
    delta: declare the status codes the implementation already emits - 503 on createQuote, getQuote, createOrder, listOrders,
      getOrder, transitionOrder, listLocations, createLocation, createProofUploadSession and finalizeProof; 409 on
      createProofUploadSession and finalizeProof; 429 and 503 on publicTracking; 503 from the tenant-context middleware on
      every tenant operation; and decide whether the 400 responses returned by the Locations endpoints and for a missing or
      malformed tenant context header become part of the contract or are replaced by 409 INVALID_REQUEST or 403
  - id: PUBLIC-TIMELINE-ORDER
    status: PROPOSED
    delta: the public tracking timeline is ordered by (occurred_at, aggregate_version) so ties are deterministic; this needs the
      AI-06 change described in the governance/pilot-contracts PR
