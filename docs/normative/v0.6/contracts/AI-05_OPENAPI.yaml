      responses:
        '200':
          description: The caller's organization applications, newest first (at most 50)
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/OrganizationApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /platform/ally-applications:
    get:
      tags:
      - Platform
      operationId: listPendingAllyOrganizations
      description: >-
        REG-ALLY-APPROVAL-PATH. The ALLY organizations waiting for approval
        (PENDING_APPROVAL), oldest first. Only a PLATFORM_ADMIN member with a satisfied
        MFA challenge, operating from an ACTIVE organization of type PLATFORM selected
        with X-Organization-Id; anyone else receives 403 (MFA_REQUIRED when only the
        second factor is missing) and reads nothing.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
