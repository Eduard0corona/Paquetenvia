          type: boolean
          const: true
        authorized:
          type: boolean
        mfa:
          type: boolean
        csrfToken:
          type: string
        sessionNamespace:
          type: string
          description: Non-reversible per-identity key for partitioning in-browser caches.
          minLength: 32
          maxLength: 32
        user:
          type: object
          additionalProperties: false
          required:
          - name
          - email
          properties:
            name:
              type:
              - string
              - 'null'
              maxLength: 200
            email:
              type:
              - string
              - 'null'
              maxLength: 320
