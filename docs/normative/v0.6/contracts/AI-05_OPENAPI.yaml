x-authorization-visibility:
  '401': invalid or missing authentication
  '403': authenticated but missing capability for visible tenant resource
  '404': missing, cross-tenant, expired or revoked; indistinguishable response
x-offline-operation-age:
  decisions:
  - OPS-003-OFFLINE-72H
  - OPS-003-SERVER-72H-REJECTION
  - OPS-003-INCIDENT-72H-UNIFICATION
  - OPS-003-INCIDENT-72H-UNIFICATION-CONFIGURABLE-2026-09-27
  - OPS-003-INCIDENT-AGE-CAP-72H-2026-09-27
  operations:
    transitionOrder: client_occurred_at (optional)
    createProofUploadSession: client_occurred_at (optional)
    finalizeProof: captured_at (required)
    openIncident:
      timestamp: occurred_at (required)
      maximum_age_default: PT72H
      maximum_age_configurable: true
      maximum_age_setting: Incidents:MaximumOccurrenceAgeHours
      maximum_age_range: PT1H..PT72H
      clock_tolerance_default: PT5M
      clock_tolerance_range: PT0S..PT60M
      clock_tolerance_setting: Incidents:MaximumOccurrenceSkewMinutes
      clock_ahead: 409 INVALID_REQUEST
      missing_timestamp: 409 INVALID_REQUEST
  maximum_age: PT72H
  maximum_age_configurable: false
  clock_tolerance_default: PT5M
  clock_tolerance_range: PT0S..PT5M
  clock_tolerance_setting: OfflineOperations:ClockToleranceSeconds
  rules:
  - the server compares the timestamp with its own UTC clock before the operation reaches its service
  - a timestamp exactly 72 hours old is accepted; an older one is rejected with 409 OFFLINE_OPERATION_EXPIRED
  - a timestamp later than server time plus the clock tolerance is rejected as an invalid request (transitionOrder 409
    without code, proof operations 409 INVALID_REQUEST)
  - an absent optional client_occurred_at is an online operation and is not age-checked; an absent captured_at is
    INVALID_REQUEST as before
  - idempotency keys younger than 72 hours are never purged, so an accepted replay always finds its key
  - maximum_age, maximum_age_configurable and the clock_tolerance fields above apply to every operation listed with a
    plain value; an operation listed with its own mapping (openIncident) declares its own limits there and keeps the
    same comparison, the same inclusive bounds and the same 409 OFFLINE_OPERATION_EXPIRED
  - openIncident's maximum age may only be tightened below PT72H, never widened past the 72-hour idempotency-key floor,
    so a report whose key may have been purged is always refused and can never open a second incident; a larger setting
    fails the start
  - openIncident compares occurred_at before the incident service and before its idempotency replay, so a report older
    than its configured maximum age is refused even when its Idempotency-Key is still stored
