        assignment_count:
          type: integer
          minimum: 0
          format: int32
    CodPosition:
      type: object
      additionalProperties: false
      description: >-
        Cash-on-delivery position of one order. expected_cents is the order's
        expectation; status and amount_cents describe its collection, so status
        is null and amount_cents is omitted until one is recorded.
      required:
      - expected_cents
      - status
      - recorded
      - reconciled
      - satisfies_delivery_requirement
      - satisfies_close_requirement
      properties:
        expected_cents:
          type: integer
          minimum: 0
          format: int64
        status:
          type:
          - string
          - 'null'
          enum:
          - EXPECTED
          - RECORDED
          - RECONCILED
          - DISPUTED
          - REVERSED
          - null
        amount_cents:
          type: integer
          format: int64
        recorded:
          type: boolean
        reconciled:
          type: boolean
        satisfies_delivery_requirement:
          type: boolean
          description: Whether the DELIVERING to DELIVERED COD guard is satisfied.
        satisfies_close_requirement:
          type: boolean
          description: Whether the DELIVERED to CLOSED COD guard is satisfied.
    OrderFinancials:
      type: object
      additionalProperties: false
      description: >-
        Revenue is the priced order total, cost is the sum of its ACCEPTED,
        ACTIVE and COMPLETED assignments grouped by modality, and margin is
        revenue minus cost. margin_basis_points is null when revenue is zero.
      required:
      - order_id
      - order_status
      - currency
      - revenue_cents
      - cost_cents
      - margin_cents
      - margin_basis_points
      - cost_by_modality
      - cod
      properties:
        order_id:
          type: string
          format: uuid
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        currency:
          type: string
          const: MXN
        revenue_cents:
          type: integer
          minimum: 0
          format: int64
        cost_cents:
          type: integer
          minimum: 0
          format: int64
        margin_cents:
          type: integer
          format: int64
        margin_basis_points:
          type:
          - integer
          - 'null'
          format: int64
        cost_by_modality:
          type: array
          description: One bucket per modality, in the order OWN, EXTERNAL, ALLY_CAPACITY.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/ModalityCost'
        cod:
          $ref: '#/components/schemas/CodPosition'
    RouteOrderFinancials:
      type: object
      additionalProperties: false
      required:
      - order_id
      - revenue_cents
      - cost_cents
      - margin_cents
      - margin_basis_points
      - cost_by_modality
      - cod
      properties:
        order_id:
          type: string
          format: uuid
        revenue_cents:
          type: integer
          minimum: 0
          format: int64
        cost_cents:
          type: integer
          minimum: 0
          format: int64
        margin_cents:
          type: integer
          format: int64
        margin_basis_points:
          type:
          - integer
          - 'null'
          format: int64
        cost_by_modality:
          type: array
          description: One bucket per modality, in the order OWN, EXTERNAL, ALLY_CAPACITY.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/ModalityCost'
        cod:
          $ref: '#/components/schemas/CodPosition'
    RouteFinancials:
      type: object
      additionalProperties: false
      description: >-
        Totals of the orders on the route's stops; each equals the sum of the
        per-order values in orders. Only RECORDED collections are pending
        reconciliation, at their recorded amount; expected but uncollected cash
        appears only in cod_expected_cents_total.
      required:
      - route_id
      - route_status
      - currency
      - order_count
      - revenue_cents_total
      - cost_cents_total
      - margin_cents_total
      - margin_basis_points
      - cost_by_modality
      - cod_expected_cents_total
      - cod_pending_reconciliation_cents_total
      - cod_pending_reconciliation_count
      - orders
      properties:
        route_id:
          type: string
          format: uuid
        route_status:
          $ref: '#/components/schemas/RouteStatus'
        currency:
          type: string
          const: MXN
        order_count:
          type: integer
          minimum: 0
          format: int32
        revenue_cents_total:
          type: integer
          minimum: 0
          format: int64
        cost_cents_total:
          type: integer
          minimum: 0
          format: int64
        margin_cents_total:
          type: integer
          format: int64
        margin_basis_points:
          type:
          - integer
          - 'null'
          format: int64
        cost_by_modality:
          type: array
          description: One bucket per modality, in the order OWN, EXTERNAL, ALLY_CAPACITY.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/ModalityCost'
        cod_expected_cents_total:
          type: integer
          minimum: 0
          format: int64
        cod_pending_reconciliation_cents_total:
          type: integer
          minimum: 0
          format: int64
        cod_pending_reconciliation_count:
          type: integer
          minimum: 0
          format: int32
        orders:
          type: array
          items:
            $ref: '#/components/schemas/RouteOrderFinancials'
    CreateSettlementRequest:
      type: object
      additionalProperties: false
      required:
      - driver_id
      - period_from
      - period_to
      properties:
        driver_id:
          type: string
          format: uuid
          description: Driver profile of the DRIVER payee; it must belong to the selected organization.
        period_from:
          type: string
          format: date
          description: First operational day of the period, inclusive.
        period_to:
          type: string
          format: date
          description: >-
            Last operational day of the period, inclusive. It is not before
            period_from and the period covers at most 366 days.
    AddSettlementAdjustmentRequest:
      type: object
      additionalProperties: false
      required:
      - amount_cents
      - reason
      properties:
        amount_cents:
          type: integer
          format: int64
          not:
            const: 0
          description: Signed, non-zero MXN cents added to the settlement total.
        reason:
          type: string
          description: >-
            Rationale kept as append-only audit evidence. Surrounding whitespace and control characters are rejected,
            never trimmed.
          minLength: 1
          maxLength: 500
          pattern: '^[^\s\x00-\x1F\x7F-\x9F](?:[^\x00-\x1F\x7F-\x9F]*[^\s\x00-\x1F\x7F-\x9F])?$'
    VoidSettlementRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          description: >-
            Rationale kept as append-only audit evidence. Surrounding whitespace and control characters are rejected,
            never trimmed.
          minLength: 1
          maxLength: 500
          pattern: '^[^\s\x00-\x1F\x7F-\x9F](?:[^\x00-\x1F\x7F-\x9F]*[^\s\x00-\x1F\x7F-\x9F])?$'
    SettlementLine:
