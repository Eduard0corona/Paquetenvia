  /onboarding/organizations:
    post:
      tags:
      - Onboarding
      operationId: createOnboardingOrganization
      description: >-
        REG-SELF-SERVICE-ORGANIZATION. An authenticated, active Paquetenvia user whose
        session carries email_verified=true (AUTH-EMAIL-VERIFIED-REQUIRED) creates its
        own organization. No X-Organization-Id: the caller may have no organization yet.
        BUSINESS is created ACTIVE and the creator becomes BUSINESS_ADMIN; ALLY is
        created PENDING_APPROVAL and the creator becomes ALLY_ADMIN of an organization
        that grants no access until a PLATFORM_ADMIN approves it (IDENTITY-ORG-ACTIVE-REQUIRED).
        REG-ONE-ORGANIZATION-PER-PERSON - a user has at most one self-created
        organization that is not CLOSED (PENDING_APPROVAL or ACTIVE, either type),
        enforced by the database under concurrency; a second one is 409
        ORGANIZATION_LIMIT_REACHED; a rejected ALLY is CLOSED and frees the slot;
        memberships an administrator adds are not creations and do not count.
        ONBOARDING-IDEMPOTENCY-DERIVED-ID - the organization id is derived from the
        user and the Idempotency-Key; repeating the key with the same request returns
        201 with the original organization, and with another request 409
        IDEMPOTENCY_CONFLICT. The organization, the creator membership and the
        ORGANIZATION_SELF_REGISTERED audit row are written in one transaction.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingOrganizationRequest'
      responses:
        '201':
          description: Created, or the original organization for a replayed Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            IDEMPOTENCY_CONFLICT for a reused key with another request;
            ORGANIZATION_LIMIT_REACHED when the caller already has a self-created
            organization that is not CLOSED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/organization-applications:
    get:
      tags:
      - Onboarding
      operationId: listMyOrganizationApplications
      description: >-
        REG-OWN-APPLICATIONS-ENDPOINT. Read-only list of the BUSINESS and ALLY
        organizations the caller administers (ACTIVE BUSINESS_ADMIN or ALLY_ADMIN
        membership), whatever the organization status, so a PENDING_APPROVAL or CLOSED
        ALLY is visible to its creator. It grants no access: /me/organization-contexts
        and every authorization check are unchanged. No X-Organization-Id.
