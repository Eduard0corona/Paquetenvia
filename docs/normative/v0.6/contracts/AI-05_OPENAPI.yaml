          description: The ALLY organization and its resulting status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllyDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          description: The ALLY is in a state this decision cannot change.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AllyDecisionConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organizations/{organizationId}/pending-memberships:
    post:
      tags:
      - Organizations
      operationId: addPendingMembership
      description: >-
        REG-JOIN-BY-ADMIN-EMAIL. An administrator of the organization selected with
        X-Organization-Id (which must equal organizationId) adds a person by email and
        role. REG-JOIN-ADDERS-MFA - PLATFORM_ADMIN, ALLY_ADMIN and BUSINESS_ADMIN members,
        each with a satisfied MFA challenge (403 MFA_REQUIRED when only the second factor
        is missing). REG-ROLE-CEILING - ALLY_ADMIN adds ALLY_ADMIN, ALLY_OPERATOR, DRIVER or
        VIEWER; BUSINESS_ADMIN adds BUSINESS_ADMIN, BUSINESS_OPERATOR or VIEWER; neither adds
        PLATFORM_ADMIN, DISPATCHER or FINANCE. REG-PLATFORM-ADMIN-ADDS - a PLATFORM_ADMIN
        member adds any role, PLATFORM_ADMIN only inside an organization of type PLATFORM.
        A role outside the ceiling is the uniform 403. REG-PENDING-MEMBERSHIP-STORAGE - the
        email is normalized (trim, NFC, invariant lowercase) and only its keyed HMAC and key
        version are stored; it is never returned. The answer is the same 202 whether or not
        the email belongs to an account: accounts are never looked at. REG-PENDING-RENEW-ONLY -
        adding an email and role that are already PENDING in this organization re-arms that
        entry for seven days and returns it. The entry id is derived from the actor, the
        organization and the Idempotency-Key; the same key with the same request returns the
        original entry, with another request 409 IDEMPOTENCY_CONFLICT. REG-PENDING-EXPIRY-7D -
        entries expire seven days after creation or renewal; expired entries stay inert. At
        every sign-in with a verified email each PENDING, unexpired entry of an ACTIVE
        organization becomes a membership of the ACTIVE user exactly once
        (REG-ACCEPT-ALL-ORGANIZATIONS). Audit PENDING_MEMBERSHIP_ADDED or
        PENDING_MEMBERSHIP_RENEWED; PENDING_MEMBERSHIP_ACCEPTED at sign-in. No notification
        is sent.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPendingMembershipRequest'
      responses:
        '202':
          description: The pending entry (new, re-armed or replayed); never reveals whether the email has an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: IDEMPOTENCY_CONFLICT for a reused key with another request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PendingMembershipConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Organizations
      operationId: listPendingMemberships
      description: >-
        REG-JOIN-BY-ADMIN-EMAIL. The organization's pending-membership entries, newest first,
        with role, status, created_at and expires_at; never an email or its hash. Same
        capability as addPendingMembership; rows are read under the tenant's RLS, so an
        organization sees only its own entries. An entry past expires_at that is still
        PENDING is expired and inert until renewed.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Pending-membership entries
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/PendingMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organizations/{organizationId}/pending-memberships/{pendingMembershipId}/renew:
    post:
      tags:
      - Organizations
      operationId: renewPendingMembership
      description: >-
        REG-PENDING-RENEW-ONLY. Re-arms a PENDING entry of the selected organization (expired
        or not) for seven days from now; nothing is sent to anyone. Same capability and role
        ceiling as addPendingMembership. The same Idempotency-Key replays without re-arming
        again. An ACCEPTED or REVOKED entry is 409 PENDING_MEMBERSHIP_NOT_PENDING; an entry
        of another organization is 404. Audit PENDING_MEMBERSHIP_RENEWED.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pendingMembershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The renewed entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          description: PENDING_MEMBERSHIP_NOT_PENDING when the entry is ACCEPTED or REVOKED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PendingMembershipConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organizations/{organizationId}/pending-memberships/{pendingMembershipId}/revoke:
    post:
      tags:
      - Organizations
      operationId: revokePendingMembership
      description: >-
        REG-JOIN-BY-ADMIN-EMAIL. Revokes a PENDING entry of the selected organization so no
        sign-in applies it. Same capability and role ceiling as addPendingMembership.
        Revoking a REVOKED entry returns it again without a new audit row; an ACCEPTED entry
        already became a membership and is 409 PENDING_MEMBERSHIP_NOT_PENDING; an entry of
        another organization is 404. Audit PENDING_MEMBERSHIP_REVOKED.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pendingMembershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The revoked entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          description: PENDING_MEMBERSHIP_NOT_PENDING when the entry is ACCEPTED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PendingMembershipConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    servers:
    - url: /
      description: >-
        AUTH-001 BFF surface (GATE-002-BFF-001). Served on the web origin, outside
        /api/v1; the pilot ingress routes /auth and /signin-authcenter to the API
        (PILOT-SAME-ORIGIN-ROUTING).
    get:
      tags:
      - Identity
      operationId: startAuthCenterSignIn
      description: >-
        Starts the AuthCenter authorization code flow with PKCE S256 (GATE-002-BFF-001).
        Anonymous. The redirect URI is always the configured public origin plus
        /signin-authcenter, never derived from Host or X-Forwarded-* headers. A
        return_url that is not a local absolute path falls back to "/". Registration is
        open (AUTH-OPEN-REGISTRATION, superseding AUTH-FIRST-LOGIN-INVITATION): the first
        sign-in of an unknown subject whose ID token asserts email_verified=true creates its
        Paquetenvia user, exactly once and with no memberships; sign-in never creates
        organizations or memberships (onboarding does, POST /onboarding/organizations).
        mfa=required starts an MFA step-up
        (AUTH-001-MFA-STEP-UP): the authorization request carries
        acr_values=urn:authcenter:acr:mfa and the callback accepts only an ID token
        whose acr is urn:authcenter:acr:mfa or urn:authcenter:acr:phr and whose amr
        contains mfa. Every successful sign-in replaces the browser's previous session
        (the previous ticket is deleted and a new opaque key is issued). Responses
        carry Cache-Control no-store.
      security: []
      parameters:
      - name: return_url
        in: query
        required: false
        description: Local absolute path only (same origin, no scheme or authority); anything else falls back to "/".
        schema:
          type: string
          maxLength: 2048
      - name: mfa
        in: query
        required: false
        description: >-
          Exactly "required" requests the MFA step-up (AUTH-001-MFA-STEP-UP); any other
          value is a normal sign-in. It never forces MFA on anyone who did not ask for it.
        schema:
          type: string
          enum:
          - required
      responses:
        '302':
          description: Redirect to the AuthCenter authorization endpoint; sets the __Host- correlation and nonce cookies.
  /signin-authcenter:
    servers:
    - url: /
      description: AUTH-001 BFF callback (GATE-002-BFF-001), outside /api/v1.
    get:
      tags:
      - Identity
      operationId: completeAuthCenterSignIn
      description: >-
        AuthCenter authorization response (response_mode=query). Validates state,
        the correlation and nonce cookies, the RFC 9207 iss parameter (required
        and ordinal-equal to the configured issuer), PKCE, and an RS256 ID token
        with exact issuer and audience. On success it stores the session ticket
        server-side and sets only an opaque session cookie (BFF-SESSION-STORE-POSTGRESQL).
        After state, correlation and iss validate, error=access_denied redirects to
        /login?error=access_denied (AUTH-001-ACCESS-DENIED-MESSAGE). A valid ID token
        without exactly one email_verified claim equal to true redirects to
        /login?error=email_not_verified without a session, and no user is created or
        linked (AUTH-EMAIL-VERIFIED-REQUIRED); email_verified is kept in the server-side
        ticket. Otherwise the first sign-in of an unknown subject registers its user once
        (AUTH-OPEN-REGISTRATION, security.register_identity_subject). Every other failure
        redirects to the generic /login?error=signin_failed. No protocol detail
        (error_description) is forwarded.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: iss
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: >-
            Success redirects to the validated return_url and sets __Host-Paquetenvia.Session
            (Secure, HttpOnly, SameSite=Lax, Path=/, no Domain, session lifetime);
            access_denied redirects to /login?error=access_denied, an unverified email to
            /login?error=email_not_verified and any other failure to
            /login?error=signin_failed, all without a session.
  /auth/session:
    servers:
    - url: /
      description: AUTH-001 BFF surface (GATE-002-BFF-001), outside /api/v1.
    get:
      tags:
      - Identity
      operationId: getBffSession
      description: >-
        Returns the current BFF session and its CSRF token. Paquetenvia authorization
        is re-resolved from identity_subject on every request; AuthCenter roles and
        permissions are ignored. A present Origin header must equal the public web
        origin. Responses carry Cache-Control no-store.
      security:
      - bffSession: []
      parameters: []
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BffSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    servers:
    - url: /
      description: AUTH-001 BFF surface (GATE-002-BFF-001), outside /api/v1.
    post:
      tags:
      - Identity
      operationId: endBffSession
      description: >-
        Revokes the AuthCenter refresh token (best effort) and always deletes the
        server-side session and its cookie, even when AuthCenter discovery is
        unavailable. Requires the session cookie, the session-bound X-AuthCenter-CSRF
        header and, when present, an Origin equal to the public web origin; otherwise
        the request is unauthenticated (401) and the session is kept.
        AUTH-001-RP-INITIATED-LOGOUT: the response carries the AuthCenter
        end-session URL (discovery end_session_endpoint, HTTPS on the configured
        authority) with id_token_hint and post_logout_redirect_uri=<public origin>/login;
        the web navigates to it with window.location.assign so AuthCenter ends its
        single sign-on session. It is null when the session has no ID token or the
        endpoint is missing or invalid; the web then goes to /login. Responses carry
        Cache-Control no-store.
      security:
      - bffSession: []
      parameters:
      - $ref: '#/components/parameters/BffCsrfToken'
      responses:
        '200':
          description: Local session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BffLogoutResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/backchannel-logout:
    servers:
    - url: /
      description: >-
        AUTH-001 BFF surface (GATE-002-BFF-001), outside /api/v1. Called
        server-to-server by AuthCenter; the pilot ingress routes /auth to the API
        (PILOT-SAME-ORIGIN-ROUTING) and must accept a POST without Origin.
    post:
      tags:
      - Identity
      operationId: receiveAuthCenterBackchannelLogout
      description: >-
        OpenID Connect Back-Channel Logout 1.0 receiver (AUTH-001-BACKCHANNEL-LOGOUT).
        Anonymous: no session cookie, no CSRF header and no Origin are required or
        used. The logout_token must be an RS256 JWT with header typ logout+jwt signed
        by a key from AuthCenter discovery, with the exact configured issuer, aud equal
        to the client id, a valid lifetime (30 s clock skew) and a recent iat, the
        http://schemas.openid.net/event/backchannel-logout member in events, no nonce,
        an unseen jti (kept until exp + 5 minutes) and a sid or sub. A valid token ends
        every BFF session created from that AuthCenter sid, or, with only sub, every
        session of that subject signed in before the token was processed; the sessions
        are rejected on their next request. Responses carry Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              required:
              - logout_token
              properties:
                logout_token:
                  type: string
                  minLength: 1
                  maxLength: 16384
      responses:
        '200':
          description: Logout token accepted; the matching sessions are ended.
        '400':
          description: Missing, malformed, invalid or replayed logout token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackchannelLogoutError'
  /cities:
    get:
      tags:
      - Locations
      operationId: listCities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
