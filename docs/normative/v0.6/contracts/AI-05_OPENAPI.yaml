      type: object
      description: >-
        AUTH-001 BFF session view (GATE-002-BFF-001). Property names follow the
        AuthCenter.Client BFF contract. authorized is false for an authenticated
        subject without an active Paquetenvia identity (suspended or disabled). A
        newly registered user is authorized with no organization contexts until it
        completes onboarding (AUTH-OPEN-REGISTRATION).
      additionalProperties: false
      required:
      - authenticated
      - authorized
      - mfa
      - csrfToken
      - sessionNamespace
      - user
