        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/FinanceConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements:
    post:
      tags:
      - Finance
      operationId: createSettlement
      description: >-
        SET-001 calculates one DRIVER settlement for a period of whole
        operational days and persists it CALCULATED in one transaction: an
        empty DRAFT header, one immutable line per eligible economic source,
        the exact bigint total, the DRAFT to CALCULATED step, the audit entry
        and the idempotency record. period_from and period_to are calendar
        dates of the configured Finance operational time zone (IANA,
        America/Mazatlan by default); the period starts at the beginning of
        period_from inclusive and ends at the beginning of the day after
        period_to exclusive, both converted to UTC. The economic sources are
        the driver's OWN and EXTERNAL dispatch assignments that bear cost
        exactly as FIN-001 counts it (ACCEPTED, ACTIVE or COMPLETED, amount
        cost_cents) whose order's latest ORD-002 DELIVERED or RETURNED status
        event occurred inside the period while the current order status still
        proves that outcome: DELIVERY for DELIVERED, CLOSED, CLAIM_OPEN or
        CLAIM_RESOLVED orders and RETURN for RETURNED orders, ordered by that
        event time. Every such line names its source as
        dispatch.assignments/{assignmentId}, the one economic identity DELIVERY
        and RETURN share. A source already held by a settlement that is not
        VOID is never included again, so a period without new sources yields
        an empty settlement with total 0. ALLY_CAPACITY work, ALLY and BUSINESS
        payees stay reserved. Only FINANCE members and PLATFORM_ADMIN members
        with a satisfied MFA challenge may operate settlements; DISPATCHER,
        DRIVER and VIEWER never may. Capability is evaluated before the
        idempotency lock, replay evidence or driver visibility, and a missing
        driver and another tenant's driver are the same uniform 404. Replaying
        the same Idempotency-Key with the same request returns the stored
        response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - driver_profile
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementRequest'
      responses:
        '201':
          description: Settlement calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}:
    get:
      tags:
      - Finance
      operationId: getSettlement
      description: >-
        SET-001 persisted settlement header and its immutable lines, ordered by
        created_at then id. Amounts are returned exactly as stored and never
        recomputed; a header whose total does not equal the exact sum of its
        lines is never shown and the read fails closed as 503. Same capability
        as every settlement operation. A missing settlement and another
        tenant's settlement are the same uniform 404.
      x-authorization-precedence: capability-before-persisted-state
      x-capability-protected-state:
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/adjustments:
    post:
      tags:
      - Finance
      operationId: addSettlementAdjustment
      description: >-
        SET-001 appends one signed ADJUSTMENT line to a CALCULATED settlement
        and moves its total by exact checked bigint arithmetic; existing lines
        are never changed or replaced. The line references no order and names
        its source as platform.audit_logs/{auditId}, the append-only audit
        entry written in the same transaction, which keeps the reason. Any
        other settlement status is SETTLEMENT_STATE_CONFLICT, and an amount
        whose application would leave the bigint range is INVALID_REQUEST.
        Replaying the same Idempotency-Key with the same request returns the
        stored response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSettlementAdjustmentRequest'
      responses:
        '201':
          description: Adjustment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/approve:
    post:
      tags:
      - Finance
      operationId: approveSettlement
      description: >-
        SET-001 approves a CALCULATED settlement, which freezes its total and
        its lines. Inside the approving transaction, after the settlement row
        lock, the current state of every included order is re-read: a
        DELIVERY whose order expects cash on delivery requires that cash
        RECONCILED for the exact expected amount (CASH_PENDING), an OPEN or
        INVESTIGATING incident on any included order blocks (INCIDENT_PENDING)
        and an included order in CLAIM_OPEN blocks (CLAIM_PENDING); RESOLVED
        and REJECTED incidents never block. A RETURN is never blocked by its
        order's COD expectation, because a returned order collected no cash.
        When several apply, the first of cash, incident and claim is reported.
        Any other settlement status is SETTLEMENT_STATE_CONFLICT. Replaying the
        same Idempotency-Key returns the stored response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Settlement approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/pay:
    post:
      tags:
      - Finance
      operationId: markSettlementPaid
      description: >-
        SET-001 records that the external payment of an APPROVED settlement has
        been completed and moves it to PAID, which is terminal. No payment
        provider, bank transfer, invoice, tax or accounting workflow is
        involved. Any other settlement status is SETTLEMENT_STATE_CONFLICT.
        Replaying the same Idempotency-Key returns the stored response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Settlement marked paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/void:
    post:
      tags:
      - Finance
      operationId: voidSettlement
      description: >-
        SET-001 voids a DRAFT, CALCULATED or APPROVED settlement. Every line and
        the total are kept exactly as they are; VOID only releases the
        settlement's economic sources for a later settlement. PAID and VOID are
        terminal and answer SETTLEMENT_STATE_CONFLICT. The reason is kept only
        as append-only audit evidence. Replaying the same Idempotency-Key with
        the same request returns the stored response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidSettlementRequest'
      responses:
        '200':
          description: Settlement voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/export.csv:
    get:
      tags:
      - Finance
      operationId: exportSettlementCsv
      description: >-
        SET-001 CSV export generated only from the persisted settlement and its
        persisted lines, never recalculated from assignments or orders, with
        the same capability as getSettlement. RFC 4180 records ending in CRLF,
        UTF-8 without a byte order mark, and exactly this header:
        settlement_id,payee_type,payee_id,period_from,period_to,settlement_status,settlement_total_cents,line_id,line_type,order_id,amount_cents,source_reference,line_created_at.
        One record per line, ordered by created_at then id, each repeating its
        settlement columns, so amount_cents sums to settlement_total_cents.
        Money is integer cents, dates are yyyy-MM-dd, line_created_at is UTC
        with microsecond precision, and an ADJUSTMENT has an empty order_id. No
        column carries personal data or free text. A header whose total does not
        equal the exact sum of its lines is never exported and the export fails
        closed as 503.
      x-authorization-precedence: capability-before-persisted-state
      x-capability-protected-state:
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement CSV, served as attachment settlement-{settlementId}.csv
          headers:
            Content-Disposition:
              description: attachment with filename settlement-{settlementId}.csv
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteStopId:
      name: stopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationContext:
      name: X-Organization-Id
      in: header
      required: true
      description: Organización activa; debe corresponder a una membresía ACTIVE del usuario.
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State, idempotency or concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RoutingConflict:
      description: >-
        RTE-001 stale version, duplicate route membership, active-route
        conflict, route or assignment state conflict, driver/order
        incompatibility, eligibility/capacity rejection or idempotency mismatch.
        Internal evidence and cross-tenant existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DispatchAssignmentConflict:
      description: >-
        DSP-002 request, idempotency, state, concurrency, eligibility, capacity
        or replay-evidence conflict. Internal rejection evidence and PII are
        never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DispatchAssignmentConflictProblem'
    CsvImportConflict:
      description: >-
        CSV-001 upload rejected, or the batch Idempotency-Key is already bound to
        different content. Transport-level rejections report the uniform CONFLICT;
        only a reused batch key is named, as IDEMPOTENCY_CONFLICT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CsvImportConflictProblem'
    IncidentConflict:
      description: >-
        INC-001 request, idempotency, order-state, incident-state or evidence
        conflict. Internal rejection evidence, the current incident status and
        cross-tenant existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/IncidentConflictProblem'
    FinanceConflict:
      description: >-
        FIN-001 request-shape, idempotency, replay-evidence, concurrency, COD
        lifecycle or order-state conflict, identified by a stable code.
        Internal evidence is never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FinanceConflictProblem'
    SettlementConflict:
      description: >-
        SET-001 request-shape, idempotency, replay-evidence, concurrency,
        settlement-state or pending-source conflict, identified by a stable
        code. The current settlement status, source evidence and cross-tenant
        existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SettlementConflictProblem'
    NotFound:
      description: Not found or inaccessible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks capability inside an otherwise visible tenant context
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UniformNotFound:
      description: Missing, cross-tenant, expired or revoked resource. Response must not reveal existence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DriverLocationInvalidRequest:
      description: Structurally invalid driver location batch. The stable problem code is INVALID_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DriverLocationInvalidRequestProblem'
    TooManyRequests:
      description: Request rejected by rate limiting
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required provider or infrastructure dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required:
      - currency
      - amount_cents
      properties:
        currency:
          type: string
          const: MXN
        amount_cents:
          type: integer
          minimum: 0
          format: int64
    OrderStatus:
      type: string
      enum:
      - DRAFT
      - CONFIRMED
      - READY_FOR_PICKUP
      - ASSIGNED
      - AT_PICKUP
      - PICKED_UP
      - IN_TRANSIT
      - DELIVERING
      - FAILED_ATTEMPT
      - RESCHEDULED
      - RETURNING
      - RETURNED
      - DELIVERED
      - CLOSED
      - CLAIM_OPEN
      - CLAIM_RESOLVED
      - CANCELLED
    AddressInput:
      type: object
      required:
      - address_text
      - contact_name
      - phone
      properties:
        address_text:
          type: string
          minLength: 8
        contact_name:
          type: string
        phone:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        references:
          type: string
          maxLength: 500
    CreateQuoteRequest:
      type: object
      required:
      - origin
      - destination
      - service_type
      - packages
      properties:
        client_account_id:
          type: string
          format: uuid
        origin:
          $ref: '#/components/schemas/AddressInput'
        destination:
          $ref: '#/components/schemas/AddressInput'
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        consolidated_route:
          type: boolean
          default: false
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PackageInput'
      description: Owner organization is derived from X-Organization-Id after membership validation.
    PackageInput:
      type: object
      required:
      - description
      - weight_grams
      - declared_value_cents
      properties:
        description:
          type: string
          maxLength: 250
        weight_grams:
          type: integer
          minimum: 1
        declared_value_cents:
          type: integer
          minimum: 0
          format: int64
        length_mm:
          type: integer
          minimum: 1
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
    Quote:
      type: object
      required:
      - id
      - net
      - tax
      - total
      - rule_ids
      - expires_at
      - origin_location_id
      - destination_location_id
      - service_type
      - consolidated_route
      - package_snapshot
      - pricing_tier
      - minimum_total_cents_snapshot
      - pricing_policy_version
      - status
      - city_id
      properties:
        id:
          type: string
          format: uuid
        net:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        rule_ids:
          type: array
          items:
            type: string
            format: uuid
        breakdown:
          type: array
          items:
            type: object
            additionalProperties: true
        expires_at:
          type: string
          format: date-time
        origin_location_id:
          type: string
          format: uuid
        destination_location_id:
          type: string
          format: uuid
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        consolidated_route:
          type: boolean
        package_snapshot:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PackageInput'
        city_id:
          type: string
          format: uuid
        service_area_id:
          type:
          - string
          - 'null'
          format: uuid
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        minimum_total_cents_snapshot:
          type: integer
          minimum: 0
          format: int64
        pricing_policy_version:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - USED
          - EXPIRED
          - REVOKED
        request_snapshot_redacted:
          type: object
          additionalProperties: true
          description: Must not contain plaintext address, contact name, telephone or access notes.
    CreateOrderRequest:
      type: object
      required:
      - quote_id
      - payer_type
      - acceptance
      properties:
        quote_id:
          type: string
          format: uuid
        payer_type:
          type: string
          enum:
          - SENDER
          - RECIPIENT
          - BUSINESS_ACCOUNT
        acceptance:
          type: object
          required:
          - terms_version
          - privacy_version
          - accepted_at
          - acceptance_channel
          properties:
            terms_version:
              type: string
            privacy_version:
              type: string
            accepted_at:
              type: string
              format: date-time
              description: Client-observed acceptance timestamp; persisted as accepted_at_client after UTC normalization.
            acceptance_channel:
              type: string
              enum:
              - WEB
              - PWA
              - ASSISTED
              - API
    Order:
      type: object
      required:
      - id
      - public_id
      - owner_org_id
      - status
      - price_net
      - version
      - origin_location_id
      - destination_location_id
      - service_type
      - pricing_tier
      - total
      - city_id
      properties:
        id:
          type: string
          format: uuid
        public_id:
          type: string
        owner_org_id:
          type: string
          format: uuid
        operator_org_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        price_net:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1
        origin_location_id:
          type: string
          format: uuid
        destination_location_id:
          type: string
          format: uuid
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        quote_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        service_area_id:
          type:
          - string
          - 'null'
          format: uuid
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        total:
          $ref: '#/components/schemas/Money'
        claim_window_ends_at:
          type:
          - string
          - 'null'
          format: date-time
        finalized_at:
          type:
          - string
          - 'null'
          format: date-time
    OrderDetail:
      allOf:
      - $ref: '#/components/schemas/Order'
      - type: object
        properties:
          timeline:
            type: array
            items:
              $ref: '#/components/schemas/OrderEvent'
    TransitionRequest:
      type: object
      required:
      - target_status
      - reason
      - expected_version
      properties:
        target_status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          maxLength: 500
        expected_version:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - driver_id
      - assignment_type
      - cost_cents
      properties:
        driver_id:
          type: string
          format: uuid
        assignment_type:
          type: string
          description: >-
            Global assignment vocabulary. DSP-002 enables only OWN. EXTERNAL is
            reserved for EXT-001 and ALLY_CAPACITY for ALY-004; either reserved
            value produces a DSP-002 conflict until its owning capability is
            implemented.
          enum:
          - OWN
          - EXTERNAL
          - ALLY_CAPACITY
          x-dsp-002-enabled-values:
          - OWN
          x-reserved-for:
            EXTERNAL: EXT-001
            ALLY_CAPACITY: ALY-004
        cost_cents:
          type: integer
          minimum: 0
          format: int64
        route_id:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            Optional global route reference. DSP-002 assignment creation accepts
            only omission or null. RTE-001 links an existing OWN ACCEPTED or
            ACTIVE assignment exclusively through POST /routes/{routeId}/stops;
            this field is not an alternate Routing command. Once linked,
            route_id may be non-null only when the route belongs to the active
            tenant, is DRAFT, has the same driver, the order remains compatible,
            and no other active route association exists. EXTERNAL and
            ALLY_CAPACITY routing remain disabled.
          x-dsp-002-support: omitted-or-null-only
          x-rte-001-link-authority: POST /routes/{routeId}/stops
    Assignment:
      type: object
      required:
      - id
      - order_id
      - driver_id
      - route_id
      - status
      - cost
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        route_id:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            RTE-001 may populate this only for an OWN assignment linked
            atomically through the authoritative route-stop mutation.
        status:
          type: string
          enum:
          - OFFERED
          - ACCEPTED
          - ACTIVE
          - COMPLETED
          - CANCELLED
        cost:
          $ref: '#/components/schemas/Money'
    CreateOfferRequest:
      type: object
      required:
      - order_id
      - commission_cents
      - expires_at
      properties:
        order_id:
          type: string
          format: uuid
        commission_cents:
          type: integer
          minimum: 0
          format: int64
        expires_at:
          type: string
          format: date-time
        eligible_constraints:
          $ref: '#/components/schemas/EligibleConstraints'
    ExternalOffer:
      type: object
      required:
      - id
      - order_id
      - status
      - commission
      - expires_at
      - version
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          - EXPIRED
          - CANCELLED
        commission:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
        accepted_by_driver_id:
          type:
          - string
          - 'null'
          format: uuid
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
    ExternalOfferPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalOffer'
        next_cursor:
          type:
          - string
          - 'null'
    DriverStop:
      type: object
      required:
      - order_id
      - aggregate_version
      - order_public_id
      - stop_type
      - status
      - address_summary
      properties:
        order_id:
          type: string
          format: uuid
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        order_public_id:
          type: string
        stop_type:
          type: string
          enum:
          - PICKUP
          - DELIVERY
          - RETURN
        status:
          type: string
        address_summary:
          type: string
        contact_token:
          type: string
          description: Protected relay token; never a raw telephone number.
    Proof:
      type: object
      required:
      - id
      - proof_type
      - sha256
      - captured_at
      properties:
        id:
          type: string
          format: uuid
        proof_type:
          type: string
        sha256:
          type: string
        captured_at:
          type: string
          format: date-time
    OpenIncidentRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - severity
      - description
      - reason_code
      - next_action
      - occurred_at
      - evidence_proof_ids
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z_]+$
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        description:
          type: string
          minLength: 1
          maxLength: 2000
        reason_code:
          type: string
          enum:
          - RECIPIENT_ABSENT
          - ADDRESS_NOT_FOUND
          - RECIPIENT_REFUSED
          - ACCESS_RESTRICTED
          - PAYMENT_UNAVAILABLE
          - PACKAGE_DAMAGED
          - SECURITY_RISK
        next_action:
          type: string
          enum:
          - RESCHEDULED
          - RETURNING
        occurred_at:
          type: string
          format: date-time
        evidence_proof_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    ResolveIncidentRequest:
      type: object
      additionalProperties: false
      required:
      - outcome
      - reason
      properties:
        outcome:
          type: string
          enum:
          - RESOLVED
          - REJECTED
        reason:
          type: string
          description: >-
            Operator rationale kept as append-only audit evidence. Surrounding
            whitespace and control characters are rejected, never trimmed.
          minLength: 1
          maxLength: 500
          pattern: '^[^\s\x00-\x1F\x7F-\x9F](?:[^\x00-\x1F\x7F-\x9F]*[^\s\x00-\x1F\x7F-\x9F])?$'
    Incident:
      type: object
      required:
      - id
      - order_id
      - status
      - severity
      - reason_code
      - next_action
      - custody_acquired
      - occurred_at
      - sla_due_at
      - evidence_proof_ids
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
          - REJECTED
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        reason_code:
          type: string
          enum:
          - RECIPIENT_ABSENT
          - ADDRESS_NOT_FOUND
          - RECIPIENT_REFUSED
          - ACCESS_RESTRICTED
          - PAYMENT_UNAVAILABLE
          - PACKAGE_DAMAGED
          - SECURITY_RISK
        next_action:
          type: string
          enum:
          - RESCHEDULED
          - RETURNING
        custody_acquired:
          type: boolean
        occurred_at:
          type: string
          format: date-time
        sla_due_at:
          type: string
          format: date-time
        evidence_proof_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    PublicTracking:
      type: object
      required:
      - public_id
      - visible_status
      - timeline
      properties:
        public_id:
          type: string
        visible_status:
          type: string
        estimated_window:
          type:
          - string
          - 'null'
        timeline:
          type: array
          items:
            type: object
            required:
            - status
            - occurred_at
            properties:
              status:
                type: string
              occurred_at:
                type: string
                format: date-time
    OrderEvent:
      type: object
      required:
      - event_type
      - occurred_at
      properties:
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    DriverLocationInvalidRequestProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: INVALID_REQUEST
    DispatchAssignmentConflictProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - CONFLICT
          - DRIVER_INELIGIBLE
          - DRIVER_DOCUMENT_EXPIRED
    CsvImportPreviewRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: UTF-8 CSV-001 document, at most 1 MiB and 500 data rows.
    CsvImportCommitRequest:
      type: object
      required:
      - file
      - content_digest
      properties:
        file:
          type: string
          format: binary
          description: The same bytes that were previewed; anything else is a conflict.
        content_digest:
          type: string
          description: Base64url SHA-256 of the file, as returned by the preview.
    CsvImportRowError:
      type: object
      required:
      - column
      - code
      properties:
        column:
          type: string
        code:
          type: string
          enum:
          - COLUMN_COUNT_INVALID
          - QUOTE_ID_INVALID
          - QUOTE_ID_DUPLICATED
          - PAYER_TYPE_INVALID
          - TERMS_VERSION_INVALID
          - PRIVACY_VERSION_INVALID
          - ACCEPTED_AT_INVALID
          - ACCEPTANCE_CHANNEL_INVALID
    CsvImportRowPreview:
      type: object
      required:
      - row_number
      - quote_id
      - payer_type
      - valid
      - errors
      properties:
        row_number:
          type: integer
          minimum: 1
          description: Physical CSV line, so the header is line one.
        quote_id:
          type:
          - string
          - 'null'
          format: uuid
        payer_type:
          type:
          - string
          - 'null'
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CsvImportRowError'
    CsvImportPreview:
      type: object
      required:
      - content_digest
      - total_rows
      - valid_rows
      - invalid_rows
      - file_errors
      - rows
      properties:
        content_digest:
          type: string
        total_rows:
          type: integer
          minimum: 0
        valid_rows:
          type: integer
          minimum: 0
        invalid_rows:
          type: integer
          minimum: 0
        file_errors:
          type: array
          description: File-level rejections; when present the file has no reportable rows.
          items:
            type: string
            enum:
            - ENCODING_INVALID
            - MALFORMED_QUOTING
            - HEADER_INVALID
            - FILE_EMPTY
            - ROW_LIMIT_EXCEEDED
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CsvImportRowPreview'
    CsvImportRowOutcome:
      type: object
      required:
      - row_number
      - quote_id
      - status
      - order_id
      - public_id
      - error_code
      properties:
        row_number:
          type: integer
          minimum: 1
        quote_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - FAILED
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        public_id:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
          description: QUOTE_UNAVAILABLE, IDEMPOTENCY_CONFLICT or INVALID_REQUEST when the row failed.
    CsvImportCommit:
      type: object
      required:
      - content_digest
      - total_rows
      - created_rows
      - failed_rows
      - rows
      properties:
        content_digest:
          type: string
        total_rows:
          type: integer
          minimum: 0
        created_rows:
          type: integer
          minimum: 0
        failed_rows:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CsvImportRowOutcome'
    CsvImportConflictProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - CONFLICT
          - IDEMPOTENCY_CONFLICT
    IncidentConflictProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - IDEMPOTENCY_CONFLICT
          - ORDER_STATE_NOT_ALLOWED
          - EVIDENCE_NOT_AVAILABLE
          - INCIDENT_STATE_CONFLICT
          - CONFLICT
    FinanceConflictProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >-
            CONFLICT covers Idempotency-Key reuse with a different payload,
            inconsistent replay evidence and concurrency conflicts.
          enum:
          - INVALID_REQUEST
          - CONFLICT
          - COD_NOT_EXPECTED
          - COD_AMOUNT_MISMATCH
          - COD_ALREADY_RECORDED
          - COD_STATE_CONFLICT
          - ORDER_STATE_CONFLICT
    SettlementConflictProblem:
      type: object
