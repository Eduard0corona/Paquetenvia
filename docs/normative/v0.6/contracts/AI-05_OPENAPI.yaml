openapi: 3.1.0
info:
  title: Paquetería Local Culiacán API
  version: 0.6.0
  description: Contrato REST normativo v0.6. REST/PostgreSQL son autoridad; SignalR distribuye eventos confirmados. Seguridad
    tenant, tracking público y outbox siguen contratos ejecutables.
servers:
- url: /api/v1
security:
- oidc: []
tags:
- name: Quotes
- name: Orders
- name: Dispatch
- name: Routing
- name: Driver
- name: Tracking
- name: Proofs
- name: Incidents
- name: Organizations
- name: Audit
- name: Identity
- name: Locations
- name: Drivers
- name: Finance
- name: Custody
paths:
  /quotes:
    post:
      tags:
      - Quotes
      operationId: createQuote
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Orders
      operationId: listOrders
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: owner_org_id
        in: query
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Tenant-filtered orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/csv/preview:
    post:
      tags:
      - Orders
      operationId: previewOrderCsv
      description: >-
        CSV-001 prevalidation. Reads the uploaded file, reports it row by row and
        creates nothing; the returned content_digest is what commit must echo.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvImportPreviewRequest'
      responses:
        '200':
          description: Prevalidation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportPreview'
        '409':
          $ref: '#/components/responses/CsvImportConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/csv/commit:
    post:
      tags:
      - Orders
      operationId: commitOrderCsv
      description: >-
        CSV-001 confirmation. Accepts only the file whose content_digest matches the
        previewed one and whose every row prevalidates, then creates each row through
        the ORD-001 create path. Idempotency-Key names the batch: replaying it returns
        the first response, and reusing it for other content is IDEMPOTENCY_CONFLICT.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvImportCommitRequest'
      responses:
        '200':
          description: Batch committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportCommit'
        '422':
          description: The batch was not committed because at least one row failed prevalidation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportPreview'
        '409':
          $ref: '#/components/responses/CsvImportConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{orderId}:
    get:
      tags:
      - Orders
      operationId: getOrder
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/{orderId}/transitions:
    post:
      tags:
      - Orders
      operationId: transitionOrder
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/{orderId}/assignments:
    post:
      tags:
      - Dispatch
      operationId: assignDriver
      description: >-
        DSP-002 creates only OWN assignments. EXTERNAL and ALLY_CAPACITY remain
        reserved vocabulary and are rejected until their owning backlog items
        are implemented. This operation continues to accept route_id only when
        omitted or null. RTE-001 links an existing OWN assignment through
        POST /routes/{routeId}/stops; route_id is not an alternate Routing
        command on assignment creation. Pure request-shape validation
        may return 409 INVALID_REQUEST before capability evaluation and never
        opens the productive transaction or reads persisted state. For every
        structurally valid request, current tenant-aware capability is read
        before the idempotency advisory lock, idempotency record, replay
        evidence or resource visibility. An actor without the global Dispatch
        capability therefore receives 403 independently of idempotency state.
        Authorized actors use the same structural PostgreSQL visibility plan
        for missing or cross-tenant order/driver and receive the uniform 404.
        This guarantee uses stable data access, never artificial delays.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - order_packages
      - driver_profile_documents
      x-authorized-visibility-plan:
      - order_packages
      - driver_profile_documents
      x-non-enumeration: structural-postgresql-no-artificial-delay
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/DispatchAssignmentConflict'
  /routes:
    post:
      tags:
      - Routing
      operationId: createRoute
      description: >-
        Creates a tenant-owned manual route for an OWN, ACTIVE driver who is
        currently eligible under DSP-001 in the active OrganizationContext.
        City and optional service area must be coherent with that driver. The
        route starts DRAFT at version 1. Every successful mutation is audited
        and emits RouteChanged only through the transactional outbox after
        commit. Reusing the same Idempotency-Key and canonical request returns
        the stored 201 without creating another route; an idempotency mismatch
        returns 409. EXTERNAL and ALLY_CAPACITY routing are not enabled by
        RTE-001.
      x-required-capability: Dispatch
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: DRAFT route created at version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/RoutingConflict'
    get:
      tags:
      - Routing
      operationId: listRoutes
      description: >-
        Returns only routes visible in the active OrganizationContext. The
        server owns the bounded page size; clients cannot configure it. Access
        follows the existing Operations read capability.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RouteStatus'
      - name: driver_id
        in: query
        schema:
          type: string
          format: uuid
      - name: scheduled_for
        in: query
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Cursor-paginated tenant routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /routes/{routeId}:
    get:
      tags:
      - Routing
      operationId: getRoute
      description: >-
        Returns the authoritative route and every current stop ordered by
        sequence ascending. Clients reconstruct state from this resource on
        load, refresh, reconnect and after RouteChanged. Access follows the
        existing Operations read capability.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: Authoritative route detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
  /routes/{routeId}/stops:
    post:
      tags:
      - Routing
      operationId: addRouteStop
      description: >-
        Adds one DELIVERY stop to a DRAFT route and links the existing OWN
        ACCEPTED or ACTIVE assignment for an order visible in the active tenant
        to that route in the same transaction.
        The route driver must be OWN and ACTIVE; assignment.driver_id must equal
        route.driver_id; the order and driver must remain compatible under
        DSP-001. A stable PostgreSQL serialization decision by order_id prevents
        duplicates and membership in another DRAFT, PLANNED or ACTIVE route.
        The inserted sequence is the next contiguous integer and route.version
        increments exactly once. Audit and RouteChanged outbox records commit
        atomically. The client cannot supply stop_type. Reusing the same
        Idempotency-Key and canonical request returns the stored success without
        another mutation; a different request for the key returns 409.
      x-required-capability: Dispatch
      x-rte-001-assignment-types:
      - OWN
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRouteStopRequest'
      responses:
        '201':
          description: Stop and assignment route link created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/RoutingConflict'
  /routes/{routeId}/stops/{stopId}:
    delete:
      tags:
      - Routing
      operationId: removeRouteStop
      description: >-
        Removes a stop only from a DRAFT route after checking expected_version.
        In one transaction it clears route_id only on the linked assignment,
        compacts the remaining sequence to 1..N, increments route.version once,
        and writes audit plus RouteChanged outbox evidence. Reusing the same
        Idempotency-Key and canonical request is safe and returns the stored
        success; an idempotency mismatch returns 409.
      x-required-capability: Dispatch
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/RouteStopId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Updated route after atomic stop removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/RoutingConflict'
  /routes/{routeId}/stops/order:
    put:
      tags:
      - Routing
      operationId: reorderRouteStops
      description: >-
        Reorders a DRAFT route under a route lock. stop_ids must contain every
        current stop exactly once, with no duplicate, foreign or missing ID.
        The server writes contiguous sequence values 1..N and increments the
        route version exactly once in the same transaction as audit and the
        RouteChanged outbox record. A stale expected_version returns 409. Of two
        concurrent reorders using the same version exactly one succeeds and the
        other receives 409. Idempotent replay returns the stored success without
        another version increment.
      x-required-capability: Dispatch
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRouteStopsRequest'
      responses:
        '200':
          description: Route stops reordered atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/RoutingConflict'
  /external-offers:
    post:
      tags:
      - Dispatch
      operationId: createExternalOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Offer opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
  /external-offers/{offerId}/accept:
    post:
      tags:
      - Driver
      operationId: acceptExternalOffer
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/me/external-offers:
    get:
      tags:
      - Driver
      operationId: listMyEligibleExternalOffers
      description: >-
        Returns only offers that belong to the active tenant, are OPEN, have
        not expired and remain eligible for the authenticated driver at read
        time. The authenticated driver is derived from the access token; this
        operation accepts no driver_id. REST/PostgreSQL are authoritative on
        initial load, refresh and reconnect. ExternalOfferChanged only
        notifies the client to refetch this resource.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Eligible external offers for the authenticated driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOfferPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/me/stops:
    get:
      tags:
      - Driver
      operationId: listMyStops
      responses:
        '200':
          description: Active assigned stops only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverStop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
  /orders/{orderId}/proofs:
    post:
      tags:
      - Custody
      operationId: finalizeProof
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeProofRequest'
      responses:
        '201':
          description: Proof finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proof'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
  /orders/{orderId}/incidents:
    post:
      tags:
      - Incidents
      operationId: openIncident
      x-shape-validation: invalid-request-without-productive-transaction
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenIncidentRequest'
      responses:
        '201':
          description: Incident opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /incidents/{incidentId}/resolution:
    post:
      tags:
      - Incidents
      operationId: resolveIncident
      description: >-
        INC-001 closes an OPEN or INVESTIGATING incident into exactly one terminal
        outcome, RESOLVED or REJECTED, and records resolved_at. Only DISPATCHER
        members and PLATFORM_ADMIN members with a satisfied MFA challenge may
        resolve; a DRIVER never may, including the driver who opened the incident.
        Capability is evaluated before incident visibility, the idempotency lock or
        replay evidence. A missing incident and another tenant's incident are the
        same uniform 404. A terminal incident is never changed again. Resolution
        never changes the order: ORD-002 remains the only writer of order state.
        The reason is kept only as append-only audit evidence. Replaying the same
        Idempotency-Key with the same request returns the stored response.
      x-authorization-precedence: shape-validation-then-capability-before-persisted-state
      x-shape-validation: invalid-request-without-productive-transaction
      x-capability-protected-state:
      - idempotency_lock
      - idempotency_record
      - replay_evidence
      - incident
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIncidentRequest'
      responses:
        '200':
          description: Incident resolved or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /tracking/{token}:
    get:
      tags:
      - Tracking
      security: []
      operationId: publicTracking
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 32
      responses:
        '200':
          description: Minimal public tracking view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrackingProjection'
        '404':
          $ref: '#/components/responses/UniformNotFound'
  /organizations/{organizationId}/audit:
    get:
      tags:
      - Audit
      operationId: listAudit
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/me/location-updates:
    post:
      tags:
      - Driver
      operationId: publishDriverLocation
      description: Persists deduplicated driver telemetry. SignalR is server-push only; this endpoint is authoritative ingestion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationBatchRequest'
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocationBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/DriverLocationInvalidRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
  /quotes/{quoteId}:
    get:
      tags:
      - Pricing
      operationId: getQuote
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: quoteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
