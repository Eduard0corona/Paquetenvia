          description: Order unit economics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFinancials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/FinanceConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /routes/{routeId}/financials:
    get:
      tags:
      - Finance
      operationId: getRouteFinancials
      description: >-
        FIN-001 cost by modality, margin and COD position of one route,
        aggregated from the orders on its stops so every total equals the sum
        of its per-order values. Readable only by DISPATCHER members and
        PLATFORM_ADMIN members with a satisfied MFA challenge; the route must be
        operated by the selected organization.
      parameters:
