          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        terms_version:
          type: string
        privacy_version:
          type: string
        accepted_at_client:
          type: string
          format: date-time
        recorded_at_server:
          type: string
          format: date-time
        acceptance_channel:
          type: string
          enum:
