        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /settlements/{settlementId}/export.csv:
    get:
      tags:
      - Finance
      operationId: exportSettlementCsv
      description: >-
        SET-001 CSV export generated only from the persisted settlement and its
        persisted lines, never recalculated from assignments or orders, with
        the same capability as getSettlement. RFC 4180 records ending in CRLF,
        UTF-8 without a byte order mark, and exactly this header:
        settlement_id,payee_type,payee_id,period_from,period_to,settlement_status,settlement_total_cents,line_id,line_type,order_id,amount_cents,source_reference,line_created_at.
        One record per line, ordered by created_at then id, each repeating its
        settlement columns, so amount_cents sums to settlement_total_cents.
        Money is integer cents, dates are yyyy-MM-dd, line_created_at is UTC
        with microsecond precision, and an ADJUSTMENT has an empty order_id. No
        column carries personal data or free text. A header whose total does not
        equal the exact sum of its lines is never exported and the export fails
        closed as 503.
      x-authorization-precedence: capability-before-persisted-state
      x-capability-protected-state:
      - settlement
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement CSV, served as attachment settlement-{settlementId}.csv
          headers:
            Content-Disposition:
              description: attachment with filename settlement-{settlementId}.csv
              schema:
                type: string
            Cache-Control:
              description: AI05-EXPORT-NO-STORE; no cache may keep a copy of the export.
              schema:
                type: string
                const: no-store
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/SettlementConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-Paquetenvia.Session
      description: >-
        AUTH-001 BFF session (GATE-002-BFF-001). The cookie carries only an opaque,
        Data Protection-protected key; the ticket (subject, AuthCenter sid, MFA evidence, CSRF secret,
        refresh token and ID token) is stored server-side (BFF-SESSION-STORE-POSTGRESQL). Every
        unsafe method also requires the session-bound X-AuthCenter-CSRF header.
  parameters:
    BffCsrfToken:
      name: X-AuthCenter-CSRF
      in: header
      required: true
      description: Session-bound CSRF token returned by GET /auth/session (GATE-002-BFF-001).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteStopId:
      name: stopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationContext:
      name: X-Organization-Id
      in: header
      required: true
      description: Organización activa; debe corresponder a una membresía ACTIVE del usuario.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: >-
        AI05-DECLARE-400-ERRORS - malformed request. The Locations operations
        answer 400 for a missing, repeated or malformed X-Organization-Id
        header and for a request whose parameters or body do not have the
        contracted shape; no resource is read or written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State, idempotency or concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RoutingConflict:
      description: >-
        RTE-001 stale version, duplicate route membership, active-route
        conflict, route or assignment state conflict, driver/order
        incompatibility, eligibility/capacity rejection or idempotency mismatch.
        Internal evidence and cross-tenant existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DispatchAssignmentConflict:
      description: >-
        DSP-002 request, idempotency, state, concurrency, eligibility, capacity
        or replay-evidence conflict. Internal rejection evidence and PII are
        never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DispatchAssignmentConflictProblem'
    CsvImportConflict:
      description: >-
        CSV-001 upload rejected, or the batch Idempotency-Key is already bound to
        different content. Transport-level rejections report the uniform CONFLICT;
        only a reused batch key is named, as IDEMPOTENCY_CONFLICT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CsvImportConflictProblem'
    IncidentConflict:
      description: >-
        INC-001 request, idempotency, order-state, incident-state or evidence
        conflict. openIncident also answers OFFLINE_OPERATION_EXPIRED when
        occurred_at is older than its configured maximum occurrence age
        (x-offline-operation-age); resolveIncident never does. Internal
        rejection evidence, the current incident status and cross-tenant
        existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/IncidentConflictProblem'
    FinanceConflict:
      description: >-
        FIN-001 request-shape, idempotency, replay-evidence, concurrency, COD
        lifecycle or order-state conflict, identified by a stable code.
        Internal evidence is never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FinanceConflictProblem'
    SettlementConflict:
      description: >-
        SET-001 request-shape, idempotency, replay-evidence, concurrency,
        settlement-state or pending-source conflict, identified by a stable
        code. The current settlement status, source evidence and cross-tenant
        existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SettlementConflictProblem'
    TransitionConflict:
      description: >-
        ORD-002 state, idempotency or concurrency conflict, returned without a
        code. An offline replay whose client_occurred_at is older than 72
        hours is rejected with the code OFFLINE_OPERATION_EXPIRED
        (OPS-003-SERVER-72H-REJECTION, x-offline-operation-age).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TransitionConflictProblem'
    ProofConflict:
      description: >-
        POD-001 request, idempotency, order-state, upload-session or object
        conflict, identified by a stable code. An offline operation whose
        client timestamp is older than 72 hours is OFFLINE_OPERATION_EXPIRED
        (OPS-003-SERVER-72H-REJECTION, x-offline-operation-age). Object keys,
        session evidence and cross-tenant existence are never exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProofConflictProblem'
    NotFound:
      description: Not found or inaccessible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        Authenticated actor lacks capability inside an otherwise visible tenant context.
        When the only unmet requirement of the authorization policy is MFA, the problem
        carries code MFA_REQUIRED (AUTH-001-MFA-STEP-UP); every other 403 is generic.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ForbiddenProblem'
    UniformNotFound:
      description: Missing, cross-tenant, expired or revoked resource. Response must not reveal existence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DriverLocationInvalidRequest:
      description: Structurally invalid driver location batch. The stable problem code is INVALID_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DriverLocationInvalidRequestProblem'
    TooManyRequests:
      description: Request rejected by rate limiting
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >-
        Required provider or infrastructure dependency is unavailable. Every
        authenticated operation can report it while the identity context
        cannot be resolved, and every tenant operation while the mandatory
        PLATFORM_ADMIN tenant-activation audit cannot be written
        (AI05-DECLARE-EMITTED-ERRORS).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required:
      - currency
      - amount_cents
      properties:
        currency:
          type: string
          const: MXN
        amount_cents:
          type: integer
          minimum: 0
          format: int64
    OrderStatus:
      type: string
      enum:
      - DRAFT
      - CONFIRMED
      - READY_FOR_PICKUP
      - ASSIGNED
      - AT_PICKUP
      - PICKED_UP
      - IN_TRANSIT
      - DELIVERING
      - FAILED_ATTEMPT
      - RESCHEDULED
      - RETURNING
      - RETURNED
      - DELIVERED
      - CLOSED
      - CLAIM_OPEN
      - CLAIM_RESOLVED
      - CANCELLED
    AddressInput:
      type: object
      required:
      - address_text
      - contact_name
      - phone
      properties:
        address_text:
          type: string
          minLength: 8
        contact_name:
          type: string
        phone:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        references:
          type: string
          maxLength: 500
    CreateQuoteRequest:
      type: object
      required:
      - origin
      - destination
      - service_type
      - packages
      properties:
        client_account_id:
          type: string
          format: uuid
        origin:
          $ref: '#/components/schemas/AddressInput'
        destination:
          $ref: '#/components/schemas/AddressInput'
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        consolidated_route:
          type: boolean
          default: false
        packages:
          type: array
          minItems: 1
          maxItems: 20
          description: AI05-INPUT-LIMITS; more than 20 packages is a validation error (422).
          items:
            $ref: '#/components/schemas/PackageInput'
      description: Owner organization is derived from X-Organization-Id after membership validation.
    PackageInput:
      type: object
      required:
      - description
      - weight_grams
      - declared_value_cents
      properties:
        description:
          type: string
          maxLength: 250
        weight_grams:
          type: integer
          minimum: 1
        declared_value_cents:
          type: integer
          minimum: 0
          format: int64
        length_mm:
          type: integer
          minimum: 1
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
    Quote:
      type: object
      required:
      - id
      - net
      - tax
      - total
      - rule_ids
      - expires_at
      - origin_location_id
      - destination_location_id
      - service_type
      - consolidated_route
      - package_snapshot
      - pricing_tier
      - minimum_total_cents_snapshot
      - pricing_policy_version
      - status
      - city_id
      properties:
        id:
          type: string
          format: uuid
        net:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        rule_ids:
          type: array
          items:
            type: string
            format: uuid
        breakdown:
          type: array
          items:
            type: object
            additionalProperties: true
        expires_at:
          type: string
          format: date-time
        origin_location_id:
          type: string
          format: uuid
        destination_location_id:
          type: string
          format: uuid
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        consolidated_route:
          type: boolean
        package_snapshot:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PackageInput'
        city_id:
          type: string
          format: uuid
        service_area_id:
          type:
          - string
          - 'null'
          format: uuid
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        minimum_total_cents_snapshot:
          type: integer
          minimum: 0
          format: int64
        pricing_policy_version:
          type: string
          description: Version of the owning organization's pricing policy, frozen from the tariff rule the quote selected
            (PRC-POLICY-VERSION-PER-ORG). The order created from the quote copies it unchanged.
        status:
          type: string
          enum:
          - ACTIVE
          - USED
          - EXPIRED
          - REVOKED
        request_snapshot_redacted:
          type: object
          additionalProperties: true
          description: Must not contain plaintext address, contact name, telephone or access notes.
    CreateOrderRequest:
      type: object
      required:
      - quote_id
      - payer_type
      - acceptance
      properties:
        quote_id:
          type: string
          format: uuid
        payer_type:
          type: string
          enum:
          - SENDER
          - RECIPIENT
          - BUSINESS_ACCOUNT
        acceptance:
          type: object
          required:
          - terms_version
          - privacy_version
          - accepted_at
          - acceptance_channel
          properties:
            terms_version:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Za-z0-9._-]+$
              description: AI05-INPUT-LIMITS; the same bound applies to a CSV-001 row. Any other value is rejected with 409 before any order is created.
            privacy_version:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Za-z0-9._-]+$
              description: AI05-INPUT-LIMITS; the same bound applies to a CSV-001 row. Any other value is rejected with 409 before any order is created.
            accepted_at:
              type: string
              format: date-time
              description: >-
                Client-observed acceptance timestamp; persisted as accepted_at_client after UTC normalization.
                AI05-INPUT-LIMITS - it must lie no later than server time plus 5 minutes and no earlier than
                server time minus 72 hours, both inclusive; otherwise the request is rejected with 409 before
                any order is created (a CSV-001 commit row fails the same way).
            acceptance_channel:
              type: string
              enum:
              - WEB
              - PWA
              - ASSISTED
              - API
    Order:
      type: object
      required:
      - id
      - public_id
      - owner_org_id
      - status
      - price_net
      - version
      - origin_location_id
      - destination_location_id
      - service_type
      - pricing_tier
      - total
      - city_id
      properties:
        id:
          type: string
          format: uuid
        public_id:
          type: string
        owner_org_id:
          type: string
          format: uuid
        operator_org_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        price_net:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1
        origin_location_id:
          type: string
          format: uuid
        destination_location_id:
          type: string
          format: uuid
        service_type:
          type: string
          enum:
          - SAME_DAY
          - URGENT
          - SCHEDULED_ROUTE
        quote_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        service_area_id:
          type:
          - string
          - 'null'
          format: uuid
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        total:
          $ref: '#/components/schemas/Money'
        claim_window_ends_at:
          type:
          - string
          - 'null'
          format: date-time
        finalized_at:
          type:
          - string
          - 'null'
          format: date-time
    OrderDetail:
      allOf:
      - $ref: '#/components/schemas/Order'
      - type: object
        properties:
          timeline:
            type: array
            items:
              $ref: '#/components/schemas/OrderEvent'
    TransitionRequest:
      type: object
      required:
      - target_status
      - reason
      - expected_version
      properties:
        target_status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          maxLength: 500
        expected_version:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
        client_occurred_at:
          type: string
          format: date-time
          description: >-
            When the driver captured the operation offline. Optional; when
            present the x-offline-operation-age rule applies.
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - driver_id
      - assignment_type
      - cost_cents
      properties:
        driver_id:
          type: string
          format: uuid
        assignment_type:
          type: string
          description: >-
            Global assignment vocabulary. DSP-002 enables only OWN. EXTERNAL is
            reserved for EXT-001 and ALLY_CAPACITY for ALY-004; either reserved
            value produces a DSP-002 conflict until its owning capability is
            implemented.
          enum:
          - OWN
          - EXTERNAL
          - ALLY_CAPACITY
          x-dsp-002-enabled-values:
          - OWN
          x-reserved-for:
            EXTERNAL: EXT-001
            ALLY_CAPACITY: ALY-004
        cost_cents:
          type: integer
          minimum: 0
          format: int64
        route_id:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            Optional global route reference. DSP-002 assignment creation accepts
            only omission or null. RTE-001 links an existing OWN ACCEPTED or
            ACTIVE assignment exclusively through POST /routes/{routeId}/stops;
            this field is not an alternate Routing command. Once linked,
            route_id may be non-null only when the route belongs to the active
            tenant, is DRAFT, has the same driver, the order remains compatible,
            and no other active route association exists. EXTERNAL and
            ALLY_CAPACITY routing remain disabled.
          x-dsp-002-support: omitted-or-null-only
          x-rte-001-link-authority: POST /routes/{routeId}/stops
    Assignment:
      type: object
      required:
      - id
      - order_id
      - driver_id
      - route_id
      - status
      - cost
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        route_id:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            RTE-001 may populate this only for an OWN assignment linked
            atomically through the authoritative route-stop mutation.
        status:
          type: string
          enum:
          - OFFERED
          - ACCEPTED
          - ACTIVE
          - COMPLETED
          - CANCELLED
        cost:
          $ref: '#/components/schemas/Money'
    CreateOfferRequest:
      type: object
      required:
      - order_id
      - commission_cents
      - expires_at
      properties:
        order_id:
          type: string
          format: uuid
        commission_cents:
          type: integer
          minimum: 0
          format: int64
        expires_at:
          type: string
          format: date-time
        eligible_constraints:
          $ref: '#/components/schemas/EligibleConstraints'
    ExternalOffer:
      type: object
      required:
      - id
      - order_id
      - status
      - commission
      - expires_at
      - version
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          - EXPIRED
          - CANCELLED
        commission:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
        accepted_by_driver_id:
          type:
          - string
          - 'null'
          format: uuid
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
    ExternalOfferPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalOffer'
        next_cursor:
          type:
          - string
          - 'null'
    DriverStop:
      type: object
      required:
      - order_id
      - aggregate_version
      - order_public_id
      - stop_type
      - status
      - address_summary
      properties:
        order_id:
          type: string
          format: uuid
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        order_public_id:
          type: string
        stop_type:
          type: string
          enum:
          - PICKUP
          - DELIVERY
          - RETURN
        status:
          type: string
        address_summary:
          type: string
        contact_token:
          type: string
          description: Protected relay token; never a raw telephone number.
    Proof:
      type: object
      required:
      - id
      - proof_type
      - sha256
      - captured_at
      properties:
        id:
          type: string
          format: uuid
        proof_type:
          type: string
        sha256:
          type: string
        captured_at:
          type: string
          format: date-time
    OpenIncidentRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - severity
      - description
      - reason_code
      - next_action
      - occurred_at
      - evidence_proof_ids
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z_]+$
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        description:
          type: string
          minLength: 1
          maxLength: 2000
        reason_code:
          type: string
          enum:
          - RECIPIENT_ABSENT
          - ADDRESS_NOT_FOUND
          - RECIPIENT_REFUSED
          - ACCESS_RESTRICTED
          - PAYMENT_UNAVAILABLE
          - PACKAGE_DAMAGED
          - SECURITY_RISK
        next_action:
          type: string
          enum:
          - RESCHEDULED
          - RETURNING
        occurred_at:
          type: string
          format: date-time
          description: >-
            When the attempt happened on the device. Required; the
            x-offline-operation-age rule applies with the configurable limits
            of its openIncident entry.
        evidence_proof_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    ResolveIncidentRequest:
      type: object
      additionalProperties: false
      required:
      - outcome
      - reason
      properties:
        outcome:
          type: string
          enum:
          - RESOLVED
          - REJECTED
        reason:
          type: string
          description: >-
            Operator rationale kept as append-only audit evidence. Surrounding
            whitespace and control characters are rejected, never trimmed.
          minLength: 1
          maxLength: 500
          pattern: '^[^\s\x00-\x1F\x7F-\x9F](?:[^\x00-\x1F\x7F-\x9F]*[^\s\x00-\x1F\x7F-\x9F])?$'
    Incident:
      type: object
      required:
      - id
      - order_id
      - status
      - severity
      - reason_code
      - next_action
      - custody_acquired
      - occurred_at
      - sla_due_at
      - evidence_proof_ids
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
          - REJECTED
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        reason_code:
          type: string
          enum:
          - RECIPIENT_ABSENT
          - ADDRESS_NOT_FOUND
          - RECIPIENT_REFUSED
          - ACCESS_RESTRICTED
          - PAYMENT_UNAVAILABLE
          - PACKAGE_DAMAGED
          - SECURITY_RISK
        next_action:
          type: string
          enum:
          - RESCHEDULED
          - RETURNING
        custody_acquired:
          type: boolean
        occurred_at:
          type: string
          format: date-time
        sla_due_at:
          type: string
          format: date-time
        evidence_proof_ids:
          type: array
          minItems: 1
          maxItems: 10
