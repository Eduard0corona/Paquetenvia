        amount_cents:
          type: integer
          format: int64
        source_reference:
          type: string
          description: >-
            dispatch.assignments/{assignmentId} for DELIVERY and RETURN,
            platform.audit_logs/{auditId} for ADJUSTMENT.
        created_at:
          type: string
          format: date-time
    Settlement:
