  /orders/{orderId}/cod-records:
    post:
      tags:
      - Finance
      operationId: recordCodCollection
      description: >-
        FIN-001 records the cash collected for one order as RECORDED, which the
        order state machine requires before DELIVERED. The amount must equal the
        order's COD expectation exactly. DISPATCHER members may record;
        PLATFORM_ADMIN members need a satisfied MFA challenge; a DRIVER member
        may record only while holding the order's ACCEPTED or ACTIVE assignment,
        decided inside the order lock from the same observation that credits
        the collecting driver. Capability is decided before order existence or
        idempotency evidence is revealed. Replaying the same Idempotency-Key and
        payload returns the stored response.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCodRequest'
      responses:
        '201':
          description: COD recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/FinanceConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cod-records/{codId}/reconcile:
    post:
      tags:
      - Finance
      operationId: reconcileCod
      description: >-
        FIN-001 reconciles a RECORDED collection to RECONCILED, which the order
        state machine requires before CLOSED. Only DISPATCHER members and
        PLATFORM_ADMIN members with a satisfied MFA challenge may reconcile, so
        a collecting driver can never reconcile their own collection. Replaying
        the same Idempotency-Key returns the stored response.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: codId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UniformNotFound'
        '409':
          $ref: '#/components/responses/FinanceConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{orderId}/financials:
    get:
      tags:
      - Finance
      operationId: getOrderFinancials
      description: >-
        FIN-001 cost by modality, margin and COD position of one order, derived
        on read in integer MXN cents. Readable only by DISPATCHER members and
        PLATFORM_ADMIN members with a satisfied MFA challenge; the order must be
        owned or operated by the selected organization.
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/OrderId'
