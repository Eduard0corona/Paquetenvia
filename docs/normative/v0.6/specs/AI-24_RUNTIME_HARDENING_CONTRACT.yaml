order_auto_close:
  decision: ORD-AUTO-CLOSE-2026-10-10
  host: Paqueteria.Worker job orders.auto-close behind IJobScheduler (ADR-034 periodic BackgroundService)
  settings:
    enabled: Orders:AutoClose:Enabled, false by default; true requires ConnectionStrings:PaqueteriaWorker
    interval: Orders:AutoClose:PollIntervalSeconds, default 60, 1..3600
    batch: Orders:AutoClose:BatchSize, default 100, 1..1000 orders per batch
    batches_per_cycle: Orders:AutoClose:MaxBatchesPerCycle, default 10, 1..100
  discovery: security.list_auto_close_owner_organizations(uuid,integer), owned by paqueteria_auto_close_executor
    NOLOGIN BYPASSRLS, executable only by paqueteria_worker; returns only owner organization identifiers with at
    least one DELIVERED order, ascending and strictly after a cursor, limit 1..1000; no tenant context, no order
    identifier and no guard input
  candidates: per owner organization, an explicit Worker tenant transaction (BEGIN, set_config(..., true) with only
    that organization in app.current_org_ids as uuid[], SET LOCAL ROLE paqueteria_worker) reads its DELIVERED orders
    (owner_org_id = that organization) by ascending id with their version
  close: per order, its own owner tenant transaction runs the ORD-002 transition DELIVERED -> CLOSED as the system
    actor with the read version; guards, order update, event, outbox, audit and idempotency rows are the manual
    close's
  lock: no job-level lock; the order row lock (FOR UPDATE) and the optimistic version decide, so two Workers or a
    concurrent manual close never close an order twice; the loser sees a version or state conflict and writes nothing
  resume: the cycle stops at the end of the DELIVERED orders or after the batch cap and then resumes after the last
    order tried (in-memory hint; a restart starts over)
  failure_handling:
    guard_not_satisfied: the order stays DELIVERED; counted per AI-05 rule code, not logged per order
    superseded: version, state, visibility or concurrency conflict; nothing written; counted
    unexpected_error: rolled back; the rest of the batch continues; the cycle then ends failed (ScheduledJobCycle
      failure for the OBS-002 job-failure alert) and the order is retried on a later pass
    discovery_or_read_error: the cycle ends failed and the next one runs after the interval
  telemetry: meter Paquetenvia.Orders.AutoClose, orders.auto_close.cycles (outcome drained, capped or failed) and
    orders.auto_close.attempts (outcome closed, superseded, failed or the lower-case rule code); counts only, never an
    identifier or personal datum
  rollback: Orders:AutoClose:Enabled=false; REVOKE EXECUTE on the discovery function from paqueteria_worker; orders
    already closed stay closed
tenant_context:
  current_org_ids: parameterized uuid[] cast to text for set_config; empty is {} and never NULL
  statement: SELECT set_config('app.current_org_ids', @organization_ids::uuid[]::text, true)
  retry: reapply after every new transaction
money:
  storage: bigint cents
  api: integer/int64
  floating_point_prohibited: true
partitioning:
  location_outbox_mvp_unique: UNIQUE(driver_position_id) without FK
  before_partitioning: approve global dedup strategy
bff_session:
  decisions:
  - GATE-002-BFF-001
  - BFF-SESSION-STORE-POSTGRESQL
  - BFF-SESSION-TABLE-SHAPE
  - BFF-LOGOUT-JTI-PERSISTENCE
  - PILOT-SAME-ORIGIN-ROUTING
  - AUTH-OPEN-REGISTRATION
  - AUTH-EMAIL-VERIFIED-REQUIRED
  - AUTH-001-RP-INITIATED-LOGOUT
  - AUTH-001-BACKCHANNEL-LOGOUT
  - AUTH-001-MFA-STEP-UP
  - AUTH-001-ACCESS-DENIED-MESSAGE
  flow: OIDC authorization code with PKCE S256 executed by the API (BFF)
  endpoints:
  - GET /auth/login
  - GET /signin-authcenter
  - GET /auth/session
  - POST /auth/logout
  - POST /auth/backchannel-logout
  cookie: __Host-Paquetenvia.Session; Secure; HttpOnly; SameSite=Lax; Path=/; no Domain; opaque key only
  tokens_in_browser: prohibited; single exception, the id_token_hint inside the logout endSessionUrl, returned only after the local session is destroyed
  server_side_ticket: minimal principal (sub, sid, MFA evidence, email_verified evidence, name, email), CSRF secret, sign-in moment, refresh token and ID token; the access token is discarded
  session_replacement: every successful sign-in deletes the previous ticket of the browser and issues a new opaque key
  session_store: PostgreSQL table identity.bff_sessions (BFF-SESSION-TABLE-SHAPE), pre-tenant with FORCE RLS and no policy; stores only the SHA-256 of the opaque session key and the Data Protection ticket ciphertext, which revocation erases; paqueteria_app holds no table grant and reaches it only through security.create_bff_session, security.resolve_bff_session(bytea) and security.revoke_bff_session (by key hash, by authcenter_sid, by subject created at or before a moment), owned by paqueteria_session_executor NOLOGIN; revoked and expired rows are purged by paqueteria_cleanup_executor through security.purge_bff_sessions(integer) from the Worker; AuthCenter:SessionStore=Memory keeps the single-replica in-memory store as the rollback switch
  csrf: X-AuthCenter-CSRF session-bound header on every unsafe method; a present Origin must equal the public web origin
  authorization_response_iss: required and ordinal-equal to the configured issuer (RFC 9207)
  redirect_uri: derived from the configured public origin, never from Host or X-Forwarded-* headers
  authorization_source: identity_subject plus memberships plus RLS on every request; AuthCenter roles and permissions ignored
  first_access: open registration (AUTH-OPEN-REGISTRATION supersedes AUTH-FIRST-LOGIN-INVITATION); the first sign-in of an unknown subject creates its identity.users row exactly once, with no memberships, through security.register_identity_subject (UNIQUE identity_subject arbitrates concurrent sign-ins; an existing subject is never relinked or modified); sign-in never creates organizations, and creates memberships only from pending memberships an administrator added for the verified email (REG-ACCEPT-ALL-ORGANIZATIONS)
  email_verified: required (AUTH-EMAIL-VERIFIED-REQUIRED); the callback accepts only an ID token with exactly one email_verified claim equal to true, otherwise it redirects to /login?error=email_not_verified with no session and no user created or linked; the evidence is kept in the server-side ticket and self-service onboarding requires it
  onboarding: POST /api/v1/onboarding/organizations creates one BUSINESS (ACTIVE, creator BUSINESS_ADMIN) or ALLY (PENDING_APPROVAL, creator ALLY_ADMIN, no access until a PLATFORM_ADMIN approves it); one self-created organization that is not CLOSED per person (REG-ONE-ORGANIZATION-PER-PERSON, organizations_one_open_self_service_uq); the Idempotency-Key derives the organization id (ONBOARDING-IDEMPOTENCY-DERIVED-ID)
  pending_memberships: at every sign-in with a verified email the callback applies security.apply_pending_memberships(text,bytea[],integer[]) with the keyed HMAC of the normalized email under every configured key version (EmailLookup:Keys, Key Vault in Azure, user-secrets locally, start fails without a key outside Development and Testing when a PostgreSQL provider is enabled); each PENDING unexpired entry of an ACTIVE organization becomes a membership of the ACTIVE user exactly once; the email is never stored, logged or returned (REG-JOIN-EXISTING-BY-EMAIL)
  logout: CSRF required; revokes the refresh token and destroys the local session even if AuthCenter discovery fails; 200 {endSessionUrl} built from the discovery end_session_endpoint (HTTPS on the configured authority) with id_token_hint and post_logout_redirect_uri <public origin>/login, or null; the web navigates with window.location.assign
  backchannel_logout:
    endpoint: POST /auth/backchannel-logout, anonymous, no cookie, CSRF or Origin, Cache-Control no-store, application/x-www-form-urlencoded logout_token
    logout_token: RS256 only; typ logout+jwt; exact iss; aud = client id; lifetime with 30 s skew and recent iat; events has http://schemas.openid.net/event/backchannel-logout; no nonce; sid or sub; jti accepted once and remembered until exp + 5 minutes
    responses: 200 accepted; 400 {"error":"invalid_request"} otherwise
    effect: sid marked terminated for SessionLifetimeMinutes and rejected on the next request (ticket and cookie destroyed); a sub-only token ends the subject's sessions signed in before it
    store: behind a session-termination interface; with the PostgreSQL store the rows of the sid (security.revoke_bff_session(text)) or of the subject created at or before the logout (security.revoke_bff_session(text,timestamptz)) are revoked in identity.bff_sessions and refused by every replica; the SHA-256 of the jti is registered in the pre-tenant identity.bff_logout_jtis through security.register_bff_logout_jti(bytea,timestamptz) (ON CONFLICT DO NOTHING, first registration across replicas only, retained until exp + 5 minutes and at most one day) in the same transaction as the revocation (BFF-LOGOUT-JTI-PERSISTENCE); the Memory store keeps cache markers and a per-replica jti cache
  mfa_step_up: /auth/login?mfa=required sends acr_values urn:authcenter:acr:mfa; the ID token must carry acr urn:authcenter:acr:mfa or urn:authcenter:acr:phr and mfa in amr; a 403 whose only unmet requirement is MFA carries problem code MFA_REQUIRED; nobody is forced to MFA (drivers included)
  callback_errors: access_denied (after state, correlation and iss validate) redirects to /login?error=access_denied; every other failure to /login?error=signin_failed; no protocol detail forwarded
  same_origin_routing: pilot ingress routes /api, /hubs, /auth and /signin-authcenter to the API
