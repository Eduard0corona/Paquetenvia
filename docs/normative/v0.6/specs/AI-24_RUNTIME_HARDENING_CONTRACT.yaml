meta:
  project: '[NOMBRE COMERCIAL PENDIENTE]'
  version: '0.6'
  status: NORMATIVE
  date: '2026-07-20'
extensions:
  pgcrypto:
    schema: extensions
    references: always schema-qualified
    token_digest: extensions.digest(pg_catalog.convert_to(token,'UTF8'),'sha256')
  postgis:
    schema: public
    move_prohibited_without_adr: true
    runtime_public_privileges:
    - USAGE
    runtime_public_prohibitions:
    - CREATE
tracking_token:
  entropy_bytes: 32
  encoding: Base64URL without padding
  normalization: none
  hash: SHA-256
  hash_input: exact UTF-8 bytes of encoded token
  storage: bytea length 32
  derivation:
    decision: TRK-002-AUTO-LINK (project owner, 2026-09-29)
    algorithm: HMAC-SHA256(key, UTF-8 bytes of canonical_input); the 32-byte MAC is the token entropy
    canonical_input: paquetenvia-trk-v1|{key_version}|{order_id}|{generation}
    canonical_rules: exact ASCII, no whitespace; key_version and generation invariant decimal integers; order_id UUID D lowercase
    key: Key Vault secret public-tracking-link-key, Base64 of 32 to 128 random bytes, read by the API at start
      and, once AI-08 NTF-005 ships, by the Worker at start to derive the link a recipient notice carries
      (NTF-RECIPIENT-NOTICES-2026-10-20, recipient_notices.tracking_link) (PublicTracking:LinkKeys:{key_version},
      current version PublicTracking:CurrentLinkKeyVersion); never stored in the database, logged or committed
    fail_closed: the API refuses to start with PublicTracking:Provider=PostgreSql and no valid key, except
      Development and Testing, which derive a synthetic key at runtime from a public label; the Worker refuses to
      start with recipient notices enabled and a real messaging provider but no valid key (NTF-005)
    stored: token_hash only, plus generation (starting at 1) and key_version; plaintext never persisted or logged
    generation: a retired generation is never derived again; the next link of the order is max(generation)+1.
      TRK-002-NO-REVOCATION - nobody revokes a link, so generation stays at its initial value 1 and grows only when
      a pre-derivation token or a link of a key version no longer configured is replaced
    rotation: a new key version becomes current for new generations; stored links keep resolving (the lookup is by
      hash); a link whose key version is no longer configured is retired and replaced by the next generation on the
      next get-or-create; a key whose bytes changed under the same version fails closed
    pre_derivation_tokens: rows with key_version NULL are random tokens issued before TRK-002-AUTO-LINK; they keep their
      fixed expires_at and are retired and replaced on the next get-or-create
  required_contract_tests:
  - C# vs PostgreSQL fixed vector
  - valid token projection
  - single-byte mutation mismatch
  - C# derivation vs PostgreSQL extensions.hmac over the canonical input
  test_vector:
    raw_bytes_hex: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
    token: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
    sha256_hex: eb9f16800c9029ffca85695763d23c3ace71011cf40e9354acd810205e250f87
    sha256_base64: 658WgAyQKf/KhWlXY9I8Os5xARz0DpNUrNgQIF4lD4c=
outbox_lifecycle:
  lanes:
  - platform.outbox_events
  - platform.location_outbox_events
  producer_insert:
    ids: application-generated UUID
    database_generated_values: false
    ef_core: ValueGeneratedNever
    returning_prohibited: true
  runtime_direct_privileges:
    SELECT: false
    UPDATE: false
    DELETE: false
    INSERT: only approved producers
  lease:
    fields:
    - lease_token
    - lease_expires_at
    - locked_at
    - locked_by
    settle_predicate: id matches AND status=PROCESSING AND lease_token matches AND lease not expired
  business_functions:
  - claim_outbox
  - settle_outbox
  - requeue_stale_outbox
  - purge_outbox
  location_functions:
  - claim_location_outbox
  - settle_location_outbox
  - requeue_stale_location_outbox
  - purge_location_outbox
  owners:
    claim_settle_requeue: paqueteria_outbox_executor NOLOGIN BYPASSRLS
    purge: paqueteria_maintenance NOLOGIN BYPASSRLS
  terminal_statuses:
  - PROCESSED
  - DEAD
  active_statuses:
  - PENDING
  - RETRY
  - PROCESSING
public_tracking:
  normative_source: specs/AI-04_DOMAIN_MODEL.yaml public_tracking_contract
  sql_fail_closed: unmapped state returns no projection; anonymous API returns uniform 404
  link_lifetime:
    decision: TRK-002-AUTO-LINK (project owner, 2026-09-29)
    issuance: every order gets generation 1 of its link inside the createOrder transaction, audited TRACKING_TOKEN_ISSUED
    get_or_create: issueTrackingLink returns the same link for any retry or Idempotency-Key and never rotates
    valid_while: the order is in progress, RESCHEDULED included
    final_public_statuses:
    - DELIVERED
    - RETURNED
    - CANCELLED
    grace_after_final: 24 hours after the first order event whose public_event_code is DELIVERED, RETURNED or CANCELLED
    enforcement: security.get_public_tracking_projection, atomically with the hash lookup; a final status without its
      final event returns no projection
    no_new_links: an order in a final public status never gets a new link (409 TRACKING_LINK_ORDER_FINISHED)
    expires_at: infinity for derived links; the fixed ceiling of pre-derivation tokens is still enforced
    public_url: '{PublicTracking:PublicBaseUrl}/track/{token}; PublicBaseUrl is an absolute https origin'
  csharp_fail_loud: unmapped state throws PublicStatusMappingException and alerts
  timeline: only non-null public_event_code; raw payload prohibited
  contract_test: compare all 17 internal states between AI-04, SQL and C#
