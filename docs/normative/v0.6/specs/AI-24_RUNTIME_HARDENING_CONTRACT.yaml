    sha256_hex: 2a09176e270ddcc52e0fee157f3d5bd869f36047f7f946daa7caed4816ae0b37
    sha256_base64: KgkXbicN3MUuD+4Vfz1b2GnzYEf3+Ubap8rtSBauCzc=
order_auto_close:
  decision: ORD-AUTO-CLOSE-2026-10-10
  host: Paqueteria.Worker job orders.auto-close behind IJobScheduler (ADR-034 periodic BackgroundService)
  settings:
    enabled: Orders:AutoClose:Enabled, false by default; true requires ConnectionStrings:PaqueteriaWorker
    interval: Orders:AutoClose:PollIntervalSeconds, default 60, 1..3600
    batch: Orders:AutoClose:BatchSize, default 100, 1..1000 orders per batch
    batches_per_cycle: Orders:AutoClose:MaxBatchesPerCycle, default 10, 1..100
  discovery: security.list_auto_close_owner_organizations(uuid,integer), owned by paqueteria_auto_close_executor
    NOLOGIN BYPASSRLS, executable only by paqueteria_worker; returns only owner organization identifiers with at
    least one DELIVERED order, ascending and strictly after a cursor, limit 1..1000; no tenant context, no order
    identifier and no guard input
  candidates: per owner organization, an explicit Worker tenant transaction (BEGIN, set_config(..., true) with only
    that organization in app.current_org_ids as uuid[], SET LOCAL ROLE paqueteria_worker) reads its DELIVERED orders
    (owner_org_id = that organization) by ascending id with their version
  close: per order, its own owner tenant transaction runs the ORD-002 transition DELIVERED -> CLOSED as the system
    actor with the read version; guards, order update, event, outbox, audit and idempotency rows are the manual
    close's
  lock: no job-level lock; the order row lock (FOR UPDATE) and the optimistic version decide, so two Workers or a
    concurrent manual close never close an order twice; the loser sees a version or state conflict and writes nothing
  resume: the cycle stops at the end of the DELIVERED orders or after the batch cap and then resumes after the last
    order tried (in-memory hint; a restart starts over)
  failure_handling:
    guard_not_satisfied: the order stays DELIVERED; counted per AI-05 rule code, not logged per order
    superseded: version, state, visibility or concurrency conflict; nothing written; counted
    unexpected_error: rolled back; the rest of the batch continues; the cycle then ends failed (ScheduledJobCycle
      failure for the OBS-002 job-failure alert) and the order is retried on a later pass
    discovery_or_read_error: the cycle ends failed and the next one runs after the interval
  telemetry: meter Paquetenvia.Orders.AutoClose, orders.auto_close.cycles (outcome drained, capped or failed) and
    orders.auto_close.attempts (outcome closed, superseded, failed or the lower-case rule code); counts only, never an
    identifier or personal datum
  rollback: Orders:AutoClose:Enabled=false; REVOKE EXECUTE on the discovery function from paqueteria_worker; orders
    already closed stay closed
realtime_dispatcher_role:
  decision: RTM-API-REALTIME-DISPATCHER-ROLE-2026-10-12
  host: the realtime outbox dispatchers the API runs in process while SignalR uses the InProcess backplane
    (RTM-002-INPROCESS-DISPATCHER-COLOCATION, GATE-013 open)
  settings:
    provider: Realtime:OutboxDispatcher:Provider; PostgreSql requires ConnectionStrings:PaqueteriaRealtime
    connection: ConnectionStrings:PaqueteriaRealtime, validated on start; its login must parse and differ from the
      logins of ConnectionStrings:Paqueteria and ConnectionStrings:PaqueteriaWorker; the dispatchers never read
      ConnectionStrings:PaqueteriaWorker
  role: paqueteria_realtime NOLOGIN NOBYPASSRLS (AI-18); member of no role, granted to no group role, owns nothing, no
    default privileges; each login is LOGIN NOINHERIT NOBYPASSRLS and a member of paqueteria_realtime only
  transaction: BEGIN, SET LOCAL ROLE paqueteria_realtime, then set_config(..., true) tenant context (both after BEGIN);
    one organization per evidence read; row_security=off is refused
  grants:
    lane: Notifications 20261012000100_AddRealtimeDispatcherRole (its Down revokes every grant)
    execute:
    - security.claim_realtime_outbox(text,integer,interval)
    - security.requeue_stale_realtime_outbox(interval,integer,integer)
    - security.settle_outbox(uuid,uuid,text,text,timestamp with time zone)
    - security.claim_location_outbox(text,integer,interval)
    - security.settle_location_outbox(uuid,uuid,text,text,timestamp with time zone)
    - security.requeue_stale_location_outbox(interval,integer,integer)
    schema_usage: [security, orders, dispatch, drivers, identity, organizations, routes]
    column_select: the 53 columns of AI-18 RTM-API-REALTIME-DISPATCHER-ROLE, each also readable by paqueteria_app
    prohibited: INSERT, UPDATE, DELETE or table-wide privileges; any privilege on platform.outbox_events or
      platform.location_outbox_events; USAGE on platform; CREATE; the NOTIFICATIONS, DISPATCH and UNROUTED queues;
      claim_outbox and requeue_stale_outbox; purge, maintenance and other executor functions
  readiness: realtime_outbox_dispatcher is healthy only when current_user is paqueteria_realtime, NOBYPASSRLS, the six
    functions exist and are executable, and the session login has the provisioned shape (LOGIN NOINHERIT NOSUPERUSER
    NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS) and is a member, directly or through any chain, of
    paqueteria_realtime and of no other role
  pilot: Key Vault pg-realtime-runtime-connection (read by the API identity only) and pg-realtime-login-verifier (read
    by the logins job); login pv_pilot_realtime
  rollback: Realtime:OutboxDispatcher:Provider=Disabled (screens lose instant updates); Down of the lane step; never the
    Worker credential
tenant_context:
  current_org_ids: parameterized uuid[] cast to text for set_config; empty is {} and never NULL
  statement: SELECT set_config('app.current_org_ids', @organization_ids::uuid[]::text, true)
  retry: reapply after every new transaction
money:
  storage: bigint cents
  api: integer/int64
  floating_point_prohibited: true
partitioning:
  location_outbox_mvp_unique: UNIQUE(driver_position_id) without FK
  before_partitioning: approve global dedup strategy
bff_session:
  decisions:
  - GATE-002-BFF-001
  - BFF-SESSION-STORE-POSTGRESQL
  - BFF-SESSION-TABLE-SHAPE
  - BFF-LOGOUT-JTI-PERSISTENCE
  - PILOT-SAME-ORIGIN-ROUTING
  - AUTH-OPEN-REGISTRATION
  - AUTH-EMAIL-VERIFIED-REQUIRED
  - AUTH-001-RP-INITIATED-LOGOUT
  - AUTH-001-BACKCHANNEL-LOGOUT
  - AUTH-001-MFA-STEP-UP
  - AUTH-001-ACCESS-DENIED-MESSAGE
  flow: OIDC authorization code with PKCE S256 executed by the API (BFF)
  endpoints:
  - GET /auth/login
  - GET /signin-authcenter
  - GET /auth/session
  - POST /auth/logout
  - POST /auth/backchannel-logout
  cookie: __Host-Paquetenvia.Session; Secure; HttpOnly; SameSite=Lax; Path=/; no Domain; opaque key only
  tokens_in_browser: prohibited; single exception, the id_token_hint inside the logout endSessionUrl, returned only after the local session is destroyed
  server_side_ticket: minimal principal (sub, sid, MFA evidence, email_verified evidence, name, email), CSRF secret, sign-in moment, refresh token and ID token; the access token is discarded
  session_replacement: every successful sign-in deletes the previous ticket of the browser and issues a new opaque key
  session_store: PostgreSQL table identity.bff_sessions (BFF-SESSION-TABLE-SHAPE), pre-tenant with FORCE RLS and no policy; stores only the SHA-256 of the opaque session key and the Data Protection ticket ciphertext, which revocation erases; paqueteria_app holds no table grant and reaches it only through security.create_bff_session, security.resolve_bff_session(bytea) and security.revoke_bff_session (by key hash, by authcenter_sid, by subject created at or before a moment), owned by paqueteria_session_executor NOLOGIN; revoked and expired rows are purged by paqueteria_cleanup_executor through security.purge_bff_sessions(integer) from the Worker; AuthCenter:SessionStore=Memory keeps the single-replica in-memory store as the rollback switch
  csrf: X-AuthCenter-CSRF session-bound header on every unsafe method; a present Origin must equal the public web origin
  authorization_response_iss: required and ordinal-equal to the configured issuer (RFC 9207)
  redirect_uri: derived from the configured public origin, never from Host or X-Forwarded-* headers
  authorization_source: identity_subject plus memberships plus RLS on every request; AuthCenter roles and permissions ignored
  first_access: open registration (AUTH-OPEN-REGISTRATION supersedes AUTH-FIRST-LOGIN-INVITATION); the first sign-in of an unknown subject creates its identity.users row exactly once, with no memberships, through security.register_identity_subject (UNIQUE identity_subject arbitrates concurrent sign-ins; an existing subject is never relinked or modified); sign-in never creates organizations, and creates memberships only from pending memberships an administrator added for the verified email (REG-ACCEPT-ALL-ORGANIZATIONS)
  email_verified: required (AUTH-EMAIL-VERIFIED-REQUIRED); the callback accepts only an ID token with exactly one email_verified claim equal to true, otherwise it redirects to /login?error=email_not_verified with no session and no user created or linked; the evidence is kept in the server-side ticket and self-service onboarding requires it
  onboarding: POST /api/v1/onboarding/organizations creates one BUSINESS (ACTIVE, creator BUSINESS_ADMIN) or ALLY (PENDING_APPROVAL, creator ALLY_ADMIN, no access until a PLATFORM_ADMIN approves it); one self-created organization that is not CLOSED per person (REG-ONE-ORGANIZATION-PER-PERSON, organizations_one_open_self_service_uq); the Idempotency-Key derives the organization id (ONBOARDING-IDEMPOTENCY-DERIVED-ID)
  pending_memberships: at every sign-in with a verified email the callback applies security.apply_pending_memberships(text,bytea[],integer[]) with the keyed HMAC of the normalized email under every configured key version (EmailLookup:Keys, Key Vault in Azure, user-secrets locally, start fails without a key outside Development and Testing when a PostgreSQL provider is enabled); each PENDING unexpired entry of an ACTIVE organization becomes a membership of the ACTIVE user exactly once; the email is never stored, logged or returned (REG-JOIN-EXISTING-BY-EMAIL)
  logout: CSRF required; revokes the refresh token and destroys the local session even if AuthCenter discovery fails; 200 {endSessionUrl} built from the discovery end_session_endpoint (HTTPS on the configured authority) with id_token_hint and post_logout_redirect_uri <public origin>/login, or null; the web navigates with window.location.assign
  backchannel_logout:
    endpoint: POST /auth/backchannel-logout, anonymous, no cookie, CSRF or Origin, Cache-Control no-store, application/x-www-form-urlencoded logout_token
    logout_token: RS256 only; typ logout+jwt; exact iss; aud = client id; lifetime with 30 s skew and recent iat; events has http://schemas.openid.net/event/backchannel-logout; no nonce; sid or sub; jti accepted once and remembered until exp + 5 minutes
    responses: 200 accepted; 400 {"error":"invalid_request"} otherwise
    effect: sid marked terminated for SessionLifetimeMinutes and rejected on the next request (ticket and cookie destroyed); a sub-only token ends the subject's sessions signed in before it
    store: behind a session-termination interface; with the PostgreSQL store the rows of the sid (security.revoke_bff_session(text)) or of the subject created at or before the logout (security.revoke_bff_session(text,timestamptz)) are revoked in identity.bff_sessions and refused by every replica; the SHA-256 of the jti is registered in the pre-tenant identity.bff_logout_jtis through security.register_bff_logout_jti(bytea,timestamptz) (ON CONFLICT DO NOTHING, first registration across replicas only, retained until exp + 5 minutes and at most one day) in the same transaction as the revocation (BFF-LOGOUT-JTI-PERSISTENCE); the Memory store keeps cache markers and a per-replica jti cache
  mfa_step_up: /auth/login?mfa=required sends acr_values urn:authcenter:acr:mfa; the ID token must carry acr urn:authcenter:acr:mfa or urn:authcenter:acr:phr and mfa in amr; a 403 whose only unmet requirement is MFA carries problem code MFA_REQUIRED; nobody is forced to MFA (drivers included)
  callback_errors: access_denied (after state, correlation and iss validate) redirects to /login?error=access_denied; every other failure to /login?error=signin_failed; no protocol detail forwarded
  same_origin_routing: pilot ingress routes /api, /hubs, /auth and /signin-authcenter to the API
voice_bridge:
  decisions:
  - VOICE-001-MASKED-CALLS-2026-10-11
  - VOICE-001-PROVIDER-TWILIO-2026-10-11
  - VOICE-001-VOICEMAIL-KEYPRESS-2026-10-11
  port: IVoiceBridgeProvider (Paqueteria.Application.Voice); adapters TwilioVoiceBridgeProvider and the synthetic fake;
    closed VoiceBridgeResultCodes; phone numbers are VoicePhoneNumber values whose ToString is [redacted]
  provider_selection: Voice:Provider Disabled (default), Synthetic (Development, Testing or DEV_SYNTHETIC only) or Twilio
    (refused in Development, Testing, the DevSynthetic environment and any PAQUETERIA_DEPLOYMENT_CLASS=DEV_SYNTHETIC);
    Twilio requires Voice:Twilio:Gate007DecisionId naming the decision-log row that resolves GATE-007, and the pilot
    keeps Disabled (Voice__ is platform-managed in the pilot settings)
  call: one Twilio REST create call (POST /2010-04-01/Accounts/{AccountSid}/Calls.json) To the driver's mobile From the
    company number whose inline TwiML only gathers one digit - "Presiona 1 para llamar al destinatario." - for
    Voice:Twilio:DriverConfirmSeconds (default 10) and posts it, a timeout included, to the signed driver-confirm
    webhook; the recipient's number is not in that request. Only after the driver's 1 does the webhook answer <Dial
    callerId=company number timeout=RecipientRingSeconds timeLimit=MaximumCallSeconds record=do-not-record><Number
    url=recipient-screen>recipient</Number></Dial>; the screening says only the neutral "Tiene una llamada sobre su
    envío; presione 1 para contestar." (no brand, GATE-001) for Voice:Twilio:RecipientConfirmSeconds (default 10) and
    both legs are connected only after the recipient's 1 (VOICE-001-VOICEMAIL-KEYPRESS-2026-10-11, "Confirmar con una
    tecla") - without a key press the call hangs up without bridging, so a voicemail greeting that may say a number
    never reaches the other party; the REST TimeLimit is MaximumCallSeconds plus both key presses, the recipient's
    ringing and a minute of prompts. Mexican numbers are dialed as +52 and ten digits whose first digit is 2-9; no
    recording, no answering-machine detection, no Twilio Proxy (Public Beta without SLA) and no in-browser calling
    (mobile browsers do not keep WebRTC calls in background)
  key_presses: drivers.recipient_call_requests.bridge_stage records DRIVER_CONFIRMED, DRIVER_NOT_CONFIRMED,
    BRIDGE_FAILED (the recipient's number could not be used), RECIPIENT_CONFIRMED or RECIPIENT_NOT_CONFIRMED once per
    call request, only for a request that may ring (REQUESTED, PLACED or UNCONFIRMED), within 15 minutes of the
    request and bound to the platform's own call (CallSid of the driver leg, ParentCallSid of the recipient leg); a
    replayed, late or foreign key press hangs up and changes nothing; nothing is retried; a store failure hangs up
  resilience: per-attempt timeout Voice:Twilio:TimeoutSeconds (default 10), circuit breaker and bulkhead like the
    messaging adapters; never retried (creating a call has no idempotency key); an ambiguous answer (a timeout, a broken
    answer or any 5xx, after which Twilio may have created the call) ends UNCONFIRMED, keeps its key and counts toward
    the limits; only a failure proving nothing was created (unreachable before sending, circuit open, concurrency
    limit, a 4xx with a Twilio error code, 401, 403 or 429) ends FAILED and releases the key
  credentials: Voice:Twilio:AccountSid, AuthToken, optional ApiKeySid and ApiKeySecret, CompanyNumber and optional
    InboundForwardNumber only through KeyVaultSecrets:Mappings; the HTTP client has no default loggers
  phones: the driver's own mobile is stored in drivers.driver_profiles.phone_ciphertext with the ADP-001 envelope
    (purpose drivers.phone) with consent version VOICE-001-CONSENT-V1; the recipient phone is
    locations.locations.phone_ciphertext (purpose locations.phone); both are decrypted only in memory inside
    requestRecipientCall, after the REQUESTED row commits and with no transaction held; synthetic mode never decrypts
    and uses non-dialable placeholders
  request: Idempotency-Key (scope VOICE-001:REQUEST_RECIPIENT_CALL in platform.idempotency_keys); rate limits
    Drivers:RecipientCalls MaximumPerOrder 3 per OrderWindowMinutes 15 and MaximumPerDriverPerHour 20, counting only
    REQUESTED, PLACED and UNCONFIRMED; drivers.recipient_call_requests keeps who, order, assignment, provider, status,
    result code, provider call id, final call status and duration and the bridge stage, never a number; the call
    request id is chosen before the retrying transaction, so a retry after its commit resumes its own reservation;
    a request left REQUESTED between its transactions is ended UNCONFIRMED (result code VOICE_OUTCOME_UNKNOWN) by the
    next replay of its key once Drivers:RecipientCalls:StaleRequestSeconds (default 300) have passed; availability
    RATE_LIMITED carries retry_after_seconds
  webhooks: POST /api/v1/voice/twilio/call-status, /inbound, /driver-confirm, /recipient-screen and
    /recipient-confirm are anonymous but require a valid X-Twilio-Signature (HMAC-SHA1 under the auth token over
    Voice:Twilio:WebhookBaseUri plus the request path and query and the sorted form fields; never Host or
    X-Forwarded-*) and the configured AccountSid; From, To, Caller and Called are used only for the signature; a status
    callback promotes only a REQUESTED, PLACED or UNCONFIRMED request (never a FAILED one); the inbound answer is a
    fixed message or a forward to the configured dispatch line with its own Voice:Twilio:InboundForwardRingSeconds
    (default 30) and InboundForwardMaximumSeconds (default 3600), never the bridge's ring timeout or cost cap
  audit: RECIPIENT_CALL_REQUESTED, RECIPIENT_CALL_PLACED, RECIPIENT_CALL_UNCONFIRMED, RECIPIENT_CALL_FAILED,
    RECIPIENT_CALL_STATUS_REPORTED, RECIPIENT_CALL_DRIVER_CONFIRMED, RECIPIENT_CALL_NOT_CONFIRMED,
    RECIPIENT_CALL_BRIDGED, RECIPIENT_CALL_BRIDGE_FAILED, DRIVER_PHONE_REGISTERED and DRIVER_PHONE_REMOVED, without any
    phone number
  erasure: a driver reads and erases its own number whatever its driver profile's status (ARCO); registering and calling
    require an ACTIVE driver; erasing on behalf of a driver whose membership is no longer active (administrative
    erasure, offboarding) is a follow-up outside VOICE-001
  rollback: Voice:Provider=Disabled stops every call and every new phone; drivers can still remove their number; the
    Drivers lane rollback refuses while call requests or phones exist
recipient_notices:
  decisions:
  - NTF-RECIPIENT-NOTICES-2026-10-20
  - NTF-RECIPIENT-NOTICE-CAPS-2026-10-23
  - GATE-004-CHANNELS
  - NTF-EMAIL-ACS-PILOT-2026-10-11
  - NTF-WHATSAPP-AMBIGUOUS-FAILS-2026-10-02
  - NTF-WHATSAPP-STALE-LEASE-FAILS-2026-10-03
  - TRK-002-AUTO-LINK
  - GATE-001-NEUTRAL-PUBLIC-BRAND-2026-10-10
  status: DECIDED by the project owner on 2026-10-19 and 2026-10-20 (E4 and E4-P1 to E4-P17), and the caps and the
    unusable-contact code on 2026-10-23 (NTF-RECIPIENT-NOTICE-CAPS-2026-10-23, L1 to L4). AI-08 NTF-002 is implemented
    (the optional recipient e-mail, the Locations contact columns and the API's wrap-only recipient-notice sealer,
    Locations:NoticeKeyProtector Disabled by default and in the pilot, so no notice copy is written yet), AI-08 NTF-003
    (the Notifications lane step) and AI-08 NTF-005 (the Worker consumer and sender, the count function of the caps, the
    readers, the unwrap-only notice key and the adapters' buttons and headers), with every switch off and every
    provider Disabled; nothing is configured or enabled. AI-08 NTF-004 and NTF-006 to NTF-008 deliver the rest, each item
    with its own code and tests; only a later change that records the GATE-004 and GATE-007 resolution rows turns it on.
    GATE-004 and GATE-007 stay open
  adr: docs/adr/ADR-NTF-002-RECIPIENT-NOTICES.md
  audience: the delivery recipient of the order only, reached at the contact of its destination location; never the
    sender or its business (E4-P13, out of this work until BUS-001), a driver or a dispatcher
  notices:
  - kind: TRACKING_LINK
    template_key: recipient.tracking-link
    trigger: DRAFT -> CONFIRMED (E4-P4, "Al quedar confirmada"); an order that never leaves DRAFT never gets it
    valid_at_send: the public status of the order is not DELIVERED, RETURNED or CANCELLED (every later notice carries
      the link too)
  - kind: IN_TRANSIT
    template_key: recipient.in-transit
    trigger: PICKED_UP -> IN_TRANSIT, the driver action "Iniciar traslado" (E4-P3, "Al iniciar traslado"); a
      rescheduled order that goes out again with its new assignment gets it again
    valid_at_send: the order is still IN_TRANSIT
  - kind: DELIVERY_FAILED
    template_key: recipient.delivery-failed
    trigger: IN_TRANSIT -> FAILED_ATTEMPT and DELIVERING -> FAILED_ATTEMPT; never AT_PICKUP -> FAILED_ATTEMPT, a failed
      pickup at the sender
    valid_at_send: the order is neither DELIVERING nor in the public status DELIVERED
    content: no failure reason, incident type, next action or note ever reaches the message (E4-P5, "Sin motivo, con
      enlace"); the tracking page keeps showing only the AI-04 public map
  - kind: DELIVERED
    template_key: recipient.delivered
    trigger: DELIVERING -> DELIVERED
    valid_at_send: the public status of the order is DELIVERED
  template_version: 1 for every key; any text change is a new version and needs a new Meta approval
  not_notified: every other AI-04 transition, RESCHEDULED, RETURNING, RETURNED and CANCELLED included (E4, "Los 4 del
    plan"); no new order state or order event exists for notices
  producer:
    pattern: D8-OUTBOX-LANE-DISPATCH (AI-13 section 7.2); no sixth cross-module flow and no new coordinator
    where: the ORD-002 transition transaction of the owner organization (PostgreSqlOrderTransitionService), after the
      order event and in the same transaction as it and its audit row; DELIVERED keeps running inside
      proof_custody_to_order_transition
    policy: RecipientNoticeRequestPolicy decides from source, target and attempt stage; a test pins all 29 AI-04
      transitions so that exactly the five triggers above write a row
    row: one platform.outbox_events row, topic orders.recipient-notice-requested, aggregate_type Order, aggregate_id the
      order, aggregate_version the new order version, priority 50, tenant_context the owner organization; every value
      supplied by the application (generated id, ValueGeneratedNever, trace_parent from OutboxTraceContextColumn) and
      no RETURNING
    payload: recipient-notice-requested-v1 with schema_version, order_event_id, order_id, notice and occurred_at; no
      personal data, public id, token or link
    unconditional: written whenever the transition matches, whatever the switches, so tests stay deterministic; while
      recipient notices are off the Worker settles it at once (switches.enabled)
    routing: security.resolve_outbox_consumer maps orders.recipient-notice-requested to NOTIFICATIONS; the NTF-003 lane
      step and the NTF-005 consumer ship before the NTF-004 producer, so no request row is ever unrouted or unknown
  expansion:
    function: security.expand_recipient_notice_request (Notifications lane, NTF-003), owned by
      paqueteria_outbox_executor and executable only by paqueteria_worker, called under the source row lease_token
    effect: in one transaction, one Notification per eligible channel (recipient_kind ORDER_DESTINATION, order_id,
      order_event_id, template key and version, variables_snapshot with order_public_id only), its PENDING status
      event, its notifications.status-changed row and one notifications.send-requested row whose available_at is the
      start of the quiet-hours window (quiet_hours); ON CONFLICT DO NOTHING on owner_org_id, order_event_id, channel
      and template_key; the source then ends PROCESSED with SOURCE_EXPANDED, or NO_ELIGIBLE_CHANNEL when no channel
      applies
    reads: the public id and status of the order, its WhatsApp consent and whether its destination holds notice copies,
      under FORCE RLS in a tenant transaction of the envelope owner organization; no contact value is read or
      decrypted at expansion
  channels:
    decisions: E4 (WhatsApp; e-mail only when the recipient has one), E4-P1 (WhatsApp only with the consent box) and
      E4-P11 ("Por los dos siempre")
    whatsapp: created when the order recorded the WhatsApp consent (consent) and Messaging:WhatsApp:Provider is not
      Disabled
    email: created when the destination has an e-mail and Messaging:Email:Provider is not Disabled; no consent box is
      needed (E4-P1, "sí correo si hay")
    both: when both apply, both are always sent; the channels are independent - a failure, an opt-out or a cancellation
      in one never changes the other, and nothing waits for a delivery receipt; the WhatsApp row is created first
    disabled_channel: a Disabled provider is left out at expansion, so it never piles up FAILED rows
  consent:
    decision: E4-P1, "Casilla en la orden (Recommended)"
    text: El destinatario aceptó recibir avisos de su envío por WhatsApp
    version: NTF-RECIPIENT-WHATSAPP-CONSENT-V1
    capture: an optional box, unticked by default, on "Nueva orden" (AI-07 create_order.recipient_notices) sent with
      createOrder, and one box for the whole file on the CSV-001 commit (AI-07 csv_order_import.recipient_notices); the
      AI-05 x-pilot-contract-deltas entry NTF-RECIPIENT-NOTICES has the request shapes
    record: orders.recipient_notice_consents (Orders lane, NTF-004; declared in AI-06), append-only, RLS by owner_org_id
      - order, channel WHATSAPP, consent version, attested_by (the creating actor) and attested_at (server time),
      written in the createOrder transaction (quote_snapshot_to_order) or the CSV-001 row create; no row when the box
      is not ticked; it never changes after creation
    effect: without that record no WhatsApp notice is created for the order; e-mail is unaffected
  quiet_hours:
    decision: E4-P10, "8:00 a 21:00 (Recommended)"
    time_zone: America/Mazatlan
    window: messages leave only from 08:00 (inclusive) to 21:00 (exclusive) local time
    outside_window: a notice requested outside the window, and a retry that falls outside it, waits until the next
      08:00 (available_at computed in SQL with AT TIME ZONE, so the container needs no time-zone data) and is sent then
      only if it is still valid (valid_at_send); otherwise it ends CANCELLED with NOTICE_SUPERSEDED and no provider
      call
    settings: Notifications:RecipientNotices:QuietHours:Start (08:00) and End (21:00), validated at start; the time
      zone is fixed by the decision
  staleness:
    bound: Notifications:RecipientNotices:MaximumNoticeDelayHours, default 12 (1 to 24), counted from occurred_at
      without the quiet-hours wait
    expansion: a request row older than the bound ends PROCESSED with NOTICE_STALE and creates nothing
    send: a send request past the bound ends CANCELLED with NOTICE_STALE; after an outage the Worker never sends a burst
      of old notices
  caps:
    decision: NTF-RECIPIENT-NOTICE-CAPS-2026-10-23 (L1 "Función de conteo (Recommended)", L2 "Toda la plataforma
      (Recommended)")
    per_order: Notifications:RecipientNotices:MaximumPerOrderAndChannel, default 8; it counts the other notices of the same
      order and channel whose provider was called (attempts > 0)
    per_day: Notifications:RecipientNotices:DailyLimitPerChannel, default 500 per calendar day in America/Mazatlan, per
      channel for the whole platform (every organization, one WhatsApp number and one e-mail sender); a notice counts once
      its provider was called (attempts > 0), on the Mazatlan day of its last attempt
    count: before any decryption or provider call the Worker asks security.read_recipient_notice_counts (AI-18 recipient
      notices step 6, the Notifications lane step of NTF-005) under the send request's lease_token, which returns only
      the two numbers; the Worker never reads notifications.notifications
    reached: CANCELLED with NOTICE_LIMIT_REACHED and one operational log line with allowlisted dimensions only
  validity:
    check: at send time, before any decryption or provider call, from the current order status read under RLS and the
      valid_at_send of the notice; PublicOrderStatusPolicy maps the status and throws on an unmapped one (AI-01 rule 12)
    superseded: CANCELLED with NOTICE_SUPERSEDED, no attempt counted, the send request PROCESSED
  idempotency: one request row per order event (ORD-002 idempotency writes no second event for a replayed transition);
    one Notification per order event, channel and template key; a redelivered request finds DO NOTHING or LEASE_LOST;
    e-mail retries reuse one ACS Operation-Id per Notification; WhatsApp has no provider idempotency, so an ambiguous
    send and a stale WhatsApp lease end FAILED with AMBIGUOUS_TIMEOUT and are never retried
    (NTF-WHATSAPP-AMBIGUOUS-FAILS-2026-10-02, NTF-WHATSAPP-STALE-LEASE-FAILS-2026-10-03)
  retries: the NTF-001 policy - exponential backoff from RetryBaseSeconds 2 to RetryMaximumSeconds 60, Retry-After
    honoured up to one hour, MaximumAttempts 5, then FAILED with MAX_ATTEMPTS_EXHAUSTED; transient means unreachable,
    429, 5xx, circuit open or bulkhead; authentication, rejection, template and recipient errors are permanent
  outcome_function: security.apply_notification_outcome v2 (NTF-003), under lease_token, accepts the closed
    MessagingResultCodes set and p_provider_reference (wamid or ACS operation id), keeps the WhatsApp ambiguous rule and
    adds the outcome CANCELLED (no attempt counted, outbox PROCESSED); the published 8-argument signature is dropped in
    the same step and the Worker moves with it
  contact:
    decision: E4-P2, "Llave propia para avisos (Recommended)"
    stored: at quote time the API seals the destination phone and the optional e-mail twice - under the PII key
      (phone_ciphertext as today and email_ciphertext, purpose locations.email) and under the recipient-notice key
      (notice_phone_ciphertext and notice_email_ciphertext, purposes locations.notice_phone and locations.notice_email,
      with notice_key_version); AI-06 locations.locations declares the columns (NTF-002); the origin location never
      carries an e-mail or a notice copy
    notice_key: Key Vault RSA key recipient-notice-kek, distinct from the PII key and the Data Protection key; ADP-001
      envelope format v1 bound to owner organization, location row and purpose; notice_key_version is akv:{key
      name}/{version}; rotation keeps earlier versions readable
    roles: the API may only wrap with the notice key and never unwraps it; the Worker may only unwrap with it and read
      its versions, and never reaches the PII key, so addresses, names and incident text stay closed to it (the ADP-001
      rule "The Worker needs no access to the PII key" still holds)
    read_at_send: in a short tenant transaction of the owner organization under FORCE RLS (paqueteria_worker already
      reads locations.locations and orders.orders), a reader the Locations module publishes returns the notice copies,
      their key version and their binding; after the commit they are decrypted in memory only, normalized
      (MexicanPhonePolicy to E.164 +52, the e-mail policy) and wrapped in MessagingRecipient, whose ToString is
      [redacted]; they go out of scope right after the provider call
    never: in logs, outbox payloads, Notification rows, status events, audit, realtime events, metrics or traces
    unusable: NTF-RECIPIENT-NOTICE-CAPS-2026-10-23 (L3 "Destinatario inválido (Recommended)") - a notice whose contact
      cannot be used when it is sent (the notice copy of its channel is gone, altered, or under a key version the Worker
      cannot open) ends FAILED with MESSAGING_RECIPIENT_INVALID, permanent, with no provider call
    synthetic: CI and DEV_SYNTHETIC never decrypt; the placeholders +520000000002 (as VOICE-001) and
      destinatario@example.invalid are used
  tracking_link:
    read: a reader the Orders module publishes returns the active derived link of the order (generation, key_version and
      token_hash, revoked_at IS NULL) under FORCE RLS
    derive: the Worker derives the token with TrackingLinkTokenDerivation and the key ring PublicTracking:LinkKeys,
      checks that SHA-256 of the token equals the stored token_hash, and builds {PublicTracking:PublicBaseUrl}/track/
      followed by the token in memory only; the token is the WhatsApp URL button suffix and part of the e-mail link
    never: stored, logged, placed in an outbox payload, a Notification row or an event; TRK-002 issuance is unchanged
    unavailable: no live link (tracking disabled, a key version the Worker does not hold or a hash mismatch) ends FAILED
      with TRACKING_LINK_UNAVAILABLE, permanent
  templates:
    decision: E4-P6, "De "tú", sin nombres (Recommended)"; the owner reviews these drafts in the change that records
      them, before they go to Meta review
    rules: neutral and without brand while GATE-001 is open (GATE-001-NEUTRAL-PUBLIC-BRAND-2026-10-10); informal "tú";
      the name of no one, neither the sending business nor the recipient; Meta category UTILITY with no promotion;
      only the número de guía and the tracking link as content; the repository keeps these texts as the contract and
      the adapters still have no default text
    whatsapp:
      category: UTILITY
      language: es_MX
      body_parameter: '{{1}} is the número de guía (Order.public_id); no other parameter'
      url_button: 'Ver seguimiento, URL https://paquetenvia.com/track/{{1}} whose dynamic suffix is the derived token
        (the base is PublicTracking:PublicBaseUrl); a URL button also avoids link previews'
      quick_reply_button: No recibir avisos
      footer: Responde BAJA para no recibir más avisos
      bodies:
        recipient.tracking-link: 'Hola. Hay un envío para ti con número de guía {{1}}. Puedes ver cómo va en cualquier
          momento con el botón Ver seguimiento. Si no esperabas este envío, ignora este mensaje.'
        recipient.in-transit: 'Tu envío con número de guía {{1}} ya va en camino a la dirección de entrega. Síguelo con
          el botón Ver seguimiento.'
        recipient.delivery-failed: 'Intentamos entregar tu envío con número de guía {{1}} y no fue posible. Con el
          botón Ver seguimiento verás el siguiente paso.'
        recipient.delivered: 'Tu envío con número de guía {{1}} fue entregado. Puedes ver el detalle con el botón Ver
          seguimiento.'
      corrected: E4-P14, "Corregir los dos (Recommended)" - recipient.delivery-failed no longer starts with "Hoy",
        because a failed attempt after 21:00 is sent at 08:00 the next day (quiet_hours)
      privacy_line: a line with the link to the privacy notice is added only if the GATE-007 legal review asks for it
        (first contact, docs/legal); it changes the texts and needs a new Meta approval
      configuration: Messaging:WhatsApp:Templates:<key>:Name, LanguageCode and ParameterCount name the approved
        template
    email:
      decision: E4-P12, "avisos@paquetenvia.com (Recommended)"
      sender: avisos@paquetenvia.com, the ACS MailFrom address of the verified domain paquetenvia.com, with the display
        name Seguimiento de envío; no Reply-To and no mailbox that receives replies
      format: plain text only, engagement tracking off
      subjects:
        recipient.tracking-link: 'Seguimiento de envío: guía {{1}}'
        recipient.in-transit: 'Tu envío {{1}} va en camino'
        recipient.delivery-failed: 'No pudimos entregar tu envío {{1}}'
        recipient.delivered: 'Tu envío {{1}} fue entregado'
      bodies:
        decision: E4-P14, "Corregir los dos (Recommended)" - a plain-text e-mail has no button, so each body is the
          WhatsApp body of the same notice with "con el botón Ver seguimiento" replaced by "en el enlace de abajo"
          (sentence-initial "Con el botón Ver seguimiento" by "En el enlace de abajo")
        recipient.tracking-link: 'Hola. Hay un envío para ti con número de guía {{1}}. Puedes ver cómo va en cualquier
          momento en el enlace de abajo. Si no esperabas este envío, ignora este mensaje.'
        recipient.in-transit: 'Tu envío con número de guía {{1}} ya va en camino a la dirección de entrega. Síguelo en
          el enlace de abajo.'
        recipient.delivery-failed: 'Intentamos entregar tu envío con número de guía {{1}} y no fue posible. En el enlace
          de abajo verás el siguiente paso.'
        recipient.delivered: 'Tu envío con número de guía {{1}} fue entregado. Puedes ver el detalle en el enlace de
          abajo.'
      body: 'the e-mail body of the same notice (bodies), then the full tracking link ({{2}}) on a line of its own, the
        link to the privacy notice (its wording and address come with the GATE-007 approval), the line "Para dejar de
        recibir estos correos: {{3}}" with the unsubscribe link of that notification, and the line "Este correo se envía
        automáticamente; no lo respondas."'
      headers: List-Unsubscribe with the one-click URL of that notification and List-Unsubscribe-Post
        List-Unsubscribe=One-Click (RFC 8058)
      configuration: Messaging:Email:Templates:<key>:Subject, PlainText and ParameterCount, and
        Messaging:Email:AzureCommunicationServices:SenderAddress
  opt_out:
    decision: E4-P8, "Las tres vías (Recommended)"
    scope: global - an opt-out stops every recipient notice of that channel to that phone or e-mail from every
      organization, because the WhatsApp number is only one
    whatsapp_reply: an inbound WhatsApp text that is exactly BAJA, ALTO, STOP or CANCELAR (trimmed, case and accents
      ignored), or a tap on the quick reply No recibir avisos (receiveMetaWhatsAppWebhook); source RECIPIENT_REPLY,
      channel WHATSAPP; the sender gets the one confirmation below (confirmation); the message body is never stored or
      logged
    email_link: the link in every e-mail and its List-Unsubscribe one-click (unsubscribeRecipientNotices); source
      EMAIL_LINK, channel EMAIL
    dispatcher: the button "Detener avisos" on the order (stopOrderRecipientNotices), for a recipient who asks by
      phone; source DISPATCHER, both channels of the contact of that order; audited RECIPIENT_NOTICES_STOPPED without
      any value
    store: the opt-out store declared in AI-06 (NTF-003 table, NTF-006 writer functions) keeps keyed hashes only
    hash: HMAC-SHA256 under the Key Vault secret paquetenvia-contact-lookup-key-1 (read by the API and the Worker,
      versioned like EmailLookup:Keys) over paquetenvia-contact-v1|{channel}|{value}, where value is the E.164 +52
      phone (a WhatsApp 521 mobile prefix is reduced to 52 first) or the trimmed lower-case e-mail address
    check: before every send the Worker hashes the decrypted contact under every configured key version and asks
      security.is_recipient_opted_out; an opted-out contact ends CANCELLED with RECIPIENT_OPTED_OUT and no provider call
    confirmation:
      decision: E4-P15, "Sí, una línea (Recommended)"
      text: Listo. Ya no recibirás avisos en este número.
      when: once, only for the inbound opt-out message (a keyword or the quick reply) that records the WhatsApp opt-out
        of its contact hash; an opt-out message from a contact already opted out on WhatsApp (by an earlier message or
        by "Detener avisos") gets neither a confirmation nor the automatic reply, so with permanent opt-outs
        (permanence) a contact gets at most one confirmation and two automated senders cannot loop
      how: the auto_reply path - a free-form text message inside the 24-hour customer service window that the inbound
        message opens (a service message), never a template; the webhook seals the sender number under the
        recipient-notice key and records the confirmation request with its keyed hash in the automatic-reply store, in
        the same transaction as the opt-out, through the SECURITY DEFINER functions; the Worker sends it once and erases
        the sealed number right after the attempt whatever its outcome; a request older than 23 hours is dropped
        unsent; auto_reply.never applies to it
      limit: it neither counts against nor waits for the one automatic reply per contact in 24 hours (auto_reply.limit),
        because a recipient who got the automatic reply earlier that day would otherwise never get it; the
        once-per-opt-out rule above is its only bound
      other_paths: the e-mail unsubscribe page keeps its on-screen confirmation (AI-07 /avisos/baja/:token) and sends
        no message; "Detener avisos" (dispatcher) sends nothing to the recipient
    permanence:
      decision: E4-P16, "No en el piloto (Recommended)"
      rule: an opt-out is permanent during the pilot; no path reactivates it - not a later consent box or order, not
        the dispatcher, not a message from the recipient (ALTA included, an ordinary message that gets the automatic
        reply); the store stays append-only and no function removes or reverses a row
      review: re-subscription is reviewed after the pilot, in a change of its own
      residual_risk: an opt-out made by mistake (BAJA, the e-mail link or "Detener avisos") cannot be undone during
        the pilot
  auto_reply:
    decision: E4-P9, "Respuesta automática (Recommended)"
    text: Este número solo envía avisos. Para dudas sobre tu envío contacta a quien te lo envió.
    when: an inbound WhatsApp message of any type that is not an opt-out keyword or the quick reply No recibir avisos
    how: a free-form text message inside the 24-hour customer service window that the inbound message opens (charged as
      a service message, as the chosen option said); never a template and never outside that window
    limit: at most one automatic reply per contact (keyed hash) in 24 hours, so two automated senders cannot loop; the
      opt-out confirmation (opt_out.confirmation) is outside this limit
    path: the webhook never calls the provider; it seals the sender number under the recipient-notice key and records
      the request with its keyed hash through a SECURITY DEFINER function; the Worker sends it, decrypting in memory,
      and erases the sealed number right after the attempt whatever its outcome; a request older than 23 hours is
      dropped unsent; NTF-006 fixes the store and its functions
    never: the inbound body, the sender profile name or the number in logs, audit, events or any row other than the
      sealed number until the attempt
  receipts:
    whatsapp: receiveMetaWhatsAppWebhook statuses - delivered sets DELIVERED and delivered_at; failed sets FAILED with
      the code of the existing classifier (131026 is MESSAGING_RECIPIENT_UNDELIVERABLE); sent and read are ignored (data
      minimization); recipient_id, contacts, conversation and pricing data are never stored or logged
    email: receiveAcsEmailEvents, Microsoft.Communication.EmailDeliveryReportReceived - Delivered sets DELIVERED;
      Failed, Bounced, Suppressed and FilteredSpam set FAILED with a closed MessagingResultCodes code
    function: security.record_messaging_receipt, SECURITY DEFINER owned by paqueteria_notification_receipt_executor
      (AI-18, NTF-006) and executable only by paqueteria_app; it crosses tenants because a webhook carries none;
      transitions only move forward (SENT to DELIVERED or FAILED); a repeated receipt changes nothing; a provider
      reference that matches nothing, a receipt that arrives before its send was settled included, is ignored; each
      change writes one status event and one notifications.status-changed row
    meaning: until receipts exist, SENT means provider acceptance only
  dispatcher_view:
    list: listOrderRecipientNotices - notice, channel, status, attempts, last code and times; never the recipient, the
      link or a template parameter
    stop: stopOrderRecipientNotices records the opt-outs of the contact of that order (opt_out.dispatcher)
    realtime: NotificationStatusChanged v2 (AI-12 decided amendment) carries order_id and notice, and the order detail
      reloads its panel (AI-07 /ops/orders/:id recipient_notices)
    roles: DISPATCHER members, and PLATFORM_ADMIN members with a satisfied MFA challenge, of the owner organization only
      (the tracking_link_operations rule); an operator organization gets the uniform 404
  webhooks:
    whatsapp: GET and POST /api/v1/messaging/whatsapp/webhook - the verification answers hub.challenge only for
      hub.mode subscribe and a hub.verify_token equal, in constant time, to its Key Vault secret; every POST needs a
      valid X-Hub-Signature-256 (HMAC-SHA256 of the raw body under the Meta app secret from Key Vault) compared in
      constant time before the body is parsed; the body size is bounded
    email: POST /api/v1/messaging/email/events - the Event Grid subscription validation handshake, then authenticated
      deliveries only (Microsoft Entra protected delivery or a Key Vault secret header, chosen and recorded by NTF-006)
    unsubscribe: POST /api/v1/recipient-notices/unsubscribe/{unsubscribeToken} - the token binds the owner organization and the
      notification id under HMAC-SHA256 (contact lookup key, prefix paquetenvia-unsubscribe-v1), checked in constant
      time and never stored or logged; a GET never opts out, so link scanners cannot
    common: anonymous (no session, cookie or CSRF), rate limited under SEC-004 (their budgets are an owner decision
      asked in NTF-006, like the SEC-004 numbers), inert (uniform 404) while their switch is off, problem+json errors
      that never echo a value
  switches:
    enabled: Notifications:RecipientNotices:Enabled (Worker), false by default; while false each request row ends
      PROCESSED with RECIPIENT_NOTICES_DISABLED at once - no Notification, no decryption and no backlog when it is
      turned on (orders confirmed before that get no link message)
    providers: Messaging:WhatsApp:Provider and Messaging:Email:Provider stay Disabled
    gate_decisions: a real provider for recipient notices is refused at start unless
      Notifications:RecipientNotices:Gate004DecisionId and Gate007DecisionId name the decision-log rows that resolve
      GATE-004 and GATE-007 (the Voice:Twilio:Gate007DecisionId pattern); real providers are refused in Development,
      Testing and DEV_SYNTHETIC, and the synthetic ones are accepted only there
    webhooks: Messaging:WhatsApp:Webhook:Enabled and Messaging:Email:Events:Enabled, false by default (uniform 404)
    pilot: Notifications__RecipientNotices__ and Messaging__ become platform-managed in tools/azr-001/env001_pilot_guards.py
      (as Voice__, NTF-008); only the gate-closing change sets them
  pilot_wiring: NTF-008 - the Worker reads public-tracking-link-key, paquetenvia-contact-lookup-key-1 and the WhatsApp
    token and phone number id and may only unwrap with recipient-notice-kek; the API reads
    paquetenvia-contact-lookup-key-1, the Meta app secret and the webhook verify token and may only wrap with
    recipient-notice-kek; secret names, the ACS role of the Worker and the Event Grid subscription are fixed there
  logging: owner organization pseudonym, lane, channel, notice, outcome and code only (OBS-002 allowlist); never a
    phone, an e-mail, a name, a link, a token, a template parameter or a provider message
  rollback: Enabled false or a provider Disabled, no migration; rows already created then end FAILED with
    MESSAGING_CHANNEL_DISABLED and the dispatchers see them; a webhook switched off answers 404; every lane Down
    refuses while rows that need the new shape exist
