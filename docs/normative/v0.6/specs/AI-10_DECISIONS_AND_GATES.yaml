  - OrganizationRole and current parsers cannot represent CUSTOMER_SUPPORT
  authority_hierarchy:
  - AI-02 has higher authority than AI-07, AI-08, or Markdown documentation
  - AI-06 is the current canonical operational contract for persistable membership roles
  - the contradiction requires a project owner product decision
  - implementation must not resolve the contradiction silently
  work_allowed:
