meta:
  version: '0.6'
  status: NORMATIVE
conventions:
  ids: uuid
  money: integer cents MXN
  timestamps: timestamptz UTC
  timezone_display: America/Mazatlan
  tenant_context: X-Organization-Id validated against active membership; database settings are transaction-local
  audit: append-only
  pii: plaintext PII prohibited in JSON snapshots/logs/events
entities:
  Organization:
    required:
    - id
    - organization_type
    - legal_name
    - display_name
    - status
    statuses:
    - ACTIVE
    - PENDING_APPROVAL
    - SUSPENDED
    - CLOSED
    rules:
    - only ACTIVE organizations grant access (IDENTITY-ORG-ACTIVE-REQUIRED)
    - a self-registered ALLY is PENDING_APPROVAL until a PLATFORM_ADMIN approves it (ACTIVE) or rejects it (CLOSED); approval creates no ally relationship (REG-ALLY-APPROVAL-ACTIVATE-ONLY)
    - a self-registered BUSINESS is ACTIVE at creation
    - at most one self-created organization that is not CLOSED per person (REG-ONE-ORGANIZATION-PER-PERSON)
  User:
    required:
    - id
    - identity_subject
    - status
    rules:
    - no global authorization role
  OrganizationMembership:
    required:
    - id
    - user_id
    - organization_id
    - role
    - status
    rules:
    - unique active user/org/role
    - one optional active default membership
    - an administrator may add a person by email; the membership is created at that person's sign-in with the verified email (REG-JOIN-BY-ADMIN-EMAIL)
  PendingMembership:
    required:
    - id
    - organization_id
    - email_hmac
    - email_hmac_key_version
    - role
    - status
    - invited_by
    - created_at
    - expires_at
    statuses:
    - PENDING
    - ACCEPTED
    - REVOKED
    rules:
    - stores only a keyed HMAC of the normalized email (trim, NFC, invariant lowercase) and its key version, never the address (REG-PENDING-MEMBERSHIP-STORAGE)
    - added by an ACTIVE PLATFORM_ADMIN, ALLY_ADMIN or BUSINESS_ADMIN with MFA within the role ceiling (REG-JOIN-ADDERS-MFA, REG-ROLE-CEILING, REG-PLATFORM-ADMIN-ADDS)
    - PENDING expires seven days after creation or renewal; an expired entry stays inert until renewed (REG-PENDING-EXPIRY-7D, REG-PENDING-RENEW-ONLY)
    - at every sign-in with a verified email each PENDING, unexpired entry of an ACTIVE organization becomes a membership of the ACTIVE user exactly once and turns ACCEPTED (REG-ACCEPT-ALL-ORGANIZATIONS)
    - an identical ACTIVE or SUSPENDED membership consumes the entry without a duplicate and without reactivation
    - a DRIVER membership grants nothing operational until its driver profile exists (REG-DRIVER-PROFILE-LATER)
  City:
    required:
    - id
    - country_code
    - state_code
    - name
    - timezone
  ServiceArea:
    required:
    - id
    - owner_org_id
    - city_id
    - polygon
    - status
  OperatingZone:
    required:
    - id
    - owner_org_id
    - service_area_id
    - zone_type
    - polygon
  Location:
    required:
    - id
    - owner_org_id
    - city_id
    - point
    - address_ciphertext
    - address_summary
    - pii_key_version
    sensitive:
    - address
    - contact_name
    - phone
  TariffRule:
    required:
    - id
    - owner_org_id
    - city_id
    - pricing_tier
    - service_type
    - amount_cents
    - tax_mode
    - active_from
    - status
    - policy_version
    rules:
    - policy_version is the version of the owning organization's pricing policy; each organization raises it when it changes its tariffs (PRC-POLICY-VERSION-PER-ORG)
    - policy_version matches ^[A-Za-z0-9._-]{1,64}$
    - there is no global pricing policy version
  Quote:
    required:
    - id
    - owner_org_id
    - city_id
    - origin_location_id
    - destination_location_id
    - service_type
    - pricing_tier
    - request_snapshot_redacted
    - package_snapshot
    - total_cents
    - minimum_total_cents_snapshot
    - pricing_policy_version
    - status
    - expires_at
    rules:
    - single-use through UNIQUE orders.quote_id
    - snapshot redacted contains no plaintext PII
    - pricing_policy_version is frozen from the policy_version of the selected tariff rule (PRC-POLICY-VERSION-PER-ORG)
  Order:
    required:
    - id
    - public_id
    - quote_id
    - owner_org_id
    - city_id
    - status
    - pricing_tier
    - total_cents
    - version
    versioned: true
    rules:
    - commercial ownership never changes silently
    - CLOSED becomes final when claim window expires
    - pricing_policy_version is copied unchanged from the quote
  DriverPosition:
    required:
    - id
    - driver_id
    - org_id
    - city_id
    - client_event_id
    - point
    - captured_at
    rules:
    - deduplicate by driver/client_event
    - retention governed by GATE-007
  ProofUploadSession:
    required:
    - id
    - order_id
    - object_key_quarantine
    - status
    - expires_at
    mutable: true
  Proof:
    required:
    - id
    - order_id
    - upload_session_id
    - proof_type
    - object_key
    - sha256
    - captured_at
    immutable: true
  OrderEvent:
    required:
    - id
    - order_id
    - owner_org_id
    - event_type
    - aggregate_version
    - occurred_at
    immutable: true
    optional:
    - public_event_code
    rules:
    - private by default when public_event_code is null
    - public projection exposes code/time only and never raw payload
  OutboxEvent:
    required:
    - id
    - owner_org_id
    - tenant_context
    - topic
    - payload
    - status
    - attempts
    - available_at
    - created_at
    rules:
    - content immutable after insert
    - claim assigns lease_token and lease_expires_at
    - settle requires matching lease_token and PROCESSING state
    - runtime roles have no direct SELECT/UPDATE/DELETE
    - application supplies all insert values and uses no RETURNING
  LocationOutboxEvent:
    required:
    - id
    - owner_org_id
    - driver_position_id
    - payload
    - status
    - attempts
    - available_at
    - created_at
    rules:
    - driver_position_id is unique but has no foreign key
    - separate low-priority consumer and lag metric
    - same lease-protected lifecycle as business outbox
    - global uniqueness strategy must be revisited before partitioning this lane
  CodTransaction:
    required:
    - id
    - order_id
    - amount_cents
    - status
    rules:
    - RECORDED before delivery if COD expected
    - RECONCILED before CLOSED
  SettlementLine:
    required:
    - id
    - settlement_id
    - line_type
    - amount_cents
    - source_reference
    immutable: true
  OrderAcceptance:
    required:
    - id
    - order_id
    - quote_id
    - owner_org_id
    - terms_version
    - privacy_version
    - accepted_at_client
    - recorded_at_server
    - acceptance_channel
    - evidence_schema_version
    - evidence_hash
    immutable: true
    rules:
    - one acceptance per order
    - evidence_hash is SHA-256 over OrderAcceptanceCanonicalForm v1 UTF-8 bytes
    - created inside quote_snapshot_to_order transaction
    - IP and user-agent are prohibited until GATE-007 approval
order_state_machine:
  initial: DRAFT
  statuses:
  - DRAFT
  - CONFIRMED
  - READY_FOR_PICKUP
  - ASSIGNED
  - AT_PICKUP
  - PICKED_UP
  - IN_TRANSIT
  - DELIVERING
  - FAILED_ATTEMPT
  - RESCHEDULED
  - RETURNING
  - RETURNED
  - DELIVERED
  - CLOSED
  - CLAIM_OPEN
  - CLAIM_RESOLVED
  - CANCELLED
  terminal_immediate:
  - RETURNED
  - CLAIM_RESOLVED
  - CANCELLED
  terminal_after_time:
  - state: CLOSED
    condition: now >= claim_window_ends_at and finalized_at is set
  transitions:
    DRAFT:
    - CONFIRMED
    - CANCELLED
    CONFIRMED:
    - READY_FOR_PICKUP
    - CANCELLED
    READY_FOR_PICKUP:
    - ASSIGNED
    - CANCELLED
    ASSIGNED:
    - AT_PICKUP
    - READY_FOR_PICKUP
    - CANCELLED
    AT_PICKUP:
    - PICKED_UP
    - FAILED_ATTEMPT
    - CANCELLED
    PICKED_UP:
    - IN_TRANSIT
    - RETURNING
    IN_TRANSIT:
    - DELIVERING
    - FAILED_ATTEMPT
    - RETURNING
    DELIVERING:
    - DELIVERED
    - FAILED_ATTEMPT
    FAILED_ATTEMPT:
    - RESCHEDULED
    - RETURNING
    - DELIVERING
    RESCHEDULED:
    - READY_FOR_PICKUP
    - ASSIGNED
    RETURNING:
    - RETURNED
    DELIVERED:
    - CLOSED
    - CLAIM_OPEN
    CLOSED:
    - CLAIM_OPEN
    CLAIM_OPEN:
    - CLAIM_RESOLVED
  guards:
    CONFIRMED:
    - valid_active_quote
    - payer_acceptance
    - restricted_goods_check
    ASSIGNED:
    - eligible_driver
    - capacity_available
    - assignment_cost_present
    PICKED_UP:
    - pickup_proof_complete
    DELIVERED:
    - delivery_proof_complete
    - if_cod_expected_then_cod_status_recorded_or_reconciled
    CLOSED:
    - no_unresolved_incident
    - if_cod_expected_then_cod_status_reconciled
    - financial_reconciliation_complete
    - claim_window_ends_at_set
    CLAIM_OPEN:
    - now_before_or_equal_claim_window_ends_at
    - claim_reason_present
    CANCELLED:
    - cancellation_reason_present
    - if_from_at_pickup_then_custody_not_acquired
    FAILED_ATTEMPT:
    - attempt_stage_recorded
    - custody_acquired_recorded
    RETURNING:
    - custody_acquired_true
    - failed_attempt_next_action_respected
    RESCHEDULED:
    - failed_attempt_next_action_respected
    DELIVERING:
    - if_from_failed_attempt_then_custody_acquired_true_and_valid_assignment
    - failed_attempt_next_action_respected
  prohibited:
  - FAILED_ATTEMPT -> DELIVERED
  - 'RESCHEDULED -> DELIVERING (D8-RESCHEDULED-NO-DIRECT-DELIVERY: a rescheduled order goes through a new assignment, RESCHEDULED -> ASSIGNED -> ... -> DELIVERING)'
  - CLAIM_OPEN after claim_window_ends_at
  - custody_acquired derived from anything other than a PICKED_UP ORDER_STATUS_CHANGED event
  - PICKED_UP or DELIVERED justified by a proof created before the latest entry into AT_PICKUP or DELIVERING, or by a proof referenced as incident evidence
  - FAILED_ATTEMPT justified by an incident already referenced by an earlier FAILED_ATTEMPT
  - leaving FAILED_ATTEMPT to a successor other than the one the justifying incident next_action allows
  guard_semantics:
    decision: ORD-002-ATTEMPT-RULES-2026-09-27
    current_attempt: The current attempt starts at the latest ORDER_STATUS_CHANGED event into the capture state (AT_PICKUP for pickup, DELIVERING for delivery). No attempt_id column exists; the boundary is derived from the order history (ORD-002-ATTEMPT-BOUNDARY).
    custody_acquired: True only when the order history holds a PICKED_UP ORDER_STATUS_CHANGED event. A pickup photo or incident evidence alone never establishes custody.
    pickup_proof_complete: Requires a PICKUP_PHOTO proof of the current attempt that is not referenced as incident evidence.
    delivery_proof_complete: Requires a DELIVERY_PHOTO proof of the current attempt that is not referenced as incident evidence.
    attempt_stage_recorded: The FAILED_ATTEMPT is justified by exactly one incident opened in the current attempt and not referenced by an earlier FAILED_ATTEMPT.
    eligible_driver: Evaluated with the shared DriverEligibilityPolicy (documents, zone, membership) on ASSIGNED and on the immediate retry from FAILED_ATTEMPT to DELIVERING, which keeps the active assignment (D8-RESCHEDULED-NO-DIRECT-DELIVERY).
    capacity_available: Evaluated with the same DriverEligibilityPolicy capacity rules (vehicle capacity against the order packages) on the same transitions.
    failed_attempt_next_action_respected: When leaving FAILED_ATTEMPT, the justifying incident next_action decides the successor. RETURNING allows only RETURNING. RESCHEDULED allows only RESCHEDULED or DELIVERING (the immediate FAILED_ATTEMPT -> DELIVERING retry; RESCHEDULED -> DELIVERING does not exist, D8-RESCHEDULED-NO-DIRECT-DELIVERY). Incidents adopted by the INC-001 backfill carry a default next_action and do not bind the successor; every other guard of the target still applies.
decided_pending_translation:
  status: DECIDED_2026-09-26_27_TRANSLATION_PENDING
  source: decision-log D8-REASSIGNMENT-NEW-ASSIGNMENT (working session with the project owner via Claude Code)
  reassignment:
  - when an order is rescheduled, its previous assignment is closed as CANCELLED
  - reassignment always creates a new assignment through DSP-002 or a new external offer; the previous assignment is never
    reused
  note: the guards above do not encode this rule yet; the implementing task adds the guard and its tests
  covers: RESCHEDULED -> ASSIGNED without passing through READY_FOR_PICKUP (reported by PR 90)
  attempt_and_custody_amendments: decided by the project owner on 2026-09-27 and recorded by PR 91 in the guards,
    prohibited and guard_semantics above (ORD-002-ATTEMPT-RULES-2026-09-27, ORD-002-ATTEMPT-BOUNDARY)
authorization_invariants:
- 401 when no valid authentication token exists
- 403 when an authenticated actor can see the tenant resource but lacks a capability
- 404 when resource is absent, belongs to another tenant, or public tracking token is invalid/expired/revoked
- 404 bodies and timing must not reveal foreign-resource existence
- bootstrap functions are the only pre-tenant database access path
- server derives SignalR groups; clients cannot select arbitrary tenant groups
- all tenant EF queries execute inside an explicit transaction with set_config(..., true)
- queries outside transaction fail closed and raise an architectural diagnostic in development/test
pricing_invariants:
- Pricing.Domain is authoritative for pricing_tier and minimum_total_cents_snapshot
- SQL checks are coherence backstops, not proof that tier selection was correct
- BUSINESS_200_499 and BUSINESS_500_PLUS require consolidated_route or valid financial_override
- total_cents must be >= minimum_total_cents_snapshot unless override
- GATE-011 determines tax calculation but cannot change the frozen minimum snapshot retroactively
- GATE-011-VAT-INCLUDED-2026-09-29 (resolved) prices are VAT_INCLUDED for every organization; the tariff amount is the
  total, subtotal = floor((100 * total + 58) / 116), tax = total - subtotal (integer cents); minimum_total_cents_snapshot
  is the VAT-included total; existing quotes and orders keep their frozen amounts
transaction_coordinator_allowlist:
- quote_snapshot_to_order
- assignment_to_order_status_event
- proof_custody_to_order_transition
- cod_reconciliation_to_close
- external_offer_acceptance_to_assignment
privacy_invariants:
- request_snapshot_redacted contains no plaintext address/contact/phone/access notes
- driver location is worker personal data and is included in GATE-007 retention/ARCO
- proof and audit records are append-only; privacy actions use access restriction, pseudonymization or cryptographic erasure
  under approved policy
outbox_invariants:
- financial/custody/order events use platform.outbox_events with priority
- GPS uses platform.location_outbox_events and may publish only significant/throttled positions
- Worker credential is NOBYPASSRLS and mutates lifecycle only through SECURITY DEFINER functions
- claim assigns lease_token; settle rejects stale or mismatched leases
- stale PROCESSING is requeued; max-attempt poison messages become DEAD
- purge is owned by paqueteria_maintenance and can delete only old PROCESSED/DEAD rows
- runtime producers provide all inserted values and emit no INSERT RETURNING
public_tracking_contract:
  public_statuses:
  - CREATED
  - SCHEDULED
  - IN_TRANSIT
  - OUT_FOR_DELIVERY
  - DELIVERY_EXCEPTION
  - DELIVERED
  - RETURNING
  - RETURNED
  - CANCELLED
  internal_to_public:
    DRAFT: CREATED
    CONFIRMED: CREATED
    READY_FOR_PICKUP: SCHEDULED
    ASSIGNED: SCHEDULED
    AT_PICKUP: SCHEDULED
    PICKED_UP: IN_TRANSIT
    IN_TRANSIT: IN_TRANSIT
    DELIVERING: OUT_FOR_DELIVERY
    FAILED_ATTEMPT: DELIVERY_EXCEPTION
    RESCHEDULED: SCHEDULED
    RETURNING: RETURNING
    RETURNED: RETURNED
    DELIVERED: DELIVERED
    CLOSED: DELIVERED
    CLAIM_OPEN: DELIVERED
    CLAIM_RESOLVED: DELIVERED
    CANCELLED: CANCELLED
  public_event_codes:
  - ORDER_CREATED
  - PICKUP_SCHEDULED
  - PICKED_UP
  - IN_TRANSIT
  - OUT_FOR_DELIVERY
  - DELIVERY_ATTEMPTED
  - RESCHEDULED
  - DELIVERED
  - RETURNING
  - RETURNED
  - CANCELLED
  rules:
  - new order event types remain private unless domain explicitly assigns public_event_code
  - SQL projection returns no public result when internal state has no mapping
  - C# mapping throws PublicStatusMappingException on missing mapping and emits operational alert
  - CI contract test compares SQL and C# outputs for exactly all 17 internal states
token_hash_contract:
  token_entropy: 32 bytes; since TRK-002-AUTO-LINK the HMAC-SHA256 output over the versioned canonical input under
    a Key Vault key (AI-24 tracking_token.derivation); tokens issued before it were 32 cryptographically random bytes
  link_lifetime: AI-24 public_tracking.link_lifetime - valid while the order is in progress (RESCHEDULED included) and
    for 24 hours after its first DELIVERED, RETURNED or CANCELLED public event; no new link for an order in a final
    public status; a revoked generation never comes back
  token_encoding: Base64URL without padding
  hash_algorithm: SHA-256
  hash_input: exact UTF-8 bytes of the encoded token, without trim or normalization
  hash_storage: 32-byte bytea
  sql_expression: extensions.digest(pg_catalog.convert_to(p_token,'UTF8'),'sha256')
  contract_test: C# SHA256.HashData and PostgreSQL digest produce identical bytes for fixed vectors
legal_acceptance_invariants:
- canonical form is fixed-order compact JSON specific to order-acceptance-v1, not general JCS
- UTF-8 without BOM; UUID D lowercase; UTC timestamp yyyy-MM-ddTHH:mm:ss.fffffffZ; channel uppercase
- canonical key order is schema_version, order_id, quote_id, owner_org_id, actor_id, terms_version, privacy_version, accepted_at_client,
  acceptance_channel
- hash vectors are permanent compatibility fixtures
- order_acceptances is RLS protected and append-only
provisioning_invariants:
- bootstrap functions never write
- new user and organization UUIDs are generated by the application
- new identifiers are added to transaction-local RLS context only for the provisioning transaction
- identity_subject must match the validated OIDC principal
- organization, initial membership and audit are atomic
money_invariants:
- all money is signed 64-bit integer cents in persistence and int64 in API contracts
- currency is explicit and currently constrained to MXN
- no floating point arithmetic is allowed for money
