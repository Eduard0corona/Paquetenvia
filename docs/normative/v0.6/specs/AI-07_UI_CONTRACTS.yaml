principles:
- mobile first
- Spanish Mexico
- keyboard accessible critical flows
- never rely on color alone
- show price breakdown before confirmation
- mask sensitive information by role
routes:
  /login:
    roles:
    - anonymous
    release: MVP-0
    # GATE-002-BFF-001: sign-in entry point, reachable without a session; it starts
    # GET /auth/login (AI-05). Registration is open (AUTH-OPEN-REGISTRATION): the first
    # sign-in creates the user with no organization; a signed-in session without
    # organization contexts is offered /onboarding. ?error=access_denied shows "Tu cuenta
    # no tiene acceso a Paquetenvia; pídelo a un administrador"; ?error=email_not_verified
    # shows "Verifica tu correo en AuthCenter y vuelve a iniciar sesión"
    # (AUTH-EMAIL-VERIFIED-REQUIRED); any other error shows the generic message
    # (AUTH-001-ACCESS-DENIED-MESSAGE). ?mfa=required offers "Verificar identidad"
    # (GET /auth/login?mfa=required) to a signed-in session without MFA
    # (AUTH-001-MFA-STEP-UP). Logout navigates to the AuthCenter end-session URL, which
    # returns here (AUTH-001-RP-INITIATED-LOGOUT).
    decisions:
    - GATE-002-BFF-001
    - AUTH-OPEN-REGISTRATION
    - AUTH-EMAIL-VERIFIED-REQUIRED
    - AUTH-001-RP-INITIATED-LOGOUT
    - AUTH-001-MFA-STEP-UP
    - AUTH-001-ACCESS-DENIED-MESSAGE
  /onboarding:
    roles:
    - authenticated_without_organization
    release: MVP-0
    # REG-SELF-SERVICE-ORGANIZATION: a signed-in user creates a business (active at once) or
    # registers an ally (pending PLATFORM_ADMIN approval) through POST /onboarding/organizations,
    # and sees its own applications and their status (GET /me/organization-applications,
    # REG-OWN-APPLICATIONS-ENDPOINT). One self-created organization that is not CLOSED per person
    # (REG-ONE-ORGANIZATION-PER-PERSON): ORGANIZATION_LIMIT_REACHED explains it. Spanish copy.
    decisions:
    - AUTH-OPEN-REGISTRATION
    - REG-SELF-SERVICE-ORGANIZATION
    - REG-OWN-APPLICATIONS-ENDPOINT
    - REG-ONE-ORGANIZATION-PER-PERSON
  /ops/dashboard:
    roles:
    - platform_admin
    - dispatcher
    - customer_support
    release: MVP-0
    widgets:
    - orders_by_status
    - capacity_alerts
    - incidents
    - map_list_toggle
    # UI-PHASE2-QUEUE-COUNTS-2026-10-05 (project owner, 2026-10-05): the indicators and the status-group totals are the
    # real server counts, not the count of the loaded page; the cards stay the loaded page.
    queue_counts:
      decision: UI-PHASE2-QUEUE-COUNTS-2026-10-05
      source: GET /operations/queue-counts (getOperationsQueueCounts)
      roles: [DISPATCHER, PLATFORM_ADMIN with MFA]
      indicators:
      - Sin asignar (queues.unassigned)
      - Requiere atención (queues.needs_attention)
      - Revisar precio (queues.price_review)
      - Entregadas sin cerrar (queues.delivered_not_closed)
      - En ruta (queues.en_route)
      group_totals: each of the five UI-STATUS-GROUPS-2026-10-05 columns shows "N en total", the sum of by_status over
        the group, next to the number of cards loaded
      filters: the counts cover every order of the organization and never apply the dashboard filters; the screen
        says so
      refresh: fetched again whenever the dashboard list is fetched again (manual refresh, realtime event, reconnect,
        visibility, polling or filter change)
      failure: the indicators show "Sin dato" and the list keeps working; a response that breaks the contract is
        discarded
    # UI-PHASE3-INBOX-2026-10-10: shown as "Tablero" in the app shell, after Bandeja; DISPATCHER and PLATFORM_ADMIN
    # land on /ops/inbox instead, and /ops/dashboard?view=positions opens the positions view directly.
  # UI-PHASE3-INBOX-2026-10-10 (project owner, 2026-10-09, "avanza con la fase 3"): the dispatcher's work inbox
  # ("Bandeja de trabajo"), built only on existing operations; the backend and RLS remain the barrier.
  /ops/inbox:
    roles:
    - platform_admin
    - dispatcher
    release: MVP-1
    screen_contract: work_inbox
    decisions:
    - UI-PHASE3-INBOX-2026-10-10
  # UI-PHASE2-SEARCH-TRANSITIONS-2026-10-05: the app shell top bar offers "Buscar guía" to the roles that open the
  # order detail (DISPATCHER, PLATFORM_ADMIN with MFA). It searches only the exact tracking number through
  # GET /orders?public_id= (listOrders); a match opens /ops/orders/:id and anything else shows "No encontramos esa
  # guía", the same text for a malformed, missing or other-organization number. No personal data is searchable.
  # UI-PHASE3-ORDER-WIZARD-2026-10-10 (project owner, 2026-10-09 "avanza con la fase 3"; 2026-10-10 "Confirmada
  # (Recommended)"): "Nueva orden" is a four-step wizard that creates the order and then confirms it, so an order
  # captured here leaves the screen CONFIRMED; the backend and RLS remain the barrier.
  /ops/orders/new:
    roles:
    - platform_admin
    - dispatcher
    release: MVP-0
    screen_contract: create_order
    decisions:
    - UI-PHASE3-ORDER-WIZARD-2026-10-10
    steps:
    - where ("1. Dónde") - origin and destination
    - what ("2. Qué se envía") - packages
    - service_and_price ("3. Servicio y precio") - service type, consolidated route, optional delivery window, COD,
      client account and the quote
    - confirm ("4. Confirmar") - who pays and the acceptance; creates the order and confirms it
  /ops/orders/:id:
    roles:
    - authorized
    release: MVP-0
    sections:
    - summary
    - timeline
    - assignment
    - proofs
    - incidents
    - price_audit
    # UI-PHASE2-DRIVER-PICKER-2026-10-05 (project owner, 2026-10-05): the dispatcher assigns an OWN driver from a
    # list, never by typing an id; the backend and RLS remain the barrier and REST is the source of truth.
    assignment_picker:
      decision: UI-PHASE2-DRIVER-PICKER-2026-10-05
      sources:
        list: GET /orders/{orderId}/assignable-drivers (listAssignableDrivers)
        assign: POST /orders/{orderId}/assignments (assignDriver, assignment_type OWN, route_id null)
      roles: [DISPATCHER, PLATFORM_ADMIN with MFA]
      shown_when: the order is READY_FOR_PICKUP or RESCHEDULED without an ACCEPTED or ACTIVE assignment
      display:
      - each driver by its DRV- reference, vehicle and current ACCEPTED or ACTIVE assignments; no name, phone or id
      - ineligible drivers stay visible but cannot be picked, with the reason in Spanish
      - when no driver is eligible, "Publicar oferta externa desde el tablero" is the alternative
      input: assignment cost in MXN, parsed to integer cents (int64) without floating point
      confirmation: required; names the driver reference and the cost
      idempotency: one Idempotency-Key per confirmed assignment, reused for a retry of the same payload
      recovery: after success or a conflict the order and the list are fetched again; optimistic UI is never
        authoritative
    # UI-PHASE2-SEARCH-TRANSITIONS-2026-10-05 (project owner, 2026-10-05): "Siguiente paso" shows only the actions
    # valid now, as the server computes them; the UI never duplicates the AI-04 state machine.
    next_step:
      decision: UI-PHASE2-SEARCH-TRANSITIONS-2026-10-05
      sources:
        allowed: GET /orders/{orderId} (getOrder, OrderDetail.allowed_transitions)
        transition: POST /orders/{orderId}/transitions (transitionOrder)
      display:
      - one button per allowed transition the screen supports, never a disabled placeholder; no allowed transition
        shows no button
      - es-MX labels - CONFIRMED "Confirmar orden", READY_FOR_PICKUP "Liberar para recolección", CLOSED "Cerrar
        orden", CANCELLED "Cancelar orden" (danger style)
      # UI-NEXT-STEP-RETURNS-CLAIMS-2026-10-09 (project owner, 2026-10-09): reschedules, returns and claims are offered
      # too, still only when allowed_transitions lists them; the reason of CLAIM_OPEN and CLAIM_RESOLVED is the
      # claim (resolution) reason their guards require.
      - es-MX labels - RESCHEDULED "Reprogramar entrega", RETURNING "Iniciar devolución", RETURNED "Marcar como
        devuelta", CLAIM_OPEN "Abrir reclamación", CLAIM_RESOLVED "Resolver reclamación"
      - transitions the screen does not offer here are not shown - ASSIGNED (assignment picker), FAILED_ATTEMPT
        (needs incident_id, recorded from Incidencias) and the driver steps AT_PICKUP, PICKED_UP, IN_TRANSIT,
        DELIVERING and DELIVERED
      input: reason (required, at most 500 characters); for required_metadata restricted_goods_acknowledged a
        required checkbox sends the JSON literal true
      confirmation: required (ConfirmDialog) naming the order and the action
      idempotency: one Idempotency-Key per confirmed transition, reused for a retry of the same payload after a network
        or server failure; expected_version is the version just read
      recovery: after the answer the order is fetched again; a 409 shows "No se pudo cambiar el estado; la orden cambió
        o falta un requisito. Actualiza e intenta de nuevo."
      # ORD-002-GUARD-CODES-2026-10-05 (project owner, 2026-10-05): a 409 carrying a TransitionConflictProblem rule code
      # says what is missing instead, in es-MX, from one helper; an absent or unknown code keeps the message above.
      rejection_messages:
        decision: ORD-002-GUARD-CODES-2026-10-05
        source: transitionOrder 409 TransitionConflictProblem.code
        display:
        - one es-MX sentence per AI-05 rule code (for example PICKUP_PROOF_REQUIRED "Falta la foto de recolección.",
          COD_NOT_RECONCILED "El cobro contra entrega aún no está conciliado."); never server text, identifiers or
          personal data
        - an absent, malformed or unknown code shows the generic 409 message
        - the order is still fetched again after the answer; the code never changes the offered actions by itself
  /ops/routes:
    roles:
    - platform_admin
    - dispatcher
    - customer_support
    mutation_roles:
    - dispatcher
    - platform_admin
    mutation_requirements:
      platform_admin: existing MFA policy applies
    read_only_roles:
    - customer_support
    release: MVP-1
  /driver/stops:
    roles:
    - own_driver
    - external_driver
    release: MVP-0
    offline: true
  /driver/stops/:id:
    roles:
    - assigned_driver
    release: MVP-0
    actions:
    - check_in
    - pickup_proof
    - start_transit
    - delivery_proof
    - fail_attempt
    - incident
  /track/:token:
    roles:
    - public
    release: MVP-0
    data_minimization: true
  /business/orders:
    roles:
    - business_admin
    - business_operator
    release: MVP-2
  /ally/network:
    roles:
    - ally_admin
    - ally_dispatcher
    release: MVP-3
  /finance/settlements:
    roles:
    - finance
    - platform_admin
    release: MVP-1
  # UI-001-SCREENS-CSV-INC-COD (project owner, 2026-09-28): CSV import, incident and COD
  # screens built only on existing AI-05 operations; D5-CAPABILITY-MATRIX and the MFA
  # step-up still apply and the backend remains the authorization barrier.
  /ops/orders/import:
    roles:
    - platform_admin
    - dispatcher
    release: MVP-1
    screen_contract: csv_order_import
    decisions:
    - UI-001-SCREENS-CSV-INC-COD
  /ops/incidents:
    roles:
    - platform_admin
    - dispatcher
    mutation_requirements:
      platform_admin: existing MFA policy applies
    release: MVP-1
    screen_contract: incident_desk
    decisions:
    - UI-001-SCREENS-CSV-INC-COD
  /finance/cod:
    roles:
    - dispatcher
    - platform_admin
    - finance
    mutation_requirements:
      platform_admin: existing MFA policy applies
      finance: FINANCE-COD-MFA-2026-09-27 applies to every read and reconciliation
    release: MVP-1
    screen_contract: cod_control
    decisions:
    - UI-001-SCREENS-CSV-INC-COD
    - FINANCE-COD-RECONCILIATION
    - FINANCE-COD-MFA-2026-09-27
screen_contracts:
  dispatch_dashboard:
    must_show:
    - public_id
    - owner_brand
    - visible_status
    - pickup_window
    - delivery_window
    - zone
    - assignment_type
    - driver
    - cost_warning
    filters:
    - status
    - zone
    - client
    - owner_org
    - operator_org
    - service_type
    - date
    actions:
    - open_order
    - assign_own
    - publish_external_offer
    - add_to_route
    - open_incident
    forbidden:
    - show another ally private tariff
    - bulk status change without preview
    add_to_route_contract:
      authority: POST /routes/{routeId}/stops
      assignment_scope: existing OWN assignment only
      navigation: /ops/routes
      optimistic_ui_as_authority: forbidden
  work_inbox:
    release: MVP-1
    route: /ops/inbox
    decision: UI-PHASE3-INBOX-2026-10-10
    decision_amendment: UI-PHASE3-INBOX-TOTAL-2026-10-10
    authority: REST API + PostgreSQL
    sources:
      counts: GET /operations/queue-counts (getOperationsQueueCounts)
      list: GET /operations/dashboard (OBS-001 read model, ADR-OBS-001, not declared in AI-05) with its existing
        filters only - unassigned, status, service_type, delivery_zone_id and cursor
      assign: the /ops/orders/:id assignment_picker sources (listAssignableDrivers, assignDriver)
    roles: [DISPATCHER, PLATFORM_ADMIN with MFA]
    excluded_roles: VIEWER and every other role, exactly as for the operations dashboard and the queue counts; the
      shell does not offer the inbox to them and the API answers 403
    landing: DISPATCHER and PLATFORM_ADMIN land on /ops/inbox after login and after an organization switch away from a
      page their role cannot use; FINANCE (/finance/cod), DRIVER (/driver/stops) and every other role (/ops/dashboard)
      keep their landing
    navigation: the shell lists Bandeja (/ops/inbox) first, then Tablero (/ops/dashboard), + Nueva orden, Rutas,
      Incidencias, Importar CSV and the finance items the role holds; the order detail belongs to Bandeja
    queues:
    - Sin asignar (queues.unassigned) - dashboard unassigned=true
    - Requiere atención (queues.needs_attention) - FAILED_ATTEMPT, RESCHEDULED, RETURNING and CLAIM_OPEN, one dashboard
      query per status
    - Precio por revisar (queues.price_review) - count only, with a note that its list comes later and that the count
      includes finished orders
    - Entregadas sin cerrar (queues.delivered_not_closed) - dashboard status=DELIVERED
    - En ruta (queues.en_route) - IN_TRANSIT and DELIVERING, one dashboard query per status
    counts: each queue shows its getOperationsQueueCounts value, which covers every order of the organization and never
      applies the chips (the screen says so); the queues show "Sin dato" when the counts fail and the list keeps working
    merge: the queries of one queue are merged newest first by updated_at and order id, the dashboard order; a row is
      shown only once every query that still has pages reached it, so "Cargar más" never places an older row above a
      shown one nor skips one
    filters: chips are server filters of the dashboard queries only - one status of a multi-status queue, service type
      and delivery zone (zones seen in the loaded rows); "Limpiar filtros" removes them; search stays the shell's
      "Buscar guía" (exact tracking number)
    url_state: queue, status, service_type and zone live in the /ops/inbox query; a row opens /ops/orders/:id carrying
      the view, and the detail offers "Volver a la bandeja" to that canonical inbox URL only
    table:
      columns:
      - Guía (public_id, link to the order)
      - Estado (exact AI-04 label with its status-group color; "Precio por revisar" when cost_warning is set)
      - Destino (delivery zone name; the read model carries no address and addresses stay out of lists)
      - Ventana de entrega (delivery_window in America/Mazatlan; "Horario de la zona" when absent)
      - Repartidor (DRV- reference)
      - Total ("Total (IVA incluido)"; the dashboard item total, the order total in integer MXN cents with IVA
        included, the same value and shape as AI-05 Order.total, shown with the shared MXN formatter and never as a
        floating-point value; UI-PHASE3-INBOX-TOTAL-2026-10-10)
      states: loading, empty per queue, error keeping the rows ("No fue posible actualizar la bandeja."), no session
        and access unavailable
    actions:
    - open_order (the guide, "Abrir" or a click on the row)
    - assign_own ("Asignar" only on rows with unassigned_alert, the /ops/orders/:id assignment_picker with the same
      list, integer cents and confirmation naming driver and cost; the inbox and its counts are read again afterwards)
    - open_positions ("Mapa de posiciones" opens /ops/dashboard in its positions view)
    recovery:
    - load, view change, refresh, assignment, realtime event (250 ms debounce), reconnect, visibility and 30 s polling
      read the REST queries and the counts again; a reconnect resynchronizes from that read
    - optimistic UI is never authoritative; a 401 or 403 clears the rows and stops the realtime hub
    privacy:
    - no browser persistence and no client logging; an organization switch clears rows, zones and counts
    - no internal identifier or personal data in the table; its only amount is the order total, never an assignment
      cost, margin, COD amount or tariff
    forbidden:
    - bulk status change without preview (this version offers no bulk action)
    - a queue, count or chip computed by filtering loaded rows
    not_supported:
    - Precio por revisar list - needs a server filter for cost_warning
    - bulk actions - a later change, always with a preview first
    - Órdenes and Repartidores menu items of the approved menu - no screen yet
  route_planner:
    release: MVP-1
    route: /ops/routes
    authority: REST API + PostgreSQL
    sources:
      list: GET /routes
      detail: GET /routes/{routeId}
      create: POST /routes
      add_order: POST /routes/{routeId}/stops
      remove_order: DELETE /routes/{routeId}/stops/{stopId}
      reorder: PUT /routes/{routeId}/stops/order
    mutation_roles:
    - dispatcher
    - platform_admin
    mutation_requirements:
      platform_admin: existing MFA policy applies
    read_only_roles:
    - customer_support
    must_support:
    - list routes
    - create route
    - open route detail
    - add order
    - remove order
    - show OWN driver
    - show scheduled date
    - show assignment cost total
    - show contiguous stop sequence
    - drag reorder
    - keyboard-accessible reorder alternative
    recovery:
    - load fetches the REST collection or detail
    - refresh fetches the REST collection or detail
    - reconnect fetches the current route detail
    - RouteChanged only triggers a REST refetch
    concurrency:
    - every mutation of an existing route sends the current expected_version
    - a version conflict discards speculative state and forces REST refetch
    - optimistic UI is never authoritative
    scope:
    - existing OWN assignments only
    - EXTERNAL routing is unavailable
    - ALLY_CAPACITY routing is unavailable
  create_order:
    # UI-PHASE3-ORDER-WIZARD-2026-10-10 (project owner, 2026-10-09 "avanza con la fase 3"; 2026-10-10, asked how the
    # order must end after the four steps, "Confirmada (Recommended)"): the wizard creates the order and confirms it
    # with the step 4 checkboxes, so it is ready to prepare. Every rule below still applies, step by step.
    wizard:
      decision: UI-PHASE3-ORDER-WIZARD-2026-10-10
      route: /ops/orders/new
      sources:
        quote: POST /quotes (createQuote)
        order: POST /orders (createOrder)
        confirm: POST /orders/{orderId}/transitions (transitionOrder), the same client as the order detail next_step
      steps:
      - Dónde - origin and destination; address (8 characters or more), contact, phone (10 Mexican digits, optional
        +52), latitude and longitude (shown to DISPATCHER and PLATFORM_ADMIN and still required by createQuote) and
        references; createQuote checks the Culiacán coverage
      - Qué se envía - 1 to 20 packages with description, weight in grams, declared value in MXN (integer cents) and
        optional measures in millimeters
      - Servicio y precio - service type, consolidated route, optional delivery window (America/Mazatlan, at most 12
        hours), COD in MXN (at most 20,000.00), client account id typed as before (no list operation exists) and
        "Calcular precio"; "Autorizar envío de bajo monto" with its required reason stays in this step for
        DISPATCHER and PLATFORM_ADMIN, and a total of 52 MXN or less, IVA included, without consolidated route or
        authorization does not leave it
      - Confirmar - only who pays and two required checkboxes - the customer saw the breakdown and accepted the terms
        and privacy notice in force (versions from configuration, never typed nor shown as codes) and the shipment
        holds no prohibited goods
      navigation: a stepper shows completed, current and pending steps; "Siguiente" validates only the current step
        and shows each message next to its field; "Atrás" and the completed steps of the stepper go back without
        losing data; a later step is never reached without validating the earlier ones
      summary: fixed beside the steps on wide screens and stacked on phones (after the fields, before them on the last
        step); it restates the capture and, once calculated, the price breakdown - net, IVA, total "IVA incluido" and
        the rule applied in words - so the breakdown is shown before confirmation
      price: dropped as soon as anything it was calculated from changes (addresses, packages, service type,
        consolidated route, client account, authorization); an expired or used price is dropped at "Siguiente" or
        on confirmation and calculated again
      submit: createOrder, then transitionOrder DRAFT -> CONFIRMED with reason "Confirmada al crear la orden",
        metadata restricted_goods_acknowledged true from the step 4 checkbox and expected_version of the created order
      idempotency: one Idempotency-Key per createOrder payload and one per confirmation, each reused for a retry after
        a network or server failure until a definitive answer; retrying the confirmation never sends createOrder again
      outcome:
      - confirmed - "Orden creada y confirmada" with the tracking number, the status the server returned and links to
        the order detail and to capture another order
      - confirmation refused - the order stays in DRAFT and the screen says so, with the ORD-002-GUARD-CODES-2026-10-05
        message (or the MFA step-up back to the order detail) and a link to the order detail, whose next_step confirms
        it; it never says the order was confirmed
      - no valid answer - the screen says it cannot tell whether the order was confirmed, offers to retry the
        confirmation (same key) after a network or server failure and links to the order detail
      - order refused (createOrder 409) - no order exists; the screen returns to "Servicio y precio" to calculate the
        price again
      mfa: PLATFORM_ADMIN confirms only with MFA (transitionOrder); the last step says so beforehand
      accessibility: es-MX copy without identifiers or internal codes, 44 px targets, keyboard operable, focus on the
        step title after a step change and on the first field with a message after a refused step, usable from 320 px
      privacy: the draft lives in memory only, is cleared on an organization switch and is never logged
      not_supported:
      - address book - createQuote cannot reference a saved location and listLocations returns no address text; it
        belongs to BUS-001 (MVP-2)
      - client account picker - there is no operation that lists client accounts
    validation:
    - Culiacán coverage
    - phone format
    - package limits
    - restricted goods acknowledgment
    - quote not expired
    price_display:
    - net
    - tax
    - recargos
    - total
    - rule explanation
    - totals labeled "IVA incluido" (GATE-011-VAT-INCLUDED-2026-09-29)
    low_price_guard: block confirmation at <=52 MXN total, IVA included, unless route flag or authorized override
      (GATE-011-VAT-INCLUDED-2026-09-29; compares the total the customer pays, never the pre-tax net); a quote whose
      low_price_authorization is present carries the authorized override and passes the guard
      (LOW-PRICE-MANUAL-AUTH-2026-10-02)
    low_price_authorization: LOW-PRICE-MANUAL-AUTH-2026-10-02 - the quote form offers "Autorizar envío de bajo monto"
      with a reason field (1 to 200 characters, no personal data) only to DISPATCHER and PLATFORM_ADMIN; the reason is
      sent as createQuote low_price_authorization, never on createOrder. The server stays the barrier (PLATFORM_ADMIN
      without MFA receives 403 MFA_REQUIRED and the screen offers step-up; an authorization the price does not need is
      409). The quote summary states that the shipment is authorized and until when, and the reason when the API
      returns it
    cod_expected: D6-COD-EXPECTED - optional COD amount typed in MXN with at most two decimals, converted to integer
      cents with integer arithmetic (never floating point) and sent as cod_expected_cents; empty means no COD; more
      than 20,000.00 MXN is refused with a message naming the cap before any request (COD-CAP-20000-2026-10-02)
    phone_and_restricted_goods: ORD-PROHIBITED-GOODS-PHONE-MX-2026-10-02 - each contact phone is 10 Mexican digits
      (spaces and hyphens removed; an optional leading +52 is removed too per ORD-PHONE-PLUS52-LOCATIONS-2026-10-03,
      any other prefix is refused) and is sent normalized; confirming requires ticking that the shipment holds
      no prohibited goods, sent as restricted_goods_acknowledged true and recorded on the order by the server
    service_window: ORD-SERVICE-WINDOW-OPTIONAL-2026-10-02 - optional delivery window (from and to) typed as wall-clock
      time in America/Mazatlan, converted with that zone (never the browser's) to instants sent as service_window;
      both empty means the zone's schedule applies; one bound alone, from not before to, a span over 12 hours or a
      window already over is refused before sending; the order view shows the window in Mazatlan time
  driver_stop:
    offline_cache:
    - assigned stop minimum data
    - pending events
    - pending proof metadata
    privacy:
    - masked phone or relay
    - no client account history
    completion: cannot complete without required POD unless supervisor override ID
    recipient_call: VOICE-001-MASKED-CALLS-2026-10-11 ("Sí, con número enmascarado") and
      VOICE-001-PROVIDER-TWILIO-2026-10-11 - the detail of a DELIVERY stop whose confirmed status is DELIVERING offers
      "Llamar al destinatario" only when getRecipientCallAvailability answers available true; it sends
      requestRecipientCall with a new Idempotency-Key (reused only to retry the same tap after a network failure) and
      shows "Te estamos llamando a tu celular…" for PLACED or REQUESTED and a retry hint for UNCONFIRMED; it is an
      online-only action - offline the button is shown disabled with "Necesitas conexión a internet para llamar" and
      the action is never queued, cached or replayed by the offline queue; the PWA never receives, shows or stores a
      phone number of the recipient (masked phone or relay); DRIVER_PHONE_REQUIRED points to "Cuenta"
  driver_account:
    route: /driver/stops (header "Cuenta")
    decision: VOICE-001-MASKED-CALLS-2026-10-11
    phone: shown only when getMyDriverPhone answers voice_calls_enabled true; the driver types their own mobile (ten
      Mexican digits, optional +52, spaces and hyphens) and must tick the consent text "Acepto que este número se use
      solo para conectar mis llamadas con los destinatarios de mis entregas. El destinatario nunca verá mi número y no
      se usará para nada más. Puedo cambiarlo o borrarlo cuando quiera." (consent_version VOICE-001-CONSENT-V1) before
      registerMyDriverPhone; the stored number is never displayed (only "Celular registrado" and the date); "Borrar mi
      celular" calls removeMyDriverPhone; online only, the field is cleared after saving and nothing is kept in browser
      storage
  external_driver_offers:
    release: MVP-1
    host_route: /driver/stops
    source: GET /driver/me/external-offers
    authority: REST API + PostgreSQL
    recovery:
    - initial load fetches the REST collection
    - refresh fetches the REST collection
    - reconnect fetches the REST collection
    - ExternalOfferChanged only triggers a REST refetch
    server_filters:
    - active tenant
    - authenticated driver without driver_id input
    - OPEN
    - not expired
    - currently eligible
    must_show_before_accept:
    - order_id
    - commission
    - expires_at
    accept:
      request: POST /external-offers/{offerId}/accept
      idempotency_key: required
    dismiss:
      label: No me interesa
      scope: local UI only
      durable: false
      server_request: none
      changes_offer_status: false
      affects_other_drivers: false
      may_reappear_after_reload_or_reconnect: true
      rejected_status_or_endpoint: forbidden
  public_tracking:
    show:
    - heading (no brand while GATE-001 is open, see branding)
    - public_id
    - simplified status
    - timeline
    - delivery window
    - support channel
    hide:
    - driver full name
    - driver phone
    - exact live location by default
    - internal cost
    - incident private notes
    public_statuses:
    - CREATED
    - SCHEDULED
    - IN_TRANSIT
    - OUT_FOR_DELIVERY
    - DELIVERY_EXCEPTION
    - DELIVERED
    - RETURNING
    - RETURNED
    - CANCELLED
    timeline_codes:
    - ORDER_CREATED
    - PICKUP_SCHEDULED
    - PICKED_UP
    - IN_TRANSIT
    - OUT_FOR_DELIVERY
    - DELIVERY_ATTEMPTED
    - RESCHEDULED
    - DELIVERED
    - RETURNING
    - RETURNED
    - CANCELLED
    fail_closed: invalid/expired/revoked token, cross-tenant reference or unmapped internal state all render the same not-found
      experience
    branding:
      decision: GATE-001-NEUTRAL-PUBLIC-BRAND-2026-10-10
      heading: Seguimiento de envío
      until: GATE-001 closes (the commercial name is validated before IMPI); GATE-001 stays open
      rules:
      - every state (loading, not found, unavailable, rate limited, tracking) opens with the heading and names no brand; the
        commercial name never appears in public tracking text, page title or metadata
      - the page title is the heading and the page links no PWA manifest; the not-found page a malformed tracking link
        reaches names no brand either. That page is the app's single shared not-found page, served for every unknown
        URL without a session (internal paths included), so it is a public surface and stays neutral; internal screens
        reached with a session keep the platform name
      - NEXT_PUBLIC_TRACKING_BRAND_NAME stays unset (no brand) and the web build refuses the unvalidated commercial name
      - messages to the recipient that carry the tracking link (TRK-002, GATE-004 templates) use the same neutral text and
        never name the commercial name
      - internal screens, login, onboarding and the driver PWA keep the platform name
      - the link host follows PILOT-DOMAIN-PRODUCTION and is not changed by this decision
      - 'support channel (GATE-001-TRACKING-SUPPORT-LINK-2026-10-11): no support link while GATE-001 is open;
        NEXT_PUBLIC_TRACKING_SUPPORT_URL stays empty, the page tells the recipient to reply through the channel the link
        came by, and the web build refuses a link that names the commercial name'
  csv_order_import:
    release: MVP-1
    route: /ops/orders/import
    decision: UI-001-SCREENS-CSV-INC-COD
    authority: REST API + PostgreSQL
    sources:
      preview: POST /orders/csv/preview (previewOrderCsv)
      commit: POST /orders/csv/commit (commitOrderCsv)
    roles:
      preview: [DISPATCHER, PLATFORM_ADMIN]
      commit: [DISPATCHER, PLATFORM_ADMIN]
    upload:
    - the file is sent only as the AI-05 multipart/form-data part file; the client never parses rows
    - the client refuses an empty file or one larger than 1 MiB before any request
    - the bytes previewed are kept in memory only and are the exact bytes committed
    - the multipart filename is a fixed neutral name, never the local file name
    - content_digest is echoed from the preview response, never computed or edited by the client
    states:
    - no_session
    - access_unavailable
    - file_selected
    - previewing
    - previewed_with_errors
    - previewed_valid
    - committing
    - committed
    validations:
    - commit is offered only when file_errors is empty, invalid_rows is 0 and valid_rows is at least 1
    - commit also requires the dispatcher to tick that no shipment in the file contains prohibited goods; it is sent as
      restricted_goods_acknowledged=true (ORD-PROHIBITED-GOODS-PHONE-MX-2026-10-02)
    - file_errors and per-row errors are shown by row_number, column and code in Spanish
    - a commit 422 replaces the preview with the returned per-row report and creates nothing
    - a commit response whose content_digest differs from the previewed one fails closed
    - per-row outcomes show CREATED with public_id or FAILED with error_code
    - each previewed row shows the server-reported cod_expected_cents (D6-COD-EXPECTED) as MXN, or no COD for 0
    - the format help states the COD cap of 20,000.00 MXN (2000000 cents) per row (COD-CAP-20000-2026-10-02)
    idempotency:
    - Idempotency-Key names the batch and is reused for a retry of the same content_digest after a network or 5xx failure
    - a new file or a definitive server answer drops the key
    - 409 IDEMPOTENCY_CONFLICT is explained; the client never generates a key for other content under the same batch
    privacy:
    - no browser persistence of the file, report or keys; a tenant switch clears all of them
    - no client logging of file contents or row values
  incident_desk:
    release: MVP-1
    route: /ops/incidents
    decision: UI-001-SCREENS-CSV-INC-COD
    decision_amendment: API-INC-LIST-PROOFS-2026-09-29
    authority: REST API + PostgreSQL
    sources:
      open: POST /orders/{orderId}/incidents (openIncident)
      resolve: POST /incidents/{incidentId}/resolution (resolveIncident)
      list: GET /incidents (listIncidents)
      read: GET /incidents/{incidentId} (getIncident)
      evidence: GET /orders/{orderId}/proofs (listOrderProofs)
    roles:
      open: [DISPATCHER, PLATFORM_ADMIN with MFA]
      resolve: [DISPATCHER, PLATFORM_ADMIN with MFA]
      list_and_read: [DISPATCHER, PLATFORM_ADMIN with MFA]
      note: DRIVER opens incidents from /driver/stops/:id and never resolves; this screen does not admit DRIVER
    states:
    - no_session
    - access_unavailable
    - ready
    - submitting
    - opened
    - resolved
    validations:
    - order id and incident id are canonical UUIDs
    - type matches ^[A-Z_]+$ with 1 to 64 characters
    - severity, reason_code and next_action come from the AI-05 enums
    - description has 1 to 2000 characters
    - occurred_at is captured in America/Mazatlan and sent as UTC; later than now plus 5 minutes or older than 72 hours
      is refused client-side, and the server remains authoritative for its configured window
    - evidence_proof_ids are 1 to 10 unique canonical UUIDs, picked from the listOrderProofs page of the order
    - the incident to resolve is picked from the pending incidents listIncidents returned
    - resolution outcome is RESOLVED or REJECTED and reason follows the AI-05 ResolveIncidentRequest pattern, sent
      exactly as typed
    display:
    - the incidents listIncidents returns for the active organization, newest first, filterable by status and order,
      with further pages loaded through next_cursor; an Incident returned by openIncident or resolveIncident replaces
      the listed one with the same id
    - status, severity, reason_code, next_action, custody_acquired, occurred_at and sla_due_at
    - proofs show proof_type and captured_at only; no image, download or signed URL is requested or rendered
    - description and resolution reason are never echoed back after submission
    idempotency:
    - each open and each resolution reuses its Idempotency-Key for a retry of the same payload after a network or 5xx
      failure
    not_supported:
    - viewing or downloading proof images; listOrderProofs returns metadata only
  cod_control:
    release: MVP-1
    route: /finance/cod
    decision: UI-001-SCREENS-CSV-INC-COD
    authority: REST API + PostgreSQL
    sources:
      read: GET /orders/{orderId}/financials (getOrderFinancials)
      record: POST /orders/{orderId}/cod-records (recordCodCollection)
      reconcile: POST /cod-records/{codId}/reconcile (reconcileCod)
      pending_list: GET /orders?cod_pending_reconciliation=true (listOrders, API-FIN-COD-VISIBILITY-2026-09-29,
        FIN-PENDING-COD-LIST-FINANCE-2026-10-02)
    roles:
      read: [DISPATCHER, PLATFORM_ADMIN with MFA, FINANCE with MFA]
      record: [DISPATCHER, PLATFORM_ADMIN with MFA]
      reconcile: [DISPATCHER, PLATFORM_ADMIN with MFA, FINANCE with MFA]
      pending_list: [DISPATCHER, PLATFORM_ADMIN with MFA, FINANCE with MFA]
      note: FINANCE never records a COD collection; DRIVER records from its own assignment, not from this screen;
        FINANCE sees the pending list (FIN-PENDING-COD-LIST-FINANCE-2026-10-02), the only listOrders call it may
        make, and a 403 MFA_REQUIRED on it offers the same MFA step-up as the other finance reads
    states:
    - no_session
    - access_unavailable
    - ready
    - loading_order
    - order_loaded
    - submitting
    money:
    - every amount is integer MXN cents from the API and typed amounts are parsed to integer cents without floating point
    - revenue, cost by modality, margin, margin basis points and the COD position are shown exactly as returned
    validations:
    - order id and COD record id are canonical UUIDs
    - record is offered only when the COD position expects a positive amount and no collection is recorded
    - the recorded amount must equal expected_cents exactly; reference has 1 to 200 characters without surrounding
      whitespace
    - reconcile is offered for a RECORDED collection whose id the screen received from recordCodCollection or from
      getOrderFinancials cod_record (API-FIN-COD-VISIBILITY-2026-09-29); the operator never types a COD record id
    - reconcile from the pending list first reads getOrderFinancials for that order and reconciles only the RECORDED
      cod_record it returns
    recovery:
    - load and refresh fetch getOrderFinancials
    - every successful or conflicting write refetches getOrderFinancials and the pending list; optimistic UI is never
      authoritative
    idempotency:
    - record and reconcile reuse their Idempotency-Key for a retry of the same payload after a network or 5xx failure
    privacy:
    - no browser persistence; a tenant switch clears the loaded order, COD records and keys
    - the COD reference is never echoed back after submission nor logged
    not_supported:
    - listing COD records across orders other than through the listOrders pending filter
prototype_file: prototype/index.html
meta:
  version: '0.6'
  status: NORMATIVE
global_rules:
- organization switcher uses /me/organization-contexts and sends X-Organization-Id
- 404 screen is identical for missing and cross-tenant resources
- POD offline queue stores upload metadata/idempotency key, never unencrypted PII in logs
driver_location:
  batch_size: 1-20
  response: per-item accepted/duplicate/rejected
  offline: retain until REST confirms each client_event_id
proof_flow:
- request signed upload session
- upload directly to object storage
- wait for READY/validation
- finalize proof metadata and transition
