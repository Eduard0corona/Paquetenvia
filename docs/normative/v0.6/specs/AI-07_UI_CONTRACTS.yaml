    focus: the focus never falls to the page body - Buscar guía keeps it (the search form is never remounted), Quitar
      búsqueda returns it to the guía field, and Cargar más keeps it while the page loads (aria-disabled) and hands it
      to the summary ("Se muestran N órdenes.") when the last page leaves no Cargar más
    order_contract: every web reader of the AI-05 Order (this list, Buscar guía, Rutas Agregar entrega, Cobro contra
