meta:
  version: '0.6'
  status: NORMATIVE
global_rules:
- organization switcher uses /me/organization-contexts and sends X-Organization-Id
- 404 screen is identical for missing and cross-tenant resources
- POD offline queue stores upload metadata/idempotency key, never unencrypted PII in logs
# SEC-004, the panel's answer to a 429 (phase 4 PR 3, panel part). Owner answers, literal in decision-log:
# SEC-004-HEAVY-ENDPOINT-MAPPING-2026-10-12 Q6 "Mensaje común con espera (Recommended)";
# SEC-004-RELOADS-AND-BULK-2026-10-13 Q9 "Espaciar recargas (Recommended)" and Q10 "Dejarlo en 60/min (Recommended)";
# SEC-004-PANEL-SCREENS-2026-10-13 Q11 "Reintenta sola", Q12 "1 segundo", Q13 "Mensaje común", Q14 "Se pausan", Q15 "La
# pide sola" and Q16 "Toda la pantalla" (each "(Recommended)"). Each screen's rate_limit entry says what applies there;
# the driver app and /auth/login answer a 429 as screen_contracts.driver_stop.rate_limit and the /login route say.
panel_rate_limit:
  decisions:
  - SEC-004-HEAVY-ENDPOINT-MAPPING-2026-10-12
  - SEC-004-RELOADS-AND-BULK-2026-10-13
  - SEC-004-PANEL-SCREENS-2026-10-13
  message: Demasiadas solicitudes. Espera N segundos e intenta de nuevo.
  message_at_one_second: Demasiadas solicitudes. Espera 1 segundo e intenta de nuevo.
  countdown: N is the whole seconds of the 429's Retry-After, counting down once per second; without a Retry-After, or
    with one that is not a positive whole number, N starts at 60, the window of every panel limit; never more than one
    hour
  accessibility: the visible countdown is a timer, read on request and never announced by itself; the application
    shell announces the message once per wait, politely, with the seconds the server asked for
  waits: one per limited operation, in the tab's memory only (another tab has its own); a wait never holds an unrelated
    limit; every screen of the tab that calls the same operation waits with it (for example "Buscar guía" and Órdenes);
    an organization switch keeps it, because the limits are per user
  send_screens: (Q6, Q13) the buttons of the screen that send the limited operation are disabled during the wait and
    re-enable themselves when N reaches 0, and the message disappears; what the person entered stays (file, report,
    form fields, selection, typed guía); nothing is sent again by itself, a write never; pressed again with the same
    submission it sends the same Idempotency-Key and payload (the 429 came before the handler, the rule of a request
    without a valid answer), and a changed submission gets a new key
  self_refreshing_screens: (Q11, Q14, Q16) the message appears with the countdown; every automatic reload pauses (30 s
    polling, realtime, the page becoming visible or focused, the read after an action); "Actualizar" and "Cargar más"
    are disabled; a filter, queue or search change is kept on screen without being sent; at 0 the screen reloads once,
    by itself, with what is on screen then, the buttons re-enable and the message disappears; a wait for any operation
    the screen reads pauses the whole screen with one message, and the counts shown before stay; a realtime reconnect
    waits out the wait, then reads and resynchronizes as before
  driver_lists: (Q10, Q15) the order's driver picker asks for its first list once, by itself, at 0; a bulk assignment
    order that met the 429 keeps its "Reintentar", disabled until 0 and never sent by itself, and the orders not read
    yet are read after the wait; the per-order read is unchanged
  realtime_reloads: (Q9) a screen that reloads on realtime notices gathers them into at most one reload every 3 seconds
    per tab - after its existing debounce, no sooner than 3 seconds after its previous reload of any kind; a notice
    that arrives during the spacing is read by the reload that ends it, and the notices of a server wait by the reload
    at 0; the 60 per minute limits do not change and a change shows up to 3 seconds later
  screens:
    /ops/dashboard: operations dashboard and getOperationsQueueCounts (refreshes itself; realtime)
    /ops/inbox: operations dashboard and getOperationsQueueCounts (refreshes itself; realtime); listAssignableDrivers in
      the driver picker and "Asignar seleccionadas…"
    /ops/orders/:id: operations dashboard (refreshes itself; realtime); listAssignableDrivers in the assignment picker
    /ops/orders: listOrders (refreshes itself)
    /finance/cod: listOrders, the pending list (reloads once at 0)
    /ops/orders/new: createQuote ("Calcular precio")
    /ops/orders/import: previewOrderCsv and commitOrderCsv, one wait
    /finance/settlements: exportSettlementCsv ("Exportar CSV")
    /ops/routes: listOrders ("Agregar entrega"); realtime RouteChanged, not limited
    app shell: listOrders ("Buscar guía")
driver_location:
  batch_size: 1-20
  response: per-item accepted/duplicate/rejected
  offline: retain until REST confirms each client_event_id
proof_flow:
- request signed upload session
- upload directly to object storage
- wait for READY/validation
- finalize proof metadata and transition
