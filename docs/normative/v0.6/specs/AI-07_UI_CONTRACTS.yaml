  work_inbox:
    release: MVP-1
    route: /ops/inbox
    decision: UI-PHASE3-INBOX-2026-10-10
    decision_amendments:
    - UI-PHASE3-INBOX-TOTAL-2026-10-10
    - UI-PHASE3-INBOX-PRICE-REVIEW-BULK-2026-10-11
    - UI-PHASE3-INBOX-BULK-ADD-TO-ROUTE-2026-10-11
    - UI-PHASE3-INBOX-CREATE-ROUTE-2026-10-11
    - UI-PHASE3-ROUTES-DAILY-2026-10-12
    authority: REST API + PostgreSQL
    sources:
      counts: GET /operations/queue-counts (getOperationsQueueCounts)
      list: GET /operations/dashboard (OBS-001 read model, ADR-OBS-001, not declared in AI-05) with its filters only -
        unassigned, price_review (UI-PHASE3-INBOX-PRICE-REVIEW-BULK-2026-10-11), status, service_type,
