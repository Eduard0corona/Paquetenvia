      ignored when absent and, when present, a strict UTC instant (YYYY-MM-DDTHH:mm:ss, 0 to 7 fractional digits, Z
      or +00:00) or the response is refused; so the API can add Order.created_at in any deployment order. The API
      sends it on every Order since ORD-ORDER-CREATED-AT-2026-10-12 and the readers keep accepting its absence, so
      either side can be deployed or rolled back first
    recovery:
    - load, Actualizar and every filter change read the first page again; a filter change drops the previous rows at
      once; the page becoming visible and window focus read it again only while a single page is shown (never while
      hidden and never twice within 5 seconds); optimistic UI is never authoritative
    - a 401 or 403 clears the rows; a 409 INVALID_REQUEST says the server did not accept the filters
    privacy:
    - no browser persistence and no client logging; an organization switch clears the list and the guía search
    - no internal identifier, address, contact, phone or other personal data is shown; the order id is only the link
      target
    forbidden:
    - changing an order from the list (no transitions, assignments or bulk actions)
    - a search criterion other than the exact guía
    not_supported:
    - FINANCE "Órdenes (lectura)" of the approved menu - the owner answered "No por ahora (Recommended)", so FINANCE
      keeps seeing only the COD-pending orders on its own screen and has no Órdenes item; widening its read access is
