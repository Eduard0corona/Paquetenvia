- id: OPS-003
  title: Limpieza de idempotencia y sesiones expiradas
  priority: P1
  release: MVP-1
  depends_on:
  - OPS-001
  - POD-001
  outputs:
  - scheduled cleanup job
  - metrics and dry-run command
  implementation:
    decisions:
    - OPS-003-OFFLINE-72H
    - OPS-003-CLEANUP-ROLE
    - OPS-003-SERVER-72H-REJECTION
    - OPS-003-INCIDENT-72H-UNIFICATION-CONFIGURABLE-2026-09-27
    - OPS-003-INCIDENT-AGE-CAP-72H-2026-09-27
    role: paqueteria_cleanup_executor NOLOGIN BYPASSRLS (AI-18 assertions 13-16)
    functions:
    - security.purge_expired_idempotency_keys(timestamptz,integer,boolean) - batch 1..5000, fixed 72-hour floor on
      created_at, expired keys only, dry-run counts without mutation, returns a count only
    - security.expire_proof_upload_sessions(integer) - batch 1..1000, CREATED/UPLOADED/VALIDATING/READY sessions whose
      expires_at is not after now become EXPIRED, SKIP LOCKED, returns a count only
    migration: Custody lane 20260927000100_AddOperationalCleanupExecutor
    worker_jobs: OperationalCleanup IdempotencyKeys and ProofUploadSessions on the shared IJobScheduler, disabled by
      default, idempotency purge in dry-run by default
    server_rejection: transitionOrder and createProofUploadSession accept an optional client_occurred_at and
      finalizeProof uses captured_at; a timestamp older than 72 hours is rejected with 409 OFFLINE_OPERATION_EXPIRED,
      one beyond the configurable clock tolerance (0-300 s, default 300 s) is an invalid request (AI-05
      x-offline-operation-age)
    incident_rejection: openIncident applies the same rule to occurred_at with its own configurable limits
      (Incidents:MaximumOccurrenceAgeHours, default 72 h, 1-72 h, only downward; Incidents:MaximumOccurrenceSkewMinutes, default 5
      min, 0-60 min); an older report is 409 OFFLINE_OPERATION_EXPIRED before the incident service, one beyond the
      tolerance stays 409 INVALID_REQUEST
    extension_point: the BFF session purge joins the cleanup executor with its own Custody migration
      (20260927000400_AddBffSessionPurge, security.purge_bff_sessions(integer)) after the Identity lane creates
      identity.bff_sessions (BFF-SESSION-TABLE-SHAPE)
  acceptance_criteria:
  - expired idempotency keys are deleted in bounded batches
  - expired upload sessions are marked EXPIRED and quarantined objects follow retention policy
  - job is idempotent and tenant-safe
  - 'DECIDED OPS-003-OFFLINE-72H (literal): Una operación offline de la PWA puede reintentarse hasta 72 horas; después
    se descarta y se avisa al conductor. Las llaves de idempotencia se purgan después de ese plazo.'
  - 'DECIDED OPS-003-SERVER-72H-REJECTION: the server, not only the client, rejects an offline operation whose client
    occurred_at is older than 72 hours, so a purged idempotency key can never let a stale replay execute twice'
  - 'DECIDED OPS-003-CLEANUP-ROLE: cleanup runs through paqueteria_cleanup_executor NOLOGIN BYPASSRLS (ADR-034 pattern),
    which owns only security.purge_expired_idempotency_keys(timestamptz,integer,boolean) with a 72-hour floor,
    security.expire_proof_upload_sessions(integer) and the BFF session purge, with exact column grants and EXECUTE only
    for paqueteria_worker; translation to AI-06/AI-18 ships with its migration in the implementation PR'
