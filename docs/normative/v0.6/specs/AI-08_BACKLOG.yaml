- id: OBS-003
  decision: PHASE4-PLATFORM-APPROVAL-2026-10-12, OBS-003-TELEMETRY-APPINSIGHTS-2026-10-12, OBS-003-TENANT-PSEUDONYM-2026-10-12, OBS-003-APPINSIGHTS-EXPORT-2026-10-13 and OBS-003-OUTBOX-TRACE-CONTEXT-2026-10-13 (project owner)
  epic: Observability
