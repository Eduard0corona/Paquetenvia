  - 429 application/problem+json (AI-05 TooManyRequests) with Retry-After for every policy, GPS ingestion and SignalR negotiate included, which today answer 429 with an empty body (phase 4 PR 2)
  - per-user limits on the decided heavy endpoints and the per-network sign-in limit, with 429 declared in AI-05 on every limited operation and in ADR-OBS-001 for the dashboard (phase 4 PR 3)
  - the approved 429 behavior of the driver app queue and the /auth/login page, with the server limits (phase 4 PR 3), and of every limited panel screen (AI-07), after them (phase 4 PR 3, web part)
  acceptance_criteria:
  - 'DECIDED PHASE4-PLATFORM-APPROVAL-2026-10-12: rate limits on heavy endpoints come first in phase 4, with OpenTelemetry and correlation'
  - 'DECIDED SEC-004-RATE-LIMITS-2026-10-12 (literal): "Lista corta y generosa (Recommended)" - "Por usuario: CSV 10/min (1 importación a la vez), exportar liquidación 10/min, crear dirección (cuesta Google) 30/min, fotos 30–60/min, tablero y conteos 60/min, lista de órdenes 120/min, cotizar 60/min, repartidores asignables 60/min; inicio de sesión 20/min por red. Se ajusta tras 2 semanas con métricas."'
  - every 429 the API writes, public tracking, GPS ingestion and SignalR negotiate included, is application/problem+json per AI-05 TooManyRequests with a Retry-After header in whole seconds; public tracking keeps its uniform body and telemetry
  - per-user partitions use a hash of the authenticated subject, never the raw subject; the sign-in partition is the client network (IPv4 address or IPv6 /64, ClientNetworkPartition); no partition key reaches logs, traces or metrics
  - every limited operation declares 429 in AI-05, and the HTTP surface coverage test keeps requiring every emitted 429 to be declared
  - the limits are configuration validated at start; rejections are counted per policy name only and are visible in the pilot workspace from the first deployment of the limits; a later owner decision re-sets the numbers after two weeks of pilot metrics
  - the existing public tracking, SignalR connection, GPS ingestion and recipient call limits keep their numbers
  - limiter state lives in the API process; the pilot runs exactly one API replica (GATE-013), so a second API replica needs shared limiter state or a recorded owner decision
  - 'DECIDED SEC-004-HEAVY-ENDPOINT-MAPPING-2026-10-12 (literal answers): CSV "Compartido, 1 a la vez (Recommended)", fotos "60 cada paso (Recommended)", tablero y conteos "Uno cada uno (Recommended)", inicio de sesión "Solo /auth/login (Recommended)" - previewOrderCsv and commitOrderCsv spend one budget of 10 per minute per user together and, while a commit of a user is in flight, another commit of that user is rejected until the first finishes; createProofUploadSession and finalizeProof 60 per minute each per driver; GET /operations/dashboard and getOperationsQueueCounts 60 per minute each, separate budgets; exportSettlementCsv 10, createLocation 30, listOrders 120, createQuote 60 and listAssignableDrivers 60 per minute per user; only startAuthCenterSignIn (GET /auth/login) is limited, 20 per minute per client network, and the /signin-authcenter callback is not'
  - 'DECIDED OBS-001-DASHBOARD-429-2026-10-12 (literal answer): "Enmendar ADR-OBS-001 (Recommended)" - the dashboard records its 429, with the shape of every other 429 of the API, in an ADR-OBS-001 amendment that lists its error responses, and the HTTP surface coverage test checks the dashboard against that list instead of skipping it'
  - 'DECIDED SEC-004-HEAVY-ENDPOINT-MAPPING-2026-10-12 (literal answer on the texts): "Mensaje común con espera (Recommended)" - the panel shows "Demasiadas solicitudes. Espera N segundos e intenta de nuevo." with N from Retry-After and the button re-enables itself when N runs out; the driver app queue waits what the server says and retries without a message; a browser navigating to /auth/login sees a simple page "Demasiados intentos de inicio de sesión desde esta red. Espera un minuto e intenta de nuevo." (AI-07)'
  - 'DECIDED SEC-004-RETRY-AFTER-2026-10-13 (literal answer): "Sí, agregarlo (Recommended)" - public tracking''s 429 also says how long to wait (phase 4 PR 2), and AI-05 TooManyRequests declares the Retry-After header (phase 4 PR 3)'
  - 'DECIDED SEC-004-REJECTION-SUMMARY-2026-10-13 (literal answer): "Resumen en los logs (Recommended)" - the rejections per policy are visible from the first deployment of the limits through one OBS-002 log event per policy and minute with rejections (RateLimitSummary, 4604, dimensions Policy and Rejected; registry policy names only, never a user, subject, address or partition key); no alert or workbook reads it until a later owner decision'
